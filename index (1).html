    "content": "# Draw._shapes Module Documentation\n\n`Draw._shapes` (`Draw.shape` / `Draw.shapes`) is the geometry-first vector, raster, and multimedia rendering engine for the `Draw` library. Built on PySide6 transparent canvas architecture (`_DrawCanvas`), it provides high-performance custom shape generation, edge deformations, mesh warping, boolean-like hole exclusions, symmetry mirroring, layout and collision management, interactive hit testing, keyboard focus navigation, and hardware video playback.\n\n---\n\n## Table of Contents\n1. [Overview & Core Architecture](#overview--core-architecture)\n2. [Public API & Registries Reference](#public-api--registries-reference)\n   - [`Draw.shape(...)` / `Draw.shapes(...)`](#drawshape--drawshapes)\n   - [`Draw.hitbox(...)`](#drawhitbox)\n   - [`Draw.container(...)`](#drawcontainer)\n   - [`Draw.image(...)`](#drawimage)\n   - [`Draw.video(...)`](#drawvideo)\n3. [Shape Geometry & Styling Parameters](#shape-geometry--styling-parameters)\n4. [Edge Deformations & Curve Modes](#edge-deformations--curve-modes)\n5. [Advanced Geometry Modifiers](#advanced-geometry-modifiers)\n   - [`bend` (Per-Side Quadratic Deformation)](#1-bend-per-side-quadratic-deformation)\n   - [`exclude` (Hole Cutouts & Ribbon Channels)](#2-exclude-hole-cutouts--ribbon-channels)\n   - [`warp` (2D Mesh Warp Deformation)](#3-warp-2d-mesh-warp-deformation)\n   - [`symmetry` (Radial & Mirror Duplication)](#4-symmetry-radial--mirror-duplication)\n   - [`custom_vertices` (Arbitrary Polygons & Slices)](#5-custom_vertices-arbitrary-polygons--slices)\n6. [Layout Anchoring & Hitbox Region Placement](#layout-anchoring--hitbox-region-placement)\n7. [Collision Avoidance & Flow Systems](#collision-avoidance--flow-systems)\n8. [Performance & Multi-Tier Caching Architecture](#performance--multi-tier-caching-architecture)\n9. [Interactivity, Focus Navigation & Accessibility](#interactivity-focus-navigation--accessibility)\n10. [Built-in Widgets (Scroller & Builder)](#built-in-widgets-scroller--builder)\n11. [In-Place Updates (`sub_edit`) & Batch Text Interleaving](#in-place-updates-sub_edit--batch-text-interleaving)\n12. [Lifecycle & Resource Disposal](#lifecycle--resource-disposal)\n13. [Comprehensive Code Examples](#comprehensive-code-examples)\n\n---\n\n## Overview & Core Architecture\n\nThe `Draw._shapes` engine is centered around `_DrawCanvas` (a transparent `QWidget` overlaying a `QMainWindow`) and `ShapeDef` data structures.\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                   Draw.shape() API                       \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                            \u2502 parses shape dicts into\n                            \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                        ShapeDef                          \u2502\n\u2502   (Geometry, Color, Curves, Bends, Exclude, Motion State)\u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                            \u2502 stored in\n                            \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                      _DrawCanvas                         \u2502\n\u2502 - Z-ordered descending sorting & interleaved text pass  \u2502\n\u2502 - Persistent global occupied collision registry          \u2502\n\u2502 - Multi-tier path/bbox/shadow pixmap caching             \u2502\n\u2502 - Mouse, wheel, touch & keyboard focus dispatch          \u2502\n\u2502 - Top-down hit testing & builder sizing pipeline         \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n## Public API & Registries Reference\n\n### `Draw.shape(...)` / `Draw.shapes(...)`\n\nPrimary entry point to define, place, or update shapes and companion text elements on a display window canvas.\n\n```python\nDraw.shape(\n    display       = \"window_tag\",    # Target window identifier (or tag=...)\n    ip            = \"default_ip\",    # Canonical IP kwarg (or shape_ip=...)\n    shape         = [{...}],          # List of shape specification dicts (or shapes=...)\n    text          = [{...}],          # List of text specification dicts\n    sub_edit      = \"ip_name\",        # In-place update existing shapes/text by IP (str or list[str])\n    properties    = [\"scroller\"],     # Widget descriptors (e.g. \"scroller\", \"builder\")\n    place_with_ip = \"region_ip\",      # Confine shapes inside a registered region\n    hit_box       = \"region_ip\",      # Call-level alias for place_with_ip\n    get_ip        = \"layout_ip\",      # Anchor to layout specification (or shape_get_ip=...)\n    area          = [{\"expand\": (0,0), \"move\": \"right\"}], # Global area collision spec\n    list_spec     = [...],            # Auto-generate list shapes and text definitions\n    show          = True,             # Display flag\n    **shape_props,                    # Single-shape shorthand keyword arguments\n)\n```\n\n#### Single-Shape Shorthand & Return Value\nWhen keyword arguments representing shape attributes (such as `width=`, `height=`, `type=`, `color=`, etc.) are supplied directly to `Draw.shape()`, they are automatically wrapped into a single shape definition:\n\n```python\ns = Draw.shape(display=\"win\", ip=\"btn\", vertices=4, size=[140, 44], color=\"cyan\")\n```\n\n**Return Values:**\n- Returns a single `ShapeDef` instance if exactly one shape was created.\n- Returns a `List[ShapeDef]` if multiple shapes were created.\n- Returns the updated `ShapeDef` object(s) when `sub_edit` successfully modifies existing shapes.\n- Returns `None` if only text items were processed or no matching `sub_edit` target was found.\n\n#### Registry Helper Methods on `Draw.shapes` / `Draw.shape`\n* `Draw.shapes.get_by_ip(display: str, ip: str) -> Optional[ShapeDef]`: Finds and returns the active `ShapeDef` matching `ip` on the specified window canvas.\n* `Draw.shapes.list_shapes(display: str) -> List[ShapeDef]`: Returns a list of all active `ShapeDef` objects on the window canvas.\n* `Draw.shapes.remove(display: str, index: int)`: Removes and disposes the shape at the given index.\n* `Draw.shapes.remove_by_ip(display: str, ip: str) -> int`: Removes and disposes all shapes matching `ip`. Returns the count of removed shapes.\n* `Draw.shapes.clear(display: str)`: Disposes all shapes and clears all incremental rendering caches on the specified window.\n\n---\n\n### `Draw.hitbox(...)`\n\nRegisters named bounding boxes and clipping regions for hit testing and coordinate placement.\n\n```python\nDraw.hitbox(\n    ip   = \"sidebar_region\",    # Unique region identifier (or tag=...)\n    mode = \"resetgeometry\",     # \"resetgeometry\" (world coords) or \"fullgeometry\" (relative coords)\n    type = \"resetgeometry\",     # Alias for mode\n    box  = [{\"x\": 10, \"y\": 10, \"width\": 250, \"height\": 600}], # Bounding box dict or list\n)\n```\n\n#### Registry Helper Methods on `Draw.hitbox`\n* `Draw.hitbox.get(ip: str) -> Optional[dict]`: Returns the stored hitbox definition dict (`x`, `y`, `width`, `height`, `mode`).\n* `Draw.hitbox.list() -> Dict[str, dict]`: Returns a copy of all registered hitbox definitions.\n* `Draw.hitbox.clear(ip: Optional[str] = None)`: Clears a specific hitbox by IP, or flushes all registered hitboxes when `ip=None`.\n\n---\n\n### `Draw.container(...)`\n\nBackward-compatible helper that generates a 4-sided rectangular container shape:\n\n```python\nDraw.container(\n    display   = \"win\",\n    width     = 400,\n    height    = 300,\n    ip        = \"main_panel\",\n    customise = {\"color\": \"#1e293b\", \"border_radius\": 12},\n)\n```\n\n---\n\n### `Draw.image(...)`\n\nRenders raster and vector image assets (PNG, JPG, GIF, BMP, SVG) directly on the transparent canvas with optional corner rounding and opacity:\n\n```python\nDraw.image(\n    display       = \"win\",\n    src           = \"assets/avatar.png\", # Image file path (or source=...)\n    size          = [120, 120],          # [w, h] or single int (or width=..., height=...)\n    x             = 50,                  # Absolute X coordinate (None for alignment)\n    y             = 50,                  # Absolute Y coordinate (None for alignment)\n    align         = \"center\",            # Canvas alignment string\n    opacity       = 100,                 # 0 to 100\n    border_radius = \"50%\",               # Corner rounding px or percentage\n    ip            = \"avatar_img\",        # Identity tag\n    customise     = {},                  # Extra styling overrides\n)\n```\n\n---\n\n### `Draw.video(...)`\n\nEmbeds native hardware-accelerated video playback (MP4, AVI, MKV, MOV, WebM) into the canvas using Qt's `QMediaPlayer` and `QVideoSink`:\n\n```python\nDraw.video(\n    display   = \"win\",\n    src       = \"media/intro.mp4\", # Video file path (or source=...)\n    size      = [640, 360],        # [w, h] (or width=..., height=...)\n    x         = None,\n    y         = None,\n    align     = \"center\",\n    opacity   = 100,\n    loop      = True,              # Loop playback indefinitely\n    autoplay  = True,              # Begin playback on creation\n    muted     = False,             # Audio mute state\n    ip        = \"bg_video\",\n    customise = {},\n)\n```\n\n---\n\n## Shape Geometry & Styling Parameters\n\nEvery dictionary inside `shape=[...]` (or passed as shorthand kwargs) supports the following properties:\n\n| Parameter | Type | Default | Description |\n| :--- | :--- | :--- | :--- |\n| `vertices` | `int` \\| `None` | `None` (Rect) | Number of polygon sides (3+). `None` or `4` = Rectangle. `2` = Line segment. `1` = Circle point. |\n| `size` | `[w, h]` \\| `int` \\| `str` | `[parent*0.5, parent*0.5]` | Shape size in pixels (`[200, 150]`), percentage (`\"50%\"`), or pixel string (`\"200px\"`). |\n| `width`, `height` | `int` \\| `str` | `None` | Alternative separate dimensions if `size` is not supplied. |\n| `x`, `y` | `int` \\| `None` | `None` | Absolute canvas pixel coordinates. Overrides `align` when set. |\n| `align` | `str` | `\"center\"` | Alignment (`\"top-left\"`, `\"center\"`, `\"bottom-right\"`, or dynamic anchor `\"ip:other_shape\"`). |\n| `rotation` | `float` | `0.0` | Rotation angle in degrees clockwise. |\n| `border_radius` | `int` \\| `str` | `0` | Corner rounding in px (`10`) or percentage (`\"50%\"` for circular caps). |\n| `color` | `str` \\| `tuple` | `\"blue\"` | Body fill color (named color, HEX `#RRGGBB`, RGB, RGBA tuple). |\n| `border_color` | `str` \\| `tuple` | `\"black\"` | Stroke outline color. |\n| `border_width` | `int` | `0` | Border thickness in pixels. |\n| `border_style` | `str` | `\"solid\"` | Outline style: `\"solid\"`, `\"dashed\"`, `\"dotted\"`, or `\"none\"`. |\n| `opacity` | `int` | `100` | Opacity from `0` (transparent) to `100` (fully opaque). |\n| `z` | `int` | `next_z()` | Layer depth. Higher values are drawn further back; lower/negative values are rendered in front. |\n| `overlap` | `bool` | `True` | If `False`, collision avoidance automatically shifts the shape away from occupied shapes. |\n| `flow` | `dict` | `None` | Advanced collision avoidance flow specification. |\n| `area` | `dict` \\| `list` | `None` | Collision expansion buffer and preferred shift direction (`expand`, `move`). |\n| `ip` | `str` | `None` | Unique identifier tag for senses, animations, layout references, and `sub_edit`. |\n| `curve_mode` | `str` | `\"line\"` | Edge rendering style (`\"line\"`, `\"smooth\"`, `\"slope\"`, `\"arc\"`, `\"wave\"`, `\"bend_all\"`). |\n| `bend_amount` | `float` | `40.0` | Strength in pixels for `curve_mode=\"bend_all\"` (positive = bulge out, negative = pinch in). |\n| `bend` | `list[dict]` | `[]` | Targeted per-side quadratic bezier displacements. |\n| `exclude` | `list[dict]` | `[]` | Cutout holes and ribbon channels. |\n| `warp` | `list[list]` | `None` | 2D mesh warp displacement grid of `(dx, dy)` vectors. |\n| `symmetry` | `dict` | `None` | Radial repeat or mirror axis symmetry. |\n| `custom_vertices`| `list[tuple]`| `None` | Explicit coordinate list `[(x, y), ...]` for arbitrary polygons and pie/donut wedges. |\n| `hitbox_mode` | `str` | `None` | Hitbox calculation mode (`None`, `\"shape\"`, `\"closed_rec\"`). |\n| `hit_box` | `str` | `\"shape\"` | Shape-level hit testing mode (`\"shape\"` for exact contour, `\"closed_rec\"` for bounding box). |\n| `layout` / `get_ip`| `str` | `None` | Layout IP anchor for grid/table placement. |\n| `column` / `columns`| `tuple` \\| `str` | `None` | Grid cell reference (e.g. `(row, col)`, `\"A1\"`, or column name). |\n| `inside` | `str` | `None` | Interactive drag boundary constraint (region IP). |\n| `move_path` | `str` | `None` | Interactive drag path constraint. |\n| `locked` | `bool` | `False` | Locks shape against interactive dragging and position shifts. |\n| `type` | `str` | `\"vector\"` | Element rendering type: `\"vector\"`, `\"image\"`, or `\"video\"`. |\n| `src` | `str` | `None` | File source path for image or video elements. |\n| `loop` | `bool` | `True` | Video playback loop toggle. |\n| `autoplay` | `bool` | `True` | Video playback autoplay on canvas mount. |\n| `muted` | `bool` | `False` | Video audio muting toggle. |\n| `custom` / `customise` | `dict` | `None` | Alternative nested container for modifiers (`bend`, `exclude`, `warp`, `symmetry`). |\n\n---\n\n## Edge Deformations & Curve Modes\n\nThe `curve_mode` attribute dictates how polygon vertices and connecting edges are rendered:\n\n* **`\"line\"`** *(default)*: Standard straight edges between polygon vertices.\n* **`\"smooth\"`**: Applies a closed Catmull-Rom spline interpolation through all vertices with uniform tension.\n* **`\"slope\"`**: Applies an outward quadratic parabolic bulge to every side.\n* **`\"arc\"`**: Applies an inward circular arc to every side.\n* **`\"wave\"`**: Renders a multi-cycle sinusoidal wave displacement along each side.\n* **`\"bend_all\"`**: Applies a uniform outward or inward quadratic bezier arc to all sides simultaneously, scaled by `bend_amount`.\n\n```python\nDraw.shape(\n    display=\"win\",\n    shape=[{\n        \"vertices\": 6,\n        \"size\": [220, 220],\n        \"curve_mode\": \"bend_all\",\n        \"bend_amount\": 25.0, # Bulges all 6 sides outward by 25px\n    }]\n)\n```\n\n---\n\n## Advanced Geometry Modifiers\n\n### 1. `bend` (Per-Side Quadratic Deformation)\nApplies targeted quadratic bezier curves to specific 1-indexed polygon sides:\n\n```python\n\"bend\": [\n    {\n        \"side\": 1,                     # 1-indexed side number\n        \"affect\": \"-100% -> 100%\",      # Span: -100% = start vertex, 0% = midpoint, 100% = end vertex\n        \"offset\": 35,                  # Peak displacement in pixels\n        \"direction\": \"out\",            # \"out\" (pushes outward) or \"in\" (pinches inward)\n    }\n]\n```\n\n### 2. `exclude` (Hole Cutouts & Ribbon Channels)\nCuts out geometric holes or strokes ribbon channels using an independent local coordinate system:\n\n```python\n\"exclude\": [\n    {\n        \"scale\": [100, 100],           # Local coordinate space\n        \"let_it\": \"center\",            # Anchor: \"center\", \"top-left\", \"top\", \"top-right\", \"left\", \"right\", \"bottom-left\", \"bottom\", \"bottom-right\"\n        \"1\": {\n            \"line\": \"-30,-30  30,-30  30,30  -30,30\", # Local polygon coordinates\n            \"edges\": \"10,10,10,10\",                   # Per-corner rounding radius\n            \"width_between\": \"0px\",                   # \"0px\" = filled hole; \">0px\" = stroked ribbon hole\n            \"curve_mode\": \"line\",                     # \"line\" or \"smooth\"\n        }\n    }\n]\n```\n\n### 3. `warp` (2D Mesh Warp Deformation)\nDistorts the shape geometry using a 2D grid of displacement vectors with continuous bilinear interpolation:\n\n```python\n\"warp\": [\n    [(0, 0), (-25, 25)],  # Row 0 (Top):    [top-left displacement, top-right displacement]\n    [(0, 0), (0, 0)],     # Row 1 (Bottom): [bottom-left displacement, bottom-right displacement]\n]\n```\n\n### 4. `symmetry` (Radial & Mirror Duplication)\nDuplicates and transforms geometry radially or across mirror planes:\n\n```python\n# Radial Symmetry\n\"symmetry\": {\n    \"type\": \"radial\",\n    \"count\": 6,       # Number of radial repetitions (rotates around center)\n}\n\n# Mirror Symmetry\n\"symmetry\": {\n    \"type\": \"mirror\",\n    \"axis\": \"vertical\", # \"vertical\", \"horizontal\", or \"diagonal\"\n}\n```\n\n### 5. `custom_vertices` (Arbitrary Polygons & Slices)\nAllows passing explicit coordinates `[(x, y), ...]` to render arbitrary non-regular polygons, pie wedges, donut slices, and dynamic path animations:\n\n```python\nDraw.shape(\n    display=\"win\",\n    ip=\"pie_wedge\",\n    shape=[{\n        \"custom_vertices\": [\n            (200, 200), # Center\n            (300, 200), # Perimeter point 1\n            (270, 270), # Perimeter point 2\n        ],\n        \"color\": \"gold\",\n    }]\n)\n```\n\n---\n\n## Layout Anchoring & Hitbox Region Placement\n\n### Dynamic Anchoring (`align=\"ip:<target>\"`)\nShapes can dynamically anchor their position relative to another shape's live geometry using the `ip:` prefix:\n\n```python\n# Place badge 10px below the header shape\nDraw.shape(display=\"win\", ip=\"header\", size=[300, 60], align=\"center\")\nDraw.shape(display=\"win\", ip=\"badge\", size=[80, 24], align=\"ip:header\")\n```\n\n### Hitbox Region Placement (`place_with_ip` / `hit_box`)\nConfines shapes inside a region defined by a registered `Draw.hitbox` or an existing `ShapeDef`:\n\n* **`resetgeometry` Mode**: Coordinates in shape dicts (`x`, `y`) are treated as pixel offsets relative to the region's top-left corner.\n* **`fullgeometry` Mode**: In addition to offset calculation, automatically defaults missing `width`/`height` to the region's full dimensions.\n\n```python\nDraw.hitbox(ip=\"card\", mode=\"fullgeometry\", box={\"x\": 50, \"y\": 50, \"width\": 300, \"height\": 400})\n\nDraw.shape(\n    display=\"win\",\n    place_with_ip=\"card\",\n    shape=[\n        {\"x\": 20, \"y\": 20, \"size\": [260, 40], \"color\": \"#334155\"}, # 20px relative to card top-left\n    ]\n)\n```\n\n---\n\n## Collision Avoidance & Flow Systems\n\nWhen `overlap=False` or a `flow` dictionary is specified, shapes automatically resolve collisions and shift to non-overlapping positions:\n\n```python\n\"flow\": {\n    \"enabled\": True,\n    \"role\": \"item\",       # \"item\" (avoids others), \"obstacle\" (blocks others), or \"ignore\"\n    \"scope\": \"window\",    # \"window\" (canvas-wide) or \"cell\" (confined to layout grid cell)\n    \"strategy\": \"stack\",  # Placement strategy\n}\n```\n\nThe `area` parameter controls collision padding and directional shifts:\n```python\n\"area\": [\n    {\n        \"expand\": (10, 10),    # Adds 10px buffer on X and Y axes\n        \"move\": \"right_wrap\",  # Shift direction: \"right\", \"left\", \"down\", \"up\", \"right_wrap\", \"down_wrap\"\n    }\n]\n```\n\n---\n\n## Performance & Multi-Tier Caching Architecture\n\n`_shapes.py` utilizes a 3-tier caching system and zero-allocation updates to maintain a smooth 60 FPS rendering pipeline:\n\n1. **Path Cache (`_path_cache`)**:\n   - Stores pre-compiled `QPainterPath` geometry.\n   - Rebuilding (polygons, bends, exclude cutouts, symmetry) executes **only** when `shape.dirty = True` or a key in `_PATH_AFFECTING_KEYS` changes.\n   - Positional shifts (`x`, `y`, dragging, scrolling) reuse `_path_cache` with a zero-allocation `translated()` call.\n\n2. **Bounding Box Cache (`_bbox_cache`)**:\n   - Caches parsed geometry `(sw, sh, ox, oy)` keyed by `(cw, ch, size_raw, x, y, align)`.\n\n3. **Shadow & Glow Pixmap Cache (`_shadow_cache`)**:\n   - Multi-pass blurred Gaussian shadows and glows are rendered once into an offscreen transparent `QPixmap` buffer and blitted directly on subsequent frames.\n\n4. **Incremental Rendering & Content Hashing (`_shape_hash_by_ip`)**:\n   - Re-submitting identical shape dictionaries evaluates a fast content hash; identical items skip allocation and repaint entirely.\n\n5. **Compilable Protocol (`@compilable`)**:\n   - Implements `_sig()`, `_is_dirty()`, and `_compile()` to support pre-warming geometry caches via `Draw._optimize.optimize()`.\n\n---\n\n## Interactivity, Focus Navigation & Accessibility\n\n`_DrawCanvas` provides top-down event hit testing and accessibility support:\n\n* **Hit Testing**: `_shape_contains_point` performs exact vector path contour hit testing when `hit_box=\"shape\"`, or bounding box testing when `hit_box=\"closed_rec\"`.\n* **Keyboard Focus Navigation**:\n  * **Tab / Shift+Tab**: Cycles keyboard focus linearly across interactive shapes and text elements.\n  * **Arrow Keys (Up/Down/Left/Right)**: Spatial directional focus navigation to the nearest adjacent element.\n  * **Enter / Return / Space**: Activates the currently focused shape (triggers `mouse_click`, `mouse_leftclick`, `mouse_press`, `mouse_release` senses).\n  * **Focus Indicator**: Focused shapes render an accessible dashed blue outline (`#4285F4`).\n* **Drag Constraints**:\n  * `inside=\"region_ip\"`: Restricts dragging within a specified boundary.\n  * `move_path=\"path_ip\"`: Constrains movement along a predefined track.\n  * `locked=True`: Disables interactive manipulation.\n\n---\n\n## Built-in Widgets (Scroller & Builder)\n\n### 1. Scroller Overlay (`properties=[\"scroller\"]`)\nGenerates interactive scrollbar tracks and dynamic thumb shapes synchronized to canvas scrolling:\n\n```python\nDraw.shape(\n    display=\"win\",\n    properties=[\"scroller\"],\n    shape=[{\n        \"place\": \"right\",          # \"right\", \"left\", \"top\", \"bottom\"\n        \"color\": \"#0f172a\",        # Track color\n        \"thumb_color\": \"#475569\",  # Thumb color\n        \"width\": 10,               # Scrollbar thickness\n    }]\n)\n```\n\n### 2. Drag-to-Size Builder Mode (`properties=[\"builder\"]`)\nQueues shape templates without explicit dimensions. The user's next left-click drag on the canvas interactively sizes and creates the shape:\n\n```python\nDraw.shape(\n    display=\"win\",\n    properties=[{\"type\": \"builder\", \"on_build\": lambda ip, x, y, w, h: print(f\"Created {ip} at {x},{y} {w}x{h}\")}],\n    shape=[{\n        \"ip\": \"user_rect\",\n        \"color\": \"teal\",\n        \"border_color\": \"white\",\n        \"border_width\": 2,\n    }]\n)\n```\n\n---\n\n## In-Place Updates (`sub_edit`) & Batch Text Interleaving\n\n### In-Place Modifications (`sub_edit`)\nModifies existing `ShapeDef` and `TextDef` objects non-destructively by matching `ip`, avoiding full canvas teardowns:\n\n```python\nDraw.shape(\n    display=\"win\",\n    sub_edit=\"my_button\",\n    shape=[{\n        \"color\": \"crimson\",\n        \"opacity\": 90,\n    }]\n)\n```\n\n### Batch Text Interleaving\n`Draw.shape(...)` accepts both `shape=[...]` and `text=[...]` simultaneously. Shapes and text elements are interleaved into a single Z-ordered draw queue (`paintEvent`), rendering text elements cleanly over shapes with matching Z layers:\n\n```python\nDraw.shape(\n    display=\"win\",\n    shape=[{\"ip\": \"card_bg\", \"size\": [200, 100], \"color\": \"#1e293b\", \"z\": 0}],\n    text=[{\"ip\": \"card_title\", \"text\": \"Analytics\", \"color\": \"white\", \"z\": 0, \"align\": \"center\"}],\n)\n```\n\n---\n\n## Lifecycle & Resource Disposal\n\nWhen removing shapes or clearing canvases, media players, audio outputs, video sinks, and frame buffers are safely freed via `ShapeDef.dispose()`:\n\n```python\n# Remove shape by index\nDraw.shapes.remove(\"win\", index=0)\n\n# Remove shape(s) by IP tag\nremoved_count = Draw.shapes.remove_by_ip(\"win\", \"intro_video\")\n\n# Clear canvas and dispose all media\nDraw.shapes.clear(\"win\")\n```\n\n---\n\n## Comprehensive Code Examples\n\n### 1. Complex Polygon with Per-Side Bending & Smooth Corner Cutouts\n```python\nimport Draw\n\nwin = Draw.window(title=\"Advanced Shapes\", size=[800, 600])\n\nDraw.shape(\n    display=\"main\",\n    shape=[{\n        \"ip\": \"custom_card\",\n        \"vertices\": 6,\n        \"size\": [320, 320],\n        \"align\": \"center\",\n        \"color\": \"#1e1e2e\",\n        \"border_color\": \"#cba6f7\",\n        \"border_width\": 3,\n        \"bend\": [\n            {\"side\": 1, \"affect\": \"-100% -> 100%\", \"offset\": 30, \"direction\": \"out\"},\n            {\"side\": 4, \"affect\": \"-100% -> 100%\", \"offset\": 30, \"direction\": \"in\"},\n        ],\n        \"exclude\": [{\n            \"scale\": [100, 100],\n            \"let_it\": \"center\",\n            \"1\": {\n                \"line\": \"-25,-25 25,-25 25,25 -25,25\",\n                \"edges\": \"8,8,8,8\",\n                \"curve_mode\": \"line\",\n            }\n        }],\n        \"shadow\": {\"color\": [0, 0, 0, 150], \"blur\": 20, \"offset\": (0, 8)},\n    }]\n)\n```\n\n### 2. Custom Pie Chart Segment with `custom_vertices`\n```python\nimport Draw\n\nwin = Draw.window(title=\"Pie Chart\", size=[500, 500])\n\nDraw.shape(\n    display=\"main\",\n    shape=[\n        {\n            \"ip\": \"slice_a\",\n            \"custom_vertices\": [(250, 250), (350, 250), (320, 320)],\n            \"color\": \"#f38ba8\",\n            \"border_color\": \"white\",\n            \"border_width\": 2,\n        },\n        {\n            \"ip\": \"slice_b\",\n            \"custom_vertices\": [(250, 250), (320, 320), (250, 350)],\n            \"color\": \"#89b4fa\",\n            \"border_color\": \"white\",\n            \"border_width\": 2,\n        },\n    ]\n)\n```\n\n### 3. Media Embedding (Image & Video)\n```python\nimport Draw\n\nwin = Draw.window(title=\"Media Canvas\", size=[900, 600])\n\n# Avatar image with 50% border-radius circular crop\nDraw.image(\n    display=\"main\",\n    ip=\"user_avatar\",\n    src=\"assets/user.png\",\n    size=[80, 80],\n    x=40,\n    y=40,\n    border_radius=\"50%\",\n)\n\n# Background looped video\nDraw.video(\n    display=\"main\",\n    ip=\"background_clip\",\n    src=\"media/ambient.mp4\",\n    size=[640, 360],\n    align=\"center\",\n    loop=True,\n    autoplay=True,\n    muted=True,\n    opacity=85,\n)\n```\n"
  },

    "content": "# Comprehensive Technical Documentation: `Draw._text` Module\n\n`Draw._text` (`Draw.text`, `Draw.lineedit`, `Draw.textedit`) is the typography, custom canvas text rendering, text-input emulation, and native text-editing subsystem of the **Draw** framework. It combines subpixel custom vector canvas painting (`_DrawCanvas`, `QPainter`, `QFontMetricsF`, `QPainterPath`) with native Qt input widgets (`QLineEdit`, `QTextEdit`).\n\n---\n\n## Table of Contents\n1. [Overview & Core Architecture](#overview--core-architecture)\n2. [Public API & Registries Reference](#public-api--registries-reference)\n   - [`Draw.text(...)` (`_TextRegistry`)](#drawtext-_textregistry)\n   - [`Draw.text.measure(...)`](#drawtextmeasure)\n   - [`Draw.text.register_font(...)`](#drawtextregister_font)\n   - [`Draw.text.update(...)` & `remove_by_ip(...)`](#drawtextupdate--remove_by_ip)\n   - [`Draw.lineedit(...)` (`_LineEditRegistry`)](#drawlineedit-_lineeditregistry)\n   - [`Draw.textedit(...)` (`_TextEditRegistry`)](#drawtextedit-_texteditregistry)\n3. [Text Styling & Typography Customization (`customise`)](#text-styling--typography-customization-customise)\n4. [Canvas Interactive Text Input (`properties`)](#canvas-interactive-text-input-properties)\n5. [Text-on-Arc, Outlines, Gradients & Per-Character Colors](#text-on-arc-outlines-gradients--per-character-colors)\n6. [Built-in Animation Modes (14 Types)](#built-in-animation-modes-14-types)\n7. [Collision Avoidance, Flow & Layout Integration](#collision-avoidance-flow--layout-integration)\n8. [Comprehensive Code Examples](#comprehensive-code-examples)\n\n---\n\n## Overview & Core Architecture\n\nThe `Draw._text` module operates across two distinct rendering paradigms:\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                     Draw.text API                        \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                \u2502                          \u2502\n      (Custom Canvas Painting)     (Native Input Widgets)\n                \u2502                          \u2502\n                \u25bc                          \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502            TextDef            \u2502\u2502 Draw.lineedit / textedit  \u2502\n\u2502 - Subpixel QFont typography   \u2502\u2502 - Native QLineEdit        \u2502\n\u2502 - Text-on-arc / Glyphs stroke \u2502\u2502 - Native QTextEdit        \u2502\n\u2502 - 14 animation modes          \u2502\u2502 - Full OS clipboard/IME   \u2502\n\u2502 - Simulated canvas typing     \u2502\u2502 - Embedded child widgets  \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                \u2502\n                \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502          _DrawCanvas          \u2502\n\u2502 - Interleaved Z-ordered draw  \u2502\n\u2502 - Collision avoidance pass    \u2502\n\u2502 - Reactive caret & focus state\u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n## Public API & Registries Reference\n\n### `Draw.text(...)` (`_TextRegistry`)\n\nRenders custom typography elements onto a window canvas:\n\n```python\nDraw.text(\n    display    = \"main\",              # Target window identifier (or tag=...)\n    text       = \"Hello World\",       # String, callable, Draw.live.text(...), or Draw.input.text\n    ip         = \"title_txt\",         # Unique identifier tag\n    customise  = {                    # Typography and styling dictionary\n        \"font_family\": \"Inter\",\n        \"font_size\": 28,\n        \"bold\": True,\n        \"color\": \"white\",\n        \"align\": \"center\",\n    },\n    properties = {},                  # Optional canvas text-input configuration\n)\n```\n\n#### Batch Text Definition Syntax\nYou can pass a list of text specification dictionaries directly to `text`:\n```python\nDraw.text(\n    display=\"main\",\n    text=[\n        {\"text\": \"Heading\", \"ip\": \"h1\", \"font_size\": 32, \"bold\": True, \"y\": 40},\n        {\"text\": \"Subheading\", \"ip\": \"sub\", \"font_size\": 18, \"color\": \"gray\", \"y\": 90},\n    ]\n)\n```\n\n---\n\n### `Draw.text.measure(...)`\n\nHeadless typography measurement engine using exact Qt font metrics without requiring a live painter or open window:\n\n```python\nwidth, height = Draw.text.measure(\n    text=\"Hello World\",\n    customise={\n        \"font_family\": \"Segoe UI\",\n        \"font_size\": 24,\n        \"bold\": True,\n        \"background_padding\": 8,\n        \"max_width\": 300, # Computes wrapped multi-line bounds\n    }\n)\n```\n\n---\n\n### `Draw.text.register_font(...)`\n\nLoads custom TTF or OTF font files headlessly into the Qt application font database:\n\n```python\nsuccess = Draw.text.register_font(\"assets/fonts/Inter-Bold.ttf\")\n```\n\n---\n\n### `Draw.text.update(...)` & `remove_by_ip(...)`\n\n* **`Draw.text.update(tag: str, ip: str, new_text: Optional[str] = None, style_overrides: Optional[dict] = None) -> bool`**: In-place modification of existing text string or styling properties without full canvas recreation.\n* **`Draw.text.remove_by_ip(tag: str, ip: str) -> int`**: Removes all text elements matching `ip` from the canvas. Returns count of removed items.\n\n---\n\n### `Draw.lineedit(...)` (`_LineEditRegistry`)\n\nEmbeds a native, single-line Qt `QLineEdit` widget stacked over the canvas:\n\n```python\nDraw.lineedit(\n    ip          = \"username_input\",   # Unique identifier\n    display     = \"main\",             # Window tag\n    x           = 50,\n    y           = 100,\n    width       = 300,\n    height      = 38,\n    placeholder = \"Enter your username...\",\n    text        = \"\",\n    style       = {                   # QSS styling dictionary\n        \"background_color\": \"#1e293b\",\n        \"text_color\": \"#f8fafc\",\n        \"border_color\": \"#475569\",\n        \"border_width\": 1,\n        \"border_radius\": 6,\n    },\n    on_change   = lambda val: print(\"Typed:\", val),\n    on_submit   = lambda val: print(\"Submitted:\", val),\n)\n```\n\n#### Methods on `Draw.lineedit`\n* `Draw.lineedit.get_text(ip: str) -> str`: Returns current text value.\n* `Draw.lineedit.set_text(ip: str, value: str) -> None`: Sets input text.\n* `Draw.lineedit.set_focus(ip: str) -> None`: Focuses the input.\n* `Draw.lineedit.clear(ip: str) -> None`: Clears text.\n* `Draw.lineedit.select_all(ip: str) -> None`: Selects all text.\n* `Draw.lineedit.move(ip: str, x: int, y: int) -> None`: Repositions the widget.\n* `Draw.lineedit.resize(ip: str, width: int, height: int) -> None`: Resizes the widget.\n* `Draw.lineedit.show(ip: str)` / `hide(ip: str)` / `close(ip: str)`.\n* `Draw.lineedit.list() -> list[str]`: Lists all active LineEdit IPs.\n\n---\n\n### `Draw.textedit(...)` (`_TextEditRegistry`)\n\nEmbeds a native, multi-line Qt `QTextEdit` widget:\n\n```python\nDraw.textedit(\n    ip          = \"bio_editor\",\n    display     = \"main\",\n    x           = 50,\n    y           = 160,\n    width       = 400,\n    height      = 150,\n    placeholder = \"Enter description...\",\n    on_change   = lambda val: print(\"Content changed\"),\n)\n```\n\n#### Methods on `Draw.textedit`\n* `Draw.textedit.get_text(ip: str) -> str`: Returns plain text content.\n* `Draw.textedit.set_text(ip: str, value: str) -> None`: Sets text content.\n* `Draw.textedit.append_text(ip: str, value: str) -> None`: Appends a new line.\n* `Draw.textedit.set_focus(ip: str)` / `clear(ip: str)` / `select_all(ip: str)`.\n* `Draw.textedit.move(ip: str, x: int, y: int)` / `resize(ip: str, width: int, height: int)`.\n* `Draw.textedit.show(ip: str)` / `hide(ip: str)` / `close(ip: str)`.\n\n---\n\n## Text Styling & Typography Customization (`customise`)\n\nAll styling options supported inside `customise={...}`:\n\n| Key | Type | Default | Description |\n| :--- | :--- | :--- | :--- |\n| `x`, `y` | `int` \\| `None` | `None` | Absolute pixel coordinates |\n| `align` | `str` | `\"center\"` | Canvas alignment (`\"center\"`, `\"top\"`, `\"bottom\"`, `\"left\"`, `\"right\"`, `\"top-left\"`, etc.) |\n| `font_family` | `str` | `\"Arial\"` | Font family name or loaded font |\n| `font_size` | `int` | `24` | Font size in pixels |\n| `bold` | `bool` | `False` | Bold font weight toggle |\n| `italic` | `bool` | `False` | Italic font style toggle |\n| `underline` | `bool` | `False` | Underline text toggle |\n| `strikethrough`| `bool` | `False` | Strikethrough text toggle |\n| `letter_spacing`| `float` | `0.0` | Extra character spacing in pixels |\n| `word_spacing` | `float` | `0.0` | Extra word spacing in pixels |\n| `line_height` | `float` | `1.2` | Line height multiplier |\n| `color` | `str` \\| `tuple` | `\"black\"` | Fill text color (named color, hex `#RRGGBB`, RGB/RGBA tuple) |\n| `opacity` | `int` | `100` | Alpha opacity ($0..100$) |\n| `align_text` | `str` | `\"left\"` | Alignment inside bounding box (`\"left\"`, `\"center\"`, `\"right\"`) |\n| `max_width` | `float` | `None` | Maximum bounding width for automated multi-line wrapping |\n| `elide` | `str` | `None` | Text elision mode: `\"right\"`, `\"middle\"`, or `\"left\"` |\n| `background_color` | `str` \\| `tuple` | `None` | Fill color for text background box |\n| `background_padding` | `int` | `6` | Padding around text inside background box |\n| `border_width` | `int` | `0` | Border outline width around background box |\n| `border_color` | `str` \\| `tuple` | `\"black\"` | Border outline color |\n| `border_radius`| `float` | `0.0` | Corner radius for rounded background box |\n| `glow` | `bool` | `False` | Text glow effect toggle |\n| `glow_color` | `str` \\| `tuple` | same as `color` | Glow aura color |\n| `glow_radius` | `int` | `12` | Glow aura spread radius |\n| `shadow` | `bool` | `False` | Drop shadow toggle |\n| `shadow_color` | `str` \\| `tuple` | `\"black\"` | Shadow color |\n| `shadow_offset`| `tuple` | `(3, 3)` | Shadow `(dx, dy)` pixel offset |\n| `rotation` | `float` | `0.0` | Degrees clockwise rotation |\n| `arc_radius` | `float` | `None` | Radius for text-on-arc circular rendering |\n| `arc_angle` | `float` | `180.0` | Angle span for arc text |\n| `arc_direction`| `str` | `\"up\"` | Arc curve direction (`\"up\"` or `\"down\"`) |\n| `outline_width`| `float` | `0.0` | Stroke thickness around text glyphs |\n| `outline_color`| `str` \\| `tuple` | `None` | Glyph stroke outline color |\n| `text_gradient`| `dict` | `None` | Linear/radial gradient fill dict |\n| `char_colors` | `list` | `None` | List of cycling colors across characters |\n\n---\n\n## Canvas Interactive Text Input (`properties`)\n\n`Draw.text` can simulate interactive, keyboard-focusable typing fields directly on the transparent canvas without native widget overhead:\n\n```python\nDraw.text(\n    display=\"main\",\n    ip=\"search_bar\",\n    text=\"\",\n    customise={\n        \"font_size\": 20,\n        \"color\": \"white\",\n        \"background_color\": \"#1e293b\",\n        \"background_padding\": 10,\n        \"border_radius\": 8,\n        \"border_width\": 2,\n        \"border_color\": \"#3b82f6\",\n    },\n    properties={\n        \"take_input\": [\"return\", \"tab\"],     # Submit trigger keys\n        \"type_input\": \"text\",                 # \"text\", \"number\", \"integer\", \"alphanumeric\", \"email\", \"password\"\n        \"placeholder\": \"Type here...\",\n        \"min_length\": 1,\n        \"max_length\": 64,\n        \"allow_empty\": False,\n        \"transform\": \"none\",                  # \"uppercase\", \"lowercase\", \"capitalize\", \"title\", \"trim\"\n        \"live_update\": True,                  # Emits input changes live to listeners\n        \"clear_on_submit\": True,\n        \"return\": \"my_live_key\",              # Stores final input value into Draw.live\n        \"caret\": True,                        # Enables blinking typing cursor\n        \"caret_color\": \"white\",\n        \"caret_width\": 2,\n        \"caret_blink\": True,\n    }\n)\n```\n\n---\n\n## Text-on-Arc, Outlines, Gradients & Per-Character Colors\n\n### 1. Curved Text-on-Arc\n```python\n\"arc_radius\": 200,\n\"arc_angle\": 140.0,\n\"arc_direction\": \"up\", # \"up\" or \"down\"\n```\n\n### 2. Glyph Stroke Outlines\n```python\n\"outline_width\": 2.5,\n\"outline_color\": \"black\",\n\"color\": \"yellow\",\n```\n\n### 3. Linear / Radial Gradients\n```python\n\"text_gradient\": {\n    \"type\": \"linear\",\n    \"angle\": 45,\n    \"stops\": [(0.0, \"cyan\"), (1.0, \"magenta\")],\n}\n```\n\n### 4. Per-Character Cycling Palette\n```python\n\"char_colors\": [\"#f38ba8\", \"#fab387\", \"#f9e2af\", \"#a6e3a1\", \"#89b4fa\", \"#cba6f7\"]\n```\n\n---\n\n## Built-in Animation Modes (14 Types)\n\nConfigured via `customise={\"animation\": \"<name>\", \"duration\": 1.5, ...}`:\n\n| Animation Name | Description | Key Customization Parameters |\n| :--- | :--- | :--- |\n| `\"fade_in\"` | Smooth opacity fade-in | `duration`, `delay`, `ease` |\n| `\"fade_out\"` | Smooth opacity fade-out | `duration`, `delay`, `ease` |\n| `\"pulse\"` | Continuous opacity pulsing | `pulse_min`, `pulse_max`, `pulse_speed` |\n| `\"blink\"` | Discrete periodic show/hide | `pulse_speed` |\n| `\"color_transition\"`| Smooth start-to-end color blend | `from_color`, `to_color`, `duration` |\n| `\"rainbow\"` | Continuous HSV hue spectrum rotation | `wave_speed` |\n| `\"rotate_hue\"` | Smooth hue shifting | `wave_speed` |\n| `\"typewriter\"` | Character-by-character reveal (aliases: `\"write_on\"`, `\"write\"`) | `duration`, `ease` |\n| `\"slide_in\"` | Directional sliding into final position | `slide_direction` (`\"top\"`, `\"bottom\"`, `\"left\"`, `\"right\"`), `slide_distance` |\n| `\"scale_in\"` | Scale expansion from text box center | `duration`, `ease` |\n| `\"rotate_in\"` | 360-degree rotation into place | `duration`, `ease` |\n| `\"wave\"` | Per-character sinusoidal vertical bobbing | `wave_amplitude`, `wave_speed`, `wave_char_offset` |\n| `\"shake\"` | High-frequency position jittering | `shake_intensity` |\n\n---\n\n## Collision Avoidance, Flow & Layout Integration\n\nText elements participate fully in the canvas collision avoidance and layout grid systems:\n\n* **Grid Placement**: Attach to layout tables using `layout=\"table_ip\"` and `cell=(row, col)` (or `column=...`).\n* **Collision Avoidance (`flow`)**: Specify `flow={\"enabled\": True, \"role\": \"item\", \"strategy\": \"stack\"}` to automatically prevent overlapping adjacent shapes or text items.\n\n---\n\n## Comprehensive Code Examples\n\n### 1. Glowing Arc Title with Gradient\n```python\nimport Draw\n\nwin = Draw.window(title=\"Typography Showcase\", width=800, height=600)\n\nDraw.text(\n    display=\"main\",\n    ip=\"hero_title\",\n    text=\"CURVED ARC TYPOGRAPHY\",\n    customise={\n        \"align\": \"top\",\n        \"font_family\": \"Segoe UI\",\n        \"font_size\": 32,\n        \"bold\": True,\n        \"arc_radius\": 240,\n        \"arc_direction\": \"up\",\n        \"glow\": True,\n        \"glow_color\": \"#00f2fe\",\n        \"glow_radius\": 16,\n        \"color\": \"#4facfe\",\n    }\n)\n```\n\n### 2. Animated Sinusoidal Wave Text\n```python\nDraw.text(\n    display=\"main\",\n    ip=\"wave_text\",\n    text=\"Smooth Sinusoidal Wave Animation\",\n    customise={\n        \"align\": \"center\",\n        \"font_size\": 24,\n        \"color\": \"white\",\n        \"animation\": \"wave\",\n        \"wave_amplitude\": 10,\n        \"wave_speed\": 3,\n    }\n)\n```\n"
  },

    "content": "# Draw Universal Colour System (`Draw._colour`) Documentation\n\n`Draw._colour` (`Draw.color` / `Draw.colour`) is the unified, dynamic, expression-driven color and styling engine for all canvas elements in the `Draw` library. It provides static color parsing (named colors, hex codes, RGB/RGBA tuples, QColor instances), per-frame evaluated math expressions, HSV/RGB color models, linear/radial/conical gradients with animated stops, multi-channel target styling (`body`, `border`, `shadow`, `glow`, `text`), reactive cursor tracking, live data bindings, and legacy styling presets.\n\n---\n\n## Table of Contents\n1. [Overview & Core Architecture](#overview--core-architecture)\n2. [Public API & Registries Reference](#public-api--registries-reference)\n   - [`Draw.color` Singleton (`_ColorRegistry`)](#drawcolor-singleton-_colorregistry)\n   - [`Draw.colour(**kwargs)` Preset Helper](#drawcolourkwargs-preset-helper)\n   - [Helper & Utility Functions](#helper--utility-functions)\n3. [Target Channels (`for`) & Supported Attributes](#target-channels-for--supported-attributes)\n4. [Color Formats & Evaluation Modes](#color-formats--evaluation-modes)\n   - [1. Static String / Hex / Tuple Mode](#1-static-string--hex--tuple-mode)\n   - [2. HSV Dynamic Expression Mode](#2-hsv-dynamic-expression-mode)\n   - [3. RGB Dynamic Expression Mode](#3-rgb-dynamic-expression-mode)\n   - [4. Gradient Mode (Linear, Radial, Conical)](#4-gradient-mode-linear-radial-conical)\n5. [Dynamic Per-Frame Math & Reactive Context](#dynamic-per-frame-math--reactive-context)\n   - [Built-in Variables](#built-in-variables)\n   - [Built-in Math Functions](#built-in-math-functions)\n   - [Live Data Integration (`Draw.live`)](#live-data-integration-drawlive)\n6. [Color Design Tokens (`save_tokens` / `load_tokens`)](#color-design-tokens-save_tokens--load_tokens)\n7. [Comprehensive Code Examples](#comprehensive-code-examples)\n\n---\n\n## Overview & Core Architecture\n\nThe system centers around the singleton `Draw.color` (`_ColorRegistry`), which binds color definitions to target shape or element IDs (`ip`).\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502              Draw.color(ip=..., color=[...])             \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                            \u2502 parses entries into\n                            \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                      ColorBinding                        \u2502\n\u2502   (Target Channels: body, border, shadow, glow, text)    \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                            \u2502 evaluated per-frame via\n                            \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                   Draw._calculator                       \u2502\n\u2502 - Per-frame math evaluation (time, x, y, w, h, mouse)    \u2502\n\u2502 - Live variable resolution (Draw.live)                   \u2502\n\u2502 - Dynamic gradient stop interpolation                    \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                            \u2502 rendered in\n                            \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                      _DrawCanvas                         \u2502\n\u2502 - Automatic canvas repaint dispatch                      \u2502\n\u2502 - GPU shadow / glow pixmap caching                       \u2502\n\u2502 - Gradient brush construction                            \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n## Public API & Registries Reference\n\n### `Draw.color` Singleton (`_ColorRegistry`)\n\nRegisters or updates color bindings for a specific shape or canvas element.\n\n```python\n# Preferred syntax using canonical 'ip' keyword:\nbinding = Draw.color(\n    ip           = \"my_shape_ip\",  # Target shape IP tag\n    color_get_ip = \"my_layout\",    # Optional layout IP reference\n    color        = [               # Single dict OR list of dicts\n        {\"for\": \"body\", \"color\": \"#1e293b\"},\n        {\"for\": \"border\", \"h\": \"time * 45\", \"s\": 80, \"v\": 100, \"width\": 2},\n        {\"for\": \"shadow\", \"color\": \"black\", \"blur\": 16, \"offset\": [0, 4]},\n    ]\n)\n\n# Connection dict syntax (backward-compatible):\nbinding = Draw.color(\n    connection = {\"color_ip\": \"my_shape_ip\", \"get_ip\": \"my_layout\"},\n    color      = [...],\n)\n```\n\n#### Registry Methods on `Draw.color`\n* **`Draw.color.get_binding(color_ip: str) -> Optional[ColorBinding]`**: Returns the registered `ColorBinding` for the specified IP.\n* **`Draw.color.has_binding(color_ip: str) -> bool`**: Returns `True` if a color binding is registered for `color_ip`.\n* **`Draw.color.has_any_dynamic() -> bool`**: Returns `True` if any registered binding contains dynamic math expressions or live data references.\n* **`Draw.color.resolve_for_shape(color_ip: str, shape_x=0.0, shape_y=0.0, shape_w=0.0, shape_h=0.0) -> Optional[Dict[str, Any]]`**: Evaluates all expressions for the shape at the current moment, returning resolved RGBA colors, gradients, borders, shadows, and glows.\n* **`Draw.color.update_mouse(mx: float, my: float) -> None`**: Updates cached mouse coordinates for reactive math expressions.\n* **`Draw.color.remove(color_ip: str) -> bool`**: Removes the color binding for `color_ip`. Returns `True` if removed.\n* **`Draw.color.clear() -> None`**: Flushes all registered color bindings.\n* **`Draw.color.list_bindings() -> List[str]`**: Returns a list of all registered color IPs.\n\n---\n\n### `Draw.colour(**kwargs)` Preset Helper\n\nA convenience styling helper that builds a customized style dictionary with presets for `Draw.shape` or `Draw.text`:\n\n```python\nfrom Draw._colour import colour\n\nstyle = colour(\n    fill           = \"#0f172a\",\n    border         = \"cyan\",\n    border_width   = 2,\n    neon           = True,         # Adds glow and shadow presets\n    neon_color     = \"cyan\",\n    neon_radius    = 20,\n)\n```\n\n#### Supported Presets & Aliases\n* **Aliases**: `fill` $\\to$ `color`, `border` $\\to$ `border_color`, `glow` $\\to$ `glow_color`, `shadow` $\\to$ `shadow_color`.\n* **`neon=True`**: Automatically configures glowing borders and soft ambient drop shadows.\n* **`metallic=True`**: Applies a directional silver/metallic gradient with highlight shine (`metallic_color`, `metallic_shine`, `metallic_direction`).\n* **`frost=True`**: Applies a frosted glass linear gradient (`frost_color`).\n* **`water_dip=True`** / **`wave=True`**: Generates wave color animation specs (`wave_direction`, `wave_speed`, `wave_colors`).\n* **`burn=True`**: Generates strobe/burn animation specs (`burn_color`, `burn_outer_color`, `burn_intensity`).\n\n---\n\n### Helper & Utility Functions\n\n#### `_parse_color(color: Any) -> QColor`\nCanonical static color parser. Converts any valid color specification into a `QColor` (falls back to white on error):\n* `QColor` instances\n* Named color strings (`\"cyan\"`, `\"crimson\"`, `\"gold\"`, `\"navy\"`, etc.)\n* Hex strings (`\"#RGB\"`, `\"#RRGGBB\"`, `\"#RRGGBBAA\"`)\n* RGB tuples/lists: `(255, 128, 0)`\n* RGBA tuples/lists: `(255, 128, 0, 180)`\n\n---\n\n## Target Channels (`for`) & Supported Attributes\n\nEach dictionary in `color=[...]` defines styling for one of five target channels:\n\n| Target Channel | Description | Supported Attributes |\n| :--- | :--- | :--- |\n| `\"body\"` | Shape interior fill | `color`, `h`, `s`, `v`, `r`, `g`, `b`, `opacity`, `gradient`, `angle`, `center`, `radius`, `stops` |\n| `\"border\"` | Shape outline stroke | `color`, `h`, `s`, `v`, `r`, `g`, `b`, `opacity`, `width`, `style` (`\"solid\"`, `\"dashed\"`, `\"dotted\"`) |\n| `\"shadow\"` | Drop shadow effect | `color`, `blur`, `spread`, `offset` (`[x, y]`), `opacity` |\n| `\"glow\"` | Outer neon glow effect | `color`, `blur`, `spread`, `opacity` |\n| `\"text\"` | Typography text fill | `color`, `h`, `s`, `v`, `r`, `g`, `b`, `opacity` |\n\n---\n\n## Color Formats & Evaluation Modes\n\n### 1. Static String / Hex / Tuple Mode\n```python\n{\"for\": \"body\", \"color\": \"#1e293b\"}              # 6-digit hex\n{\"for\": \"body\", \"color\": \"crimson\"}              # Built-in or CSS named color\n{\"for\": \"body\", \"color\": [0, 200, 255, 200]}     # RGBA list/tuple (0-255)\n```\n\n#### Base Named Color Table\n`white`, `black`, `red`, `green`, `blue`, `yellow`, `orange`, `purple`, `pink`, `cyan`, `teal`, `gray`, `grey`, `brown`, `indigo`, `lime`, `amber`, `silver`, `gold` (in addition to all standard Qt/CSS color names).\n\n---\n\n### 2. HSV Dynamic Expression Mode\nControls Hue ($0..360^\\circ$), Saturation ($0..100\\%$), and Value ($0..100\\%$):\n\n```python\n{\n    \"for\": \"body\",\n    \"h\": \"time * 60\",      # Hue rotates 60 degrees per second\n    \"s\": 90,               # 90% saturation\n    \"v\": 100,              # 100% brightness\n    \"opacity\": \"sin(time * 2) * 20 + 80\",\n}\n```\n\n---\n\n### 3. RGB Dynamic Expression Mode\nControls Red, Green, and Blue channels ($0..255$):\n\n```python\n{\n    \"for\": \"body\",\n    \"r\": \"sin(time) * 127 + 128\",\n    \"g\": 180,\n    \"b\": \"cos(time) * 127 + 128\",\n    \"opacity\": 100,\n}\n```\n\n---\n\n### 4. Gradient Mode (Linear, Radial, Conical)\nSupports rotating gradients and animated stop positions:\n\n```python\n{\n    \"for\": \"body\",\n    \"gradient\": \"linear\",      # \"linear\", \"radial\", or \"conical\"\n    \"angle\": \"time * 30\",      # Animated rotation in degrees\n    \"center\": [50, 50],        # Radial/conical center point [cx%, cy%]\n    \"radius\": 60,              # Radial spread percentage\n    \"stops\": [\n        [0, \"#ff007f\"],\n        [\"50 + sin(time * 2) * 25\", \"#7f00ff\"],  # Animated moving middle stop\n        [100, \"#00f0ff\"],\n    ]\n}\n```\n\n---\n\n## Dynamic Per-Frame Math & Reactive Context\n\nWhen string expressions are passed to HSV, RGB, Opacity, Blur, Radius, Angle, or Stops, `Draw._calculator` evaluates them at 60 FPS.\n\n### Built-in Variables\n| Variable | Description |\n| :--- | :--- |\n| `time` | Elapsed seconds since the color binding was registered |\n| `x`, `y` | Current shape canvas position |\n| `w`, `h` | Current shape width and height |\n| `mouse_x`, `mouse_y` | Current mouse cursor position on the canvas |\n\n### Built-in Math Functions\n* `sin(t)`, `cos(t)`, `tan(t)`, `abs(v)`, `min(a, b)`, `max(a, b)`, `sqrt(v)`, `pow(b, e)`\n* `lerp(a, b, t)`: Linear interpolation between `a` and `b`\n* `step(edge, x)`: Returns `0.0` if `x < edge`, else `1.0`\n* `clamp(v, min_v, max_v)`: Clamps `v` to `[min_v, max_v]`\n\n### Live Data Integration (`Draw.live`)\nAny numeric key stored in `Draw.live` is automatically exposed as an expression variable:\n\n```python\nimport Draw\n\n# Store live state\nDraw.live.set(\"sensor_val\", 85.0)\n\n# Reference in color expression\nDraw.color(\n    ip=\"status_bulb\",\n    color={\"for\": \"body\", \"h\": \"sensor_val * 2\", \"s\": 100, \"v\": 100}\n)\n```\n\n---\n\n## Color Design Tokens (`save_tokens` / `load_tokens`)\n\nDesign tokens can be exported to or loaded from standard formatted JSON files:\n\n```python\nfrom Draw._colour import save_tokens, load_tokens\n\ntokens = {\n    \"primary\": \"#3b82f6\",\n    \"secondary\": \"#8b5cf6\",\n    \"accent\": \"#ec4899\",\n    \"surface\": \"#1e293b\",\n}\n\n# Save tokens to disk\nsave_tokens(\"theme.json\", tokens)\n\n# Reload tokens\ntheme = load_tokens(\"theme.json\")\n```\n\n---\n\n## Comprehensive Code Examples\n\n### 1. Multi-Target Styling with Soft Glow & Drop Shadow\n```python\nimport Draw\n\nwin = Draw.window(title=\"Color System Demo\", size=[800, 600])\n\nDraw.shape(\n    display=\"main\",\n    shape=[{\n        \"ip\": \"cyber_panel\",\n        \"vertices\": 4,\n        \"size\": [300, 180],\n        \"align\": \"center\",\n        \"border_radius\": 16,\n    }]\n)\n\nDraw.color(\n    ip=\"cyber_panel\",\n    color=[\n        {\"for\": \"body\", \"color\": [15, 23, 42, 240]},\n        {\"for\": \"border\", \"color\": \"#38bdf8\", \"width\": 2, \"style\": \"solid\"},\n        {\"for\": \"shadow\", \"color\": \"black\", \"blur\": 20, \"offset\": [0, 10]},\n        {\"for\": \"glow\", \"color\": \"cyan\", \"blur\": 30, \"opacity\": 60},\n    ]\n)\n```\n\n### 2. Rainbow Hue Rotation with Complementary Border\n```python\nDraw.color(\n    ip=\"badge\",\n    color=[\n        {\"for\": \"body\", \"h\": \"time * 90\", \"s\": 85, \"v\": 100},\n        {\"for\": \"border\", \"h\": \"time * 90 + 180\", \"s\": 100, \"v\": 100, \"width\": 3},\n    ]\n)\n```\n\n### 3. Reactive Distance-to-Mouse Glow\n```python\nDraw.color(\n    ip=\"interactive_card\",\n    color=[\n        {\"for\": \"body\", \"color\": \"#1e1e2e\"},\n        {\n            \"for\": \"glow\",\n            \"color\": \"magenta\",\n            # Increases glow blur as cursor nears shape center\n            \"blur\": \"max(0, 50 - sqrt((mouse_x - (x + w/2))^2 + (mouse_y - (y + h/2))^2) / 4)\",\n            \"opacity\": 80,\n        }\n    ]\n)\n```\n"
