    "desc": "Live variable bindings, reactive text resolution, two-way input field bindings.",
    "content": "# Comprehensive Technical Documentation: Draw Live Engine (`Draw._live`)\n\n`Draw._live` (`Draw.live` & `Draw.input`) is the reactive state binding, dynamic string resolver, and live data stream management module for the `Draw` framework. It enables components, text items, input fields, layouts, and charts to dynamically bind to reactive variables, live sensor data feeds, user input markers, and stateful callbacks.\n\n---\n\n## 1. Executive Summary & Core Architecture\n\nThe `Draw._live` module decoupledly manages dynamic state through two singleton registries:\n1. **`Draw.live` (`_LiveRegistry`)**: Reactive state registry for key-value variable binding, dynamic text references (`LiveRef`), and string resolving.\n2. **`Draw.input` (`_InputRegistry`)**: Interactive user input marker registry for text fields, search queries, and form markers.\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502             Reactive Application Logic / State           \u2502\n\u2502           Draw.live.set(\"user_score\", 1500)             \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                            \u2502\n                            \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                   Draw._live Engine                      \u2502\n\u2502 - LiveRef(\"user_score\")                                  \u2502\n\u2502 - LiveTextBinding(source=..., fallback=\"...\")            \u2502\n\u2502 - resolve_live_text()                                    \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                \u2502                          \u2502\n                \u25bc                          \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510 \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502          Draw._text          \u2502 \u2502         Draw._graph          \u2502\n\u2502 - Dynamic UI Text Labels     \u2502 \u2502 - Real-Time Streaming Charts \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518 \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n## 2. Core Data Structures & Classes\n\n### 2.1 `LiveRef`\n```python\n@dataclass(frozen=True)\nclass LiveRef:\n    key: str\n```\nImmutable reference token wrapping a lookup key string in `Draw.live`. Created via `Draw.live.ref(key)`.\n\n### 2.2 `LiveTextBinding`\n```python\n@dataclass(frozen=True)\nclass LiveTextBinding:\n    source: Any\n    fallback: str = \"\"\n```\nEncapsulates a dynamic text data source (a `LiveRef`, a callable function `lambda: ...`, or a static object) with a fallback string. Created via `Draw.live.text(...)`.\n\n### 2.3 `InputTextMarker`\n```python\n@dataclass(frozen=True)\nclass InputTextMarker:\n    initial: str = \"\"\n```\nMarker object representing live editable input fields. Created via `Draw.input.text` or `Draw.input.field(...)`.\n\n---\n\n## 3. Public API Reference\n\n### 3.1 `Draw.live` (`_LiveRegistry`)\n\n| Method / Property | Signature | Description |\n|---|---|---|\n| `live.set(key, value)` | `(key: object, value: Any) -> Any` | Stores reactive variable `value` under lookup `key`. |\n| `live.get(key, default=None)` | `(key: object, default: Any = None) -> Any` | Retrieves stored reactive variable for `key`. |\n| `live.ref(key)` | `(key: object) -> LiveRef` | Creates a `LiveRef` binding token for `key`. |\n| `live.text(source, fallback=\"\")` | `(source: Any = None, fallback: object = \"\") -> LiveTextBinding` | Creates a `LiveTextBinding` wrapper around a key, function, or value. |\n| `live.clear(key=None)` | `(key: object \\| None = None) -> None` | Clears a specific key or wipes the entire live registry. |\n| `live[key]` | `__getitem__(key)` | Dictionary subscript accessor. |\n| `live[key] = value` | `__setitem__(key, value)` | Dictionary subscript mutator. |\n\n### 3.2 `Draw.input` (`_InputRegistry`)\n\n| Method / Property | Signature | Description |\n|---|---|---|\n| `input.text` | `@property -> InputTextMarker` | Returns standard initial input text marker (`InputTextMarker(\"\")`). |\n| `input.field(initial=\"\")` | `(initial: object = \"\") -> InputTextMarker` | Returns `InputTextMarker` with a custom initial value string. |\n| `input.set(key, value)` | `(key: object \\| None, value: object) -> str` | Sets input field string under `key` (and updates `last_value`). |\n| `input.get(key=None, default=\"\")` | `(key: object \\| None = None, default: object = \"\") -> str` | Gets current input field text for `key` or last recorded input. |\n| `input.clear(key=None)` | `(key: object \\| None = None) -> None` | Clears stored input field state. |\n\n---\n\n## 4. Resolver Functions\n\n### 4.1 `resolve_live_text(binding: LiveTextBinding) -> str`\nEvaluates a `LiveTextBinding` instance into a clean resolved string:\n1. If `binding.source` is a `LiveRef`: Looks up `live.get(source.key, fallback)`.\n2. If `binding.source` is a callable: Executes `source()`.\n3. Otherwise: Converts `source` directly to string.\n4. Returns fallback string if value resolves to `None`.\n\n### 4.2 Type Predicates\n- `is_live_text_binding(value: object) -> bool`: Returns `True` if `value` is a `LiveTextBinding`.\n- `is_input_text_marker(value: object) -> bool`: Returns `True` if `value` is an `InputTextMarker`.\n\n---\n\n## 5. Integrations Across Draw Framework\n\n### 5.1 Real-Time Streaming Charts (`Draw._graph`)\n`Draw._graph` natively resolves `LiveRef` keys passed inside data series `x` and `y` arrays. Calling `Draw.graph.update_live(window_tag)` re-evaluates live variables and updates charts smoothly in real time:\n\n```python\nimport Draw\n\n# 1. Store reactive live data\nDraw.live.set(\"cpu_timestamps\", [\"12:00\", \"12:05\", \"12:10\"])\nDraw.live.set(\"cpu_usage\", [45.2, 78.1, 62.0])\n\n# 2. Bind chart to live data references\nDraw.graph(\n    ip=\"cpu_monitor\",\n    type=\"line\",\n    graph=[{\n        \"x\": Draw.live.ref(\"cpu_timestamps\"),\n        \"y\": Draw.live.ref(\"cpu_usage\"),\n        \"title\": \"CPU Usage (%)\"\n    }]\n)\n\n# 3. Stream new data ticks\ndef push_sensor_reading(new_time, new_value):\n    ts = Draw.live.get(\"cpu_timestamps\") + [new_time]\n    val = Draw.live.get(\"cpu_usage\") + [new_value]\n    Draw.live.set(\"cpu_timestamps\", ts)\n    Draw.live.set(\"cpu_usage\", val)\n    Draw.graph.update_live(\"main\")\n```\n\n### 5.2 Dynamic Text Elements (`Draw._text`)\nDynamic text labels accept `Draw.live.text(...)` bindings to automatically format live scores, timers, or status strings:\n\n```python\nimport Draw\n\n# Dynamic score binding with fallback\nDraw.text(\n    tag=\"main\",\n    text=Draw.live.text(Draw.live.ref(\"user_score\"), fallback=\"0 Points\"),\n    ip=\"score_label\",\n    x=100, y=50\n)\n\n# Update reactive state\nDraw.live.set(\"user_score\", \"1,250 Points\")\n```\n\n---\n\n## 6. Full Code Usage Example\n\n```python\nimport Draw\n\n# Initialize Reactive State\nDraw.live.set(\"temperature\", 24.5)\nDraw.live.set(\"status\", \"System Normal\")\n\n# Retrieve Values\ncurrent_temp = Draw.live.get(\"temperature\")\nprint(f\"Current Temp: {current_temp}\u00b0C\")  # Output: 24.5\u00b0C\n\n# Live Function Callback Binding\nbinding = Draw.live.text(lambda: f\"Status: {Draw.live.get('status')}\")\nprint(Draw.resolve_live_text(binding))  # Output: \"Status: System Normal\"\n\n# Input Field Management\nmarker = Draw.input.field(\"Enter Name...\")\nDraw.input.set(\"username\", \"Alice\")\nprint(Draw.input.get(\"username\"))  # Output: \"Alice\"\n```\n"
  },

    "content": "# Comprehensive Technical Documentation: Draw Turtle Engine (`Draw._turtle`)\n\n`Draw._turtle` (`Draw.turtle` / `Draw.pen`) is the Python standard library `turtle` graphics bridge for the **Draw** framework. It creates a hidden, off-screen `turtle.TurtleScreen` bound to an authentic `turtle.RawTurtle` and live-mirrors all vector strokes, polygon fills, and text items onto a transparent, anti-aliased PySide6 canvas overlay (`_TurtleCanvasWidget`).\n\n---\n\n## Table of Contents\n1. [Overview & Core Architecture](#overview--core-architecture)\n2. [Event Loop Integration & Canvas Mirroring](#event-loop-integration--canvas-mirroring)\n3. [Public API Reference (`Draw.turtle(...)`)](#public-api-reference-drawturtle)\n4. [Standard Turtle Commands & Capabilities](#standard-turtle-commands--capabilities)\n5. [Comprehensive Code Examples](#comprehensive-code-examples)\n\n---\n\n## Overview & Core Architecture\n\nRather than re-implementing turtle geometry math, `Draw.turtle` bridges Python's authentic standard library `turtle` module into Qt's hardware-accelerated event loop:\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                   turtle.RawTurtle API                   \u2502\n\u2502   (forward, left, right, circle, begin_fill, end_fill)   \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                            \u2502 writes to hidden\n                            \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                      _BridgeCanvas                       \u2502\n\u2502 - Hidden background tkinter.Canvas                       \u2502\n\u2502 - Intercepts update() and after() calls                  \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                            \u2502 Mirrors coordinates into\n                            \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                   _TurtleCanvasWidget                    \u2502\n\u2502 - Transparent QWidget overlay over Draw canvas           \u2502\n\u2502 - Anti-aliased QPainter vector line and polygon drawing  \u2502\n\u2502 - Pumps QCoreApplication.processEvents() for real-time   \u2502\n\u2502   step-by-step animation                                 \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n## Event Loop Integration & Canvas Mirroring\n\nTwo core integration points bridge Tkinter and Qt:\n\n1. **`Canvas.update()`**: Reads item coordinates from Tkinter, transforms from center-origin turtle space $(0, 0)$ into top-left Qt canvas pixel space $(x, y)$, and triggers `QPainter` repaints while pumping `QCoreApplication.processEvents()`.\n2. **`Canvas.after(ms, func)`**: Non-blocking delays use `QTimer.singleShot` or monotonic polling to ensure smooth, pacing-controlled turtle animations without freezing the GUI.\n\n---\n\n## Public API Reference (`Draw.turtle(...)`)\n\nConstructs and returns a standard `RawTurtle` instance:\n\n```python\nt = Draw.turtle(\n    display = \"main\",         # Target window tag (alias: tag=)\n    width   = 600,            # Turtle canvas pixel width (default: window width)\n    height  = 600,            # Turtle canvas pixel height (default: window height)\n    x       = 0,              # Top-left offset within window\n    y       = 0,              # Top-left offset within window\n    bg      = \"white\",        # Background color\n    mode    = \"standard\",     # \"standard\" (0\u00b0 = East), \"logo\" (0\u00b0 = North), or \"world\"\n    speed   = 6,              # Turtle speed: 0 (fastest), 1 (slowest) to 10 (fast)\n    shape   = \"classic\",      # Turtle cursor shape (\"classic\", \"arrow\", \"circle\", \"turtle\")\n    ip      = \"turtle_pen\",   # Optional identifier tag to query instance later\n)\n```\n\n---\n\n## Standard Turtle Commands & Capabilities\n\nBecause `Draw.turtle` returns an authentic `turtle.RawTurtle`, all standard library methods are 100% supported:\n\n### Motion & Direction\n* `t.forward(distance)` / `t.fd(distance)`\n* `t.backward(distance)` / `t.bk(distance)`\n* `t.right(angle)` / `t.rt(angle)`\n* `t.left(angle)` / `t.lt(angle)`\n* `t.goto(x, y)` / `t.setpos(x, y)`\n* `t.setheading(to_angle)` / `t.seth(to_angle)`\n* `t.circle(radius, extent=None, steps=None)`\n* `t.dot(size=None, *color)`\n* `t.stamp()` / `t.clearstamp(stamp_id)`\n\n### Pen Control & Styling\n* `t.penup()` / `t.pu()` / `t.up()`\n* `t.pendown()` / `t.pd()` / `t.down()`\n* `t.pensize(width)` / `t.width(width)`\n* `t.pencolor(*args)` / `t.fillcolor(*args)` / `t.color(*args)`\n* `t.begin_fill()` / `t.end_fill()`\n* `t.isdown()`\n\n### State & Typography\n* `t.speed(speed)` (0-10)\n* `t.position()` / `t.pos()`\n* `t.heading()`\n* `t.write(arg, move=False, align=\"left\", font=(\"Arial\", 8, \"normal\"))`\n* `t.reset()` / `t.clear()`\n\n---\n\n## Comprehensive Code Examples\n\n### 1. Drawing a Geometric Spiral\n```python\nimport Draw\n\nwin = Draw.window(title=\"Turtle Spiral\", width=800, height=800, background_color=\"#0f172a\")\n\nt = Draw.turtle(display=\"main\", bg=\"#0f172a\", speed=0)\nt.pensize(2)\n\ncolors = [\"#38bdf8\", \"#818cf8\", \"#c084fc\", \"#f472b6\", \"#fb7185\", \"#34d399\"]\n\nfor x in range(120):\n    t.pencolor(colors[x % len(colors)])\n    t.forward(x * 3)\n    t.left(59)\n\nDraw.window.run(\"main\")\n```\n\n### 2. Filled Star Polygon\n```python\nimport Draw\n\nwin = Draw.window(title=\"Turtle Star\", width=600, height=600, background_color=\"white\")\n\nt = Draw.turtle(display=\"main\", speed=5)\nt.color(\"crimson\", \"gold\")\nt.pensize(3)\n\nt.begin_fill()\nfor _ in range(5):\n    t.forward(200)\n    t.right(144)\nt.end_fill()\n\nDraw.window.run(\"main\")\n```\n"

    "content": "# Comprehensive Technical Documentation: Draw Super Engine (`Draw._super`)\n\n`Draw._super` (`Draw.super` / `Draw.super_mode`) is the hardware-accelerated OpenGL rendering pipeline and dynamic GPU vertex-batching subsystem of the **Draw** framework. It upgrades standard PySide6 software canvases to dedicated `QOpenGLWidget` viewports, compiling 2D vector geometry directly into GPU Vertex Buffer Objects (VBO) and Element Buffer Objects (EBO) to render thousands of dynamic shapes at 60\u2013120+ FPS.\n\n---\n\n## Table of Contents\n1. [Overview & Architectural Advantages](#overview--architectural-advantages)\n2. [GPU Geometry Batcher (`GPUGeometryBatcher`)](#gpu-geometry-batcher-gpugeometrybatcher)\n3. [OpenGL Canvas Architecture (`_DrawOpenGLCanvas`)](#opengl-canvas-architecture-_drawopenglcanvas)\n   - [GLSL Shaders (Core 3.3 & Legacy 1.2 Fallback)](#glsl-shaders-core-33--legacy-12-fallback)\n   - [Frustum & Viewport Culling](#frustum--viewport-culling)\n   - [Recursion & Render-Loop Protection](#recursion--render-loop-protection)\n4. [Public API Reference](#public-api-reference)\n   - [`Draw.super(...)`](#drawsuper)\n   - [`Draw.super_mode(...)`](#drawsuper_mode)\n   - [`is_super_accelerated(...)`](#is_super_accelerated)\n5. [Automatic Fallback & Error Resilience](#automatic-fallback--error-resilience)\n6. [Comprehensive Code Examples](#comprehensive-code-examples)\n\n---\n\n## Overview & Architectural Advantages\n\nTraditional desktop UI toolkits paint every vector shape sequentially on the CPU. When scenes contain hundreds of dynamic particles, charts, or moving shapes, CPU rasterization can bottleneck frame rates. `Draw.super` offloads this burden to the GPU:\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                   Draw Scene Definition                  \u2502\n\u2502       (Hundreds of ShapeDef, Point paths, TextDef)       \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                            \u2502 Filtered by Frustum Culling\n                            \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                   GPUGeometryBatcher                     \u2502\n\u2502 - Triangulates 2D convex polygons and quads              \u2502\n\u2502 - Packs vertices [x, y, r, g, b, a] into NumPy float32   \u2502\n\u2502 - Single dynamic VBO buffer upload per frame             \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                            \u2502 glDrawArrays / glDrawElements\n                            \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                   _DrawOpenGLCanvas                      \u2502\n\u2502 - 4x Multi-Sample Anti-Aliasing (MSAA) hardware buffer   \u2502\n\u2502 - Hybrid QPainter overlay for rich text/glow effects     \u2502\n\u2502 - Zero-alloc 60 FPS animation dispatch loop              \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n## GPU Geometry Batcher (`GPUGeometryBatcher`)\n\nThe batcher packs multiple independent 2D shapes into a single contiguous interleaved float32 vertex array:\n\n* **Vertex Format**: `[x, y, r, g, b, a]` (6 floats = 24 bytes per vertex).\n* **Triangulation**: Convex $N$-sided polygons are automatically fan-triangulated into $(N - 2) \\times 3$ vertices.\n* **Capacity**: Supports batch sizes from 1,024 up to 65,536+ vertices per dynamic draw call.\n\n---\n\n## OpenGL Canvas Architecture (`_DrawOpenGLCanvas`)\n\n### GLSL Shaders (Core 3.3 & Legacy 1.2 Fallback)\n\n1. **OpenGL 3.3 Core Profile**: Uses modern GLSL shaders with orthographic projection matrix uniforms:\n   ```glsl\n   #version 330 core\n   layout (location = 0) in vec2 aPos;\n   layout (location = 1) in vec4 aColor;\n   uniform mat4 uProjection;\n   out vec4 vColor;\n   void main() {\n       gl_Position = uProjection * vec4(aPos, 0.0, 1.0);\n       vColor = aColor;\n   }\n   ```\n2. **OpenGL 2.1 / Legacy Fallback**: Automatically compiles GLSL `#version 120` shaders if the host GPU drivers do not support modern Core Profiles.\n\n---\n\n### Frustum & Viewport Culling\n\nBefore copying vertices into GPU buffers, `_DrawOpenGLCanvas` checks shape bounding boxes against the active canvas viewport:\n$$\\text{BoundingBox}(S) \\cap \\text{Viewport}(0, 0, W, H) \\neq \\emptyset$$\nOff-screen shapes are culled in $O(1)$ time, eliminating wasted vertex transformations and fill-rate overhead.\n\n---\n\n### Recursion & Render-Loop Protection\n\nIn Qt OpenGL applications, accidental calls to `update()` inside `paintGL()` or `resizeGL()` can trigger runaway infinite recursion loops. `_DrawOpenGLCanvas` implements strict safeguards:\n- Re-entrancy guard flag (`self._painting`) skips nested paint passes.\n- `paintGL()` and `resizeGL()` never schedule widget repaints. Repaints are driven strictly by the 60 FPS animation ticker and user interactions.\n\n---\n\n## Public API Reference\n\n### `Draw.super(...)`\n\nUpgrades a target window to hardware-accelerated OpenGL:\n\n```python\nDraw.super(\n    display        = \"main\",      # Target window tag (or tag=...)\n    batch_capacity = 65536,       # Max vertices per GPU draw call (default: 65,536)\n    vsync          = False,       # Toggle VSync synchronization (1=enabled, 0=uncapped)\n    gc_tuning      = True,        # Adjusts Python GC thresholds to prevent frame stutter\n)\n```\n\n---\n\n### `Draw.super_mode(...)`\n\nConfigures framework-wide maximum performance:\n\n```python\nDraw.super_mode(mode=\"max\")  # \"max\", \"quality\", \"fast\"\n```\n- Sets global performance mode in `Draw._optimize`.\n- Tunes Python garbage collection (`GCTuner.tune_for_animation()`).\n- Automatically promotes all active windows to OpenGL acceleration.\n\n---\n\n### `is_super_accelerated(...)`\n\nQueries whether a display window canvas is running on the OpenGL pipeline:\n\n```python\nis_gpu = Draw.super.is_accelerated(\"main\")  # Returns True if running on _DrawOpenGLCanvas\n```\n\n---\n\n## Automatic Fallback & Error Resilience\n\nIf OpenGL drivers or context creation fail on a system:\n1. Catches context creation exceptions cleanly.\n2. Gracefully falls back to optimized hardware-accelerated `QPainter` rendering.\n3. Emits informative warning diagnostics via Python `logging` without crashing the application.\n\n---\n\n## Comprehensive Code Examples\n\n### 1. High-Density Particle Simulation\n```python\nimport random\nimport Draw\n\nwin = Draw.window(title=\"GPU Particle Matrix\", width=1024, height=768, background_color=\"#05070c\")\n\n# Enable Super OpenGL acceleration\nDraw.super(display=\"main\", batch_capacity=65536, vsync=False)\n\n# Generate 500 animated moving particles\nfor i in range(500):\n    x = random.randint(50, 950)\n    y = random.randint(50, 700)\n    Draw.shape(\n        display=\"main\",\n        ip=f\"particle_{i}\",\n        vertices=4,\n        size=[8, 8],\n        x=x, y=y,\n        color=\"#38bdf8\",\n    )\n    Draw.motion(\n        ip=f\"particle_{i}\",\n        motion=[{\n            \"type\": \"wiggle\",\n            \"frequency\": random.uniform(1.0, 4.0),\n            \"amplitude\": random.uniform(20.0, 80.0),\n        }]\n    )\n\nDraw.window.run(\"main\")\n```\n"
  },

    "content": "# Comprehensive Technical Documentation: Draw Debug Subsystem (`Draw.debug`)\n\n`Draw.debug` (`debug.py`) is the runtime watchdog daemon, multi-threaded performance profiler, memory leak detector, schema validator, exception logger, and live developer diagnostics console for the **Draw** framework. It protects long-running graphical applications from infinite loops, runaway memory leaks, GPU context stalls, and unhandled exceptions while providing ASCII telemetry dashboards and multi-file structured logs.\n\n---\n\n## Table of Contents\n1. [Overview & Core Architecture](#overview--core-architecture)\n2. [Quick-Start & Safe Mode (`Draw.debug.safeplay()`)](#quick-start--safe-mode-drawdebugsafeplay)\n3. [Developer Settings (`DebugSettings`)](#developer-settings-debugsettings)\n4. [Live Telemetry & Process Monitor (`Draw.debug.process_monitor()`)](#live-telemetry--process-monitor-drawdebugprocess_monitor)\n5. [Watchdog Daemon & Infinite Loop Detection](#watchdog-daemon--infinite-loop-detection)\n6. [Multi-Target Logging System (`logs/`)](#multi-target-logging-system-logs)\n7. [Subsystem Profiler & Leak Detection](#subsystem-profiler--leak-detection)\n8. [Thread-Safe Emergency Shutdown (`Draw.debug.safe_stop()`)](#thread-safe-emergency-shutdown-drawdebugsafe_stop)\n9. [Comprehensive Code Examples](#comprehensive-code-examples)\n\n---\n\n## Overview & Core Architecture\n\n`Draw.debug` runs alongside the main Qt GUI event loop, monitoring thread activity, frame rendering times, memory allocations, and hardware status:\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                   Qt Main Event Loop                     \u2502\n\u2502    (Render passes, Shape animations, Event dispatches)   \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                            \u2502 Instruments metrics into\n                            \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                   PerformanceProfiler                    \u2502\n\u2502 - Category breakdown: Layout, Render, Text, GPU Upload   \u2502\n\u2502 - Frame history buffer (last 1,000 frames)               \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                            \u2502 Sampled by\n                            \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502             Background Watchdog Daemon Thread            \u2502\n\u2502                 (DrawWatchdogThread)                     \u2502\n\u2502 - Infinite Loop Detector: Samples sys._current_frames()  \u2502\n\u2502 - Memory Watchdog: Traces RSS and GC heap limits         \u2502\n\u2502 - GPU Watchdog: Queries NVML / GPUtil utilization        \u2502\n\u2502 - Deadlock & Thread Inspector                            \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n## Quick-Start & Safe Mode (`Draw.debug.safeplay()`)\n\nActivating safe mode enables all watchdog monitors, error hooks, and leak detectors with optimal production defaults:\n\n```python\nimport Draw\n\n# Enable safe mode with recommended protections\nDraw.debug.safeplay()\n```\n\n---\n\n## Developer Settings (`DebugSettings`)\n\nCustom thresholds and watchdog behaviors are configured via `Draw.debug.settings()`:\n\n```python\ncfg = Draw.debug.settings()\n\ncfg.fps_limit       = 60     # Target FPS clamp\ncfg.memory_limit    = 4096.0 # Max allowed process RSS memory in MB\ncfg.cpu_limit       = 90.0   # CPU overload percentage threshold\ncfg.gpu_limit       = 95.0   # GPU utilization threshold\ncfg.render_timeout  = 5.0    # Seconds without frame updates before flagging stall\ncfg.show_console    = True   # Mirror logs to standard output console\n```\n\n---\n\n## Live Telemetry & Process Monitor (`Draw.debug.process_monitor()`)\n\nCalling `Draw.debug.process_monitor()` generates a complete diagnostic status report:\n\n```\n========================= PROCESS MONITOR =========================\nSystem State:\n  Active Windows:    1\n  Total Objects:     254 shapes, 18 text blocks\n  Frame Rate:        60.2 FPS (Min: 58.1 | Max: 61.4)\n  Recent FPS Trend:  \u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\n  Memory (RSS):      142.6 MB / 4096.0 MB Limit\n  CPU Usage:         4.2%\n\nSubsystems Status (21 Engines):\n  Renderer:          Active (1 windows)\n  Scene Manager:     Active (272 objects)\n  Event Manager:     Active (14 connectors)\n  Animation Engine:  Active (6 active motions)\n  GPU Pipeline:      Hardware-Accelerated (OpenGL 3.3 Core)\n\nSubsystem Timings:\n  Layout:            0.4ms\n  Animation:         1.2ms\n  Render:            2.8ms\n  GPU Upload:        0.3ms\n  Frame Total:       4.7ms\n===================================================================\n```\n\n---\n\n## Watchdog Daemon & Infinite Loop Detection\n\nThe watchdog daemon thread (`DrawWatchdogThread`) runs asynchronously in the background:\n- **Non-blocking call frame sampling**: Inspects `sys._current_frames()` to verify if the main Python thread is stuck at the exact same line of application code without progressing.\n- **Internal Event Loop Exemption**: Accurately differentiates between internal Qt event loop waits (`app.exec()`, `window.run()`) and real user-code infinite loops (e.g. `while True: pass`).\n- **Auto Emergency Stop**: Automatically triggers clean window shutdown if an unrecoverable infinite loop or memory exhaustion is detected.\n\n---\n\n## Multi-Target Logging System (`logs/`)\n\nLogs are automatically categorized and written to structured disk files in the `logs/` directory:\n\n| Log File Path | Severity Level | Contents |\n| :--- | :--- | :--- |\n| `logs/runtime.log` | `INFO`, `WARNING`, `ERROR` | General lifecycle, window creation, scene transitions. |\n| `logs/warnings.log` | `WARNING`, `ERROR` | Heavy render warnings, layout collision alerts, schema key typos. |\n| `logs/crashes.log` | `CRITICAL`, `EMERGENCY` | Unhandled exceptions, stack traces, watchdog shutdowns. |\n\n---\n\n## Subsystem Profiler & Leak Detection\n\n* **`Draw.debug.check_leaks()`**: Runs garbage collection sweeps and inspects window handle counts, texture handles, and active threads to detect memory leaks.\n* **`Draw.debug.validate_scene(scene_items)`**: Validates shape dictionaries against NaN / Infinity values, negative dimensions, and invalid color types.\n* **`Draw.debug.gpu_stats()`**: Queries NVIDIA NVML / GPUtil for VRAM usage and GPU core utilization.\n\n---\n\n## Thread-Safe Emergency Shutdown (`Draw.debug.safe_stop()`)\n\n```python\nDraw.debug.safe_stop(reason=\"Memory limit exceeded\")\n```\n- Sets internal cancellation flag (`Draw.debug.should_stop()`).\n- Calls `Draw._window.window.request_shutdown(reason)` via queued signals, safely closing all PySide6 windows without illegal off-thread Qt GUI manipulation.\n\n---\n\n## Comprehensive Code Examples\n\n### 1. Enabling Safe Mode & Monitoring FPS\n```python\nimport Draw\n\n# Enable safeplay at application startup\nDraw.debug.safeplay()\n\nwin = Draw.window(title=\"Diagnostic App\", width=800, height=600)\n\nfor i in range(50):\n    Draw.shape(display=\"main\", ip=f\"s_{i}\", vertices=4, size=[40, 40], x=i*15, y=200, color=\"cyan\")\n    Draw.motion(ip=f\"s_{i}\", motion=[{\"type\": \"sine\", \"speed\": 2.0}])\n\n# Periodic diagnostic print\nDraw.after(2.0, lambda: print(Draw.debug.process_monitor()))\n\nDraw.window.run(\"main\")\n```\n"

    "content": "# Draw Math, Tree, FileDialog & Grid Modules Documentation\n\nThis document covers four core component and helper modules in the **Draw** graphics engine:\n\n1. [`_calculator.py`](#1-draw_calculator-_calculatorpy) \u2014 Sandboxed AST Expression Evaluator & String Calculator\n2. [`_file_tree.py`](#2-draw_file_tree-_file_treepy) \u2014 Native QTreeWidget Explorer & Data Tree\n3. [`_filedialog.py`](#3-draw_filedialog-_filedialogpy) \u2014 Native OS File & Folder Selection Dialogs\n4. [`_widget.py`](#4-draw_widget-_widgetpy) \u2014 High-Level Component Grid & Table Generator\n\n---\n\n## 1. Draw._calculator (`_calculator.py`)\n\n### Overview & Purpose\n`Draw._calculator` provides a secure, sandboxed AST-based expression evaluation engine for `Draw.color()` and `Draw.motion()` dynamic math formulas as well as user-facing math expression evaluation (`Draw.calculator`).\n\nIt parses expressions using Python's `ast.parse(mode=\"eval\")` to safely evaluate math formulas without using unsafe `eval()` or `exec()`.\n\n### Unified 5-Stage Execution Pipeline\n```\n        Input Expression String\n                   \u2502\n                   \u25bc\n  [1] Length Validation (<= 1,024 chars)\n                   \u2502\n                   \u25bc\n  [2] AST Parsing (ast.parse with column-accurate SyntaxError formatting)\n                   \u2502\n                   \u25bc\n  [3] AST Complexity Validation (Node Whitelist, <= 250 Nodes)\n                   \u2502\n                   \u25bc\n  [4] Safe Math Evaluation (<= 40 Recursion Depth, Exponent Cap <= 1,000, Overflow Guards)\n                   \u2502\n                   \u25bc\n  [5] Output Formatting (Precision Trimming for calculator, or direct float for eval_expression)\n```\n\n### Resource & Complexity Limits\nTo prevent CPU starvation, memory exhaustion, or denial-of-service in 60 FPS animation loops:\n- **Maximum Expression Length**: `1024` characters.\n- **Maximum AST Node Count**: `250` nodes.\n- **Maximum Recursion Depth**: `40` levels.\n- **Maximum Exponent Magnitude**: Exponent $|b| \\le 1000$ in $a^b$. Base $|a| \\le 10^6$ for powers $> 100$.\n- **Arithmetic Overflow Guards**: `OverflowError` and domain errors are caught and converted into clean `ValueError` exceptions.\n\n### Safe Built-in Functions & Constants\n- **Trigonometric & Hyperbolic**: `sin`, `cos`, `tan`, `asin`, `acos`, `atan`, `sinh`, `cosh`, `tanh`, `degrees`, `radians`.\n  > [!NOTE]\n  > `tan(x)` produces large values near its odd asymptotes $(2k+1)\\frac{\\pi}{2}$ due to standard floating-point approximation limits.\n- **Arithmetic & Rounding**: `abs`, `min`, `max`, `sqrt`, `log` ($\\log_{10}$), `ln` ($\\log_e$), `log2`, `floor`, `ceil`, `round`.\n- **Interpolation Helpers**: `lerp(a, b, t)` (linear interpolation clamped to $0..1$), `step(edge, x)` ($0.0$ if $x < \\text{edge}$ else $1.0$).\n- **Whitelisted Constants**: `pi` ($\\pi$), `e` ($e$), `tau` ($\\tau = 2\\pi$), `inf` / `infinity` ($\\infty$).\n\n### Key Public Functions\n- **`eval_expression(expr: str, variables: dict = None, max_length=1024, max_nodes=250) -> float`**:\n  Evaluates mathematical expressions (e.g. `\"sin(time * 3) * 50 + 50\"`) with custom variable maps.\n- **`is_expression(value: Any) -> bool`**:\n  Fast heuristic classifier detecting whether a string looks like a dynamic math expression (operators `+`, `-`, `*`, `/`, `%`, `**` or function names `sin`, `cos`, `lerp`, etc.) vs a static literal, percentage (`\"50%\"`), or hex color (`\"#FF0000\"`).\n- **`Draw.calculator(text, live_text=None, empty_answer=\"0\", precision=12, error_value=None, variables=None) -> str`**:\n  Evaluates expressions and returns clean, trimmed strings. Pass `error_value=\"Error\"` to gracefully return a fallback string instead of raising on malformed input.\n\n---\n\n## 2. Draw._file_tree (`_file_tree.py`)\n\n### Overview & Purpose\n`Draw._file_tree` embeds a native `QTreeWidget` into canvas surfaces. It supports dual operation modes:\n1. **Filesystem Scanning Mode**: Scans disk folders recursively with optional extension filtering and lazy directory expansion.\n2. **Nested Dictionary Mode**: Renders hierarchical JSON/dict data as collapsible tree nodes.\n\n### Features & Styling Scoping\n- **QSS Scoping**: Applies stylesheet rules scoped to `QTreeWidget#<ip>` via `setObjectName(ip)` to prevent style leaks to other trees.\n- **Lazy Expansion**: Populates directory children only when expanded by the user.\n\n### Public API & Control Methods\n- **`Draw.filetree(ip, display=\"main\", root_path=..., data=..., ...)`**: Initializes tree widget.\n- **`Draw.filetree.refresh(ip)`**: Re-scans disk directory or re-loads dictionary tree.\n- **`Draw.filetree.expand_all(ip)` / `.collapse_all(ip)`**: Expands or collapses all tree nodes.\n- **`Draw.filetree.selected(ip) -> str`**: Returns selected item path or key.\n- **`Draw.filetree.move(ip, x=, y=)` / `.resize(ip, width=, height=)`**: Moves or resizes tree widget.\n\n---\n\n## 3. Draw._filedialog (`_filedialog.py`)\n\n### Overview & Purpose\n`Draw._filedialog` provides native OS dialog integration using PySide6's `QFileDialog`.\n\n### Window Parenting & Window Modality\nDialog functions automatically resolve the active application window from `Draw._window` and pass it as the parent widget to `QFileDialog`. This guarantees dialogs center over the application window and maintain modal behavior across multi-monitor setups.\n\n### Public API\n- **`Draw.filedialog.open_file(caption=\"Select File\", dir=\"\", filter=\"All Files (*.*)\") -> str | None`**\n- **`Draw.filedialog.save_file(caption=\"Save File\", dir=\"\", filter=\"All Files (*.*)\") -> str | None`**\n- **`Draw.filedialog.select_folder(caption=\"Select Folder\", dir=\"\") -> str | None`**\n\n---\n\n## 4. Draw._widget (`_widget.py`)\n\n### Overview & Purpose\n`Draw._widget` provides `Draw.grid` \u2014 a template-stamping helper for component grids (keypads, dashboards, icon grids).\n\nInstead of computing coordinates manually for every cell, `Draw.grid` takes a shared shape template and text template, auto-places items in row-major order, auto-derives cell IPs (`f\"{grid_ip}_{col}_{row}\"`), and formats shape/text definitions for rendering.\n\n### Public API & Usage Signature\n```python\nshapes, texts, table_def = Draw.grid(\n    display=\"main\",\n    ip=\"keypad\",\n    dimension={\"rows\": 4, \"columns\": 4},\n    template={\n        \"size\": [60, 60],\n        \"border_radius\": 8,\n        \"color\": \"#1e293b\",\n    },\n    text_template={\n        \"font_size\": 18,\n        \"color\": \"white\",\n    },\n    items=[\n        {\"label\": \"7\"}, {\"label\": \"8\"}, {\"label\": \"9\"}, {\"label\": \"/\"},\n        {\"label\": \"4\"}, {\"label\": \"5\"}, {\"label\": \"6\"}, {\"label\": \"*\"},\n        {\"label\": \"1\"}, {\"label\": \"2\"}, {\"label\": \"3\"}, {\"label\": \"-\"},\n        {\"label\": \"0\"}, {\"label\": \".\"}, {\"label\": \"=\"}, {\"label\": \"+\"},\n    ]\n)\n```\n\n---\n\n## Code Examples\n\n### Example 1: Sandboxed Expression Evaluation (`_calculator.py`)\n```python\nfrom Draw._calculator import eval_expression, calculator, is_expression\n\n# 1. Dynamic variable math evaluation with constants (pi, tau, e)\nvariables = {\"time\": 2.0, \"x\": 100.0}\nval = eval_expression(\"sin(time * tau) * 50 + x\", variables)\n\n# 2. Fast heuristic expression check\nprint(is_expression(\"sin(time * 2)\"))  # True\nprint(is_expression(\"50%\"))            # False (static percentage)\nprint(is_expression(\"#FF0000\"))        # False (hex color)\nprint(is_expression(\"124.5\"))          # False (numeric literal)\n\n# 3. String calculator with error fallback & precision trimming\nanswer = calculator(\"10 / 2 + 3\", precision=2)  # \"8\"\nerr = calculator(\"10 / 0\", error_value=\"Error\")  # \"Error\"\ntau_ans = calculator(\"tau / 2\")                 # \"3.14159265359\"\n```\n\n---\n\n### Example 2: Native File Tree Explorer (`_file_tree.py`)\n```python\nimport Draw\n\n# Initialize filesystem tree explorer\nDraw.filetree(\n    ip=\"explorer\",\n    display=\"main\",\n    root_path=\"C:/Project\",\n    x=20, y=20, width=280, height=500,\n    file_filter=[\".py\", \".json\", \".md\"],\n    style={\n        \"background_color\": \"#0f172a\",\n        \"text_color\": \"#f8fafc\",\n        \"selection_color\": \"#3b82f6\",\n        \"font_size\": 14,\n    },\n    on_select=lambda path: print(\"Selected:\", path),\n    on_double_click=lambda path: print(\"Opened:\", path),\n)\n```\n\n---\n\n### Example 3: Native OS File Dialogs (`_filedialog.py`)\n```python\nimport Draw\n\n# Open file dialog\nselected_file = Draw.filedialog.open_file(\n    caption=\"Select Image\",\n    filter=\"Images (*.png *.jpg *.webp)\"\n)\nif selected_file:\n    print(\"User picked file:\", selected_file)\n\n# Select directory\ntarget_folder = Draw.filedialog.select_folder(caption=\"Choose Destination\")\n```\n\n---\n\n### Example 4: Auto-Placed Component Grid (`_widget.py`)\n```python\nimport Draw\n\n# Generate a 3x3 button keypad grid\nshapes, texts, table_def = Draw.grid(\n    grid_ip=\"numpad\",\n    dimension={\"rows\": 3, \"columns\": 3},\n    template={\n        \"size\": [80, 80],\n        \"border_radius\": 12,\n        \"color\": \"#334155\",\n        \"border_width\": 2,\n        \"border_color\": \"#475569\",\n    },\n    text_template={\n        \"font_size\": 24,\n        \"color\": \"#f8fafc\",\n    },\n    items=[\n        {\"label\": \"1\"}, {\"label\": \"2\"}, {\"label\": \"3\"},\n        {\"label\": \"4\"}, {\"label\": \"5\"}, {\"label\": \"6\"},\n        {\"label\": \"7\"}, {\"label\": \"8\"}, {\"label\": \"9\"},\n    ]\n)\n```\n"

    "content": "# Comprehensive Technical Documentation: `Draw._optimize` Module\n\n---\n\n## 1. Executive Summary & Module Overview\n\n`Draw._optimize` is the high-performance optimization, spatial acceleration, multi-backend vector math, and lifecycle compiler module for the **Draw** vector UI and rendering framework.\n\nIt bridges declarative Python graphics authoring with C-level execution speed, exposing:\n- **Pluggable Backend Pipeline (`BackendManager`)**: Dynamic selection between Cython / C native extensions, vectorized NumPy C-arrays, and pure Python fallbacks. Supports custom third-party backends (GPU, Rust, custom C extensions) via `BackendManager.register_backend()`.\n- **Decoupled Engines**:\n  - `GeometryEngine`: 2D point matrix transformations (scale, rotate, translate) & bounding box calculations.\n  - `CollisionEngine`: Batch AABB intersection testing & point-in-box hit detection.\n  - `SpatialEngine`: Coordinates 2D spatial grid indexing and bounds acceleration.\n- **Uniform Spatial Hashing Index (`SpatialGridIndex`)**: $O(1)$ bucket spatial indexing for fast hit-testing, point queries, rectangle queries, and instant moving object updates (`update()`).\n- **Low-Stutter Garbage Collection Control (`GCTuner`)**: Automatic GC generation threshold tuner to prevent stutter during 60 FPS animation loops.\n- **Qt Render Profile Manager (`RenderProfileManager`)**: Self-applying QPainter render hint profile manager (`apply(painter)`).\n- **Recycled Object Pool (`FastObjectPool`)**: Fast memory recycler supporting `reset_fn` callbacks or `obj.reset()` hooks to eliminate memory churn.\n- **Thread Safety**: All global state, spatial grids, object pools, and compilable registries are synchronized using reentrant locks (`threading.RLock()`).\n\n---\n\n## 2. Core Architecture & Class Hierarchy\n\n```\nDraw._optimize\n\u251c\u2500\u2500 BackendInterface (Abstract Base)\n\u2502   \u251c\u2500\u2500 CythonImportLoader (Priority 100)\n\u2502   \u251c\u2500\u2500 NumPyBackend (Priority 50)\n\u2502   \u2514\u2500\u2500 PythonBackend (Priority 0)\n\u251c\u2500\u2500 BackendManager (Backend Selector & Registry)\n\u251c\u2500\u2500 GeometryEngine (Specialized Matrix & AABB Math)\n\u251c\u2500\u2500 CollisionEngine (Specialized Overlap & Hit Testing)\n\u251c\u2500\u2500 SpatialEngine (Global Spatial Index Coordinator)\n\u251c\u2500\u2500 SpatialGridIndex (O(1) Spatial Hashing Grid)\n\u251c\u2500\u2500 RenderProfileManager (Self-Applying QPainter Hints)\n\u251c\u2500\u2500 FastObjectPool (Thread-Safe Object Recycler with Reset Hooks)\n\u251c\u2500\u2500 GCTuner (GC Threshold Manager)\n\u2514\u2500\u2500 Public APIs (optimize, performance_info, performance_mode, compilable, FastInit)\n```\n\n---\n\n## 3. Class & Method Specifications\n\n### 3.1 Backend Architecture\n\n#### `BackendInterface`\nAbstract base class defining contract for vector math backends.\n- `name: str` \u2014 Identifier name.\n- `priority: int` \u2014 Selection priority rank.\n- `is_available() -> bool` \u2014 True if backend dependencies are met.\n- `transform_vertices(vertices, dx, dy, angle_deg, scale_x, scale_y) -> list` \u2014 Batch 2D matrix transformation.\n- `compute_aabb(vertices) -> tuple` \u2014 Calculates min_x, min_y, width, height.\n- `aabb_intersections(boxes_a, boxes_b) -> list` \u2014 Matrix overlap test across AABBs.\n- `point_in_boxes(px, py, boxes) -> list` \u2014 Hit test matching point `(px, py)` against boxes.\n\n#### `BackendManager`\nCentral registry and priority selector.\n- `register_backend(backend: BackendInterface) -> None`: Registers custom backend.\n- `get_active_backend() -> BackendInterface`: Resolves highest-priority available backend.\n- `get_active_backend_name() -> str`: Returns active backend name (`\"Cython\"`, `\"NumPy\"`, `\"Python\"`, etc.).\n\n---\n\n### 3.2 Specialized Engines\n\n#### `GeometryEngine`\n- `batch_transform_vertices(...) -> list`: Transforms 2D coordinates using active backend.\n- `compute_aabb(...) -> Tuple[float, float, float, float]`: Computes bounding box using active backend.\n\n#### `CollisionEngine`\n- `batch_aabb_intersections(boxes_a, boxes_b) -> list`: Performs batch AABB overlap testing.\n- `point_in_boxes(px, py, boxes) -> list`: Performs point hit testing against bounding boxes.\n\n#### `SpatialEngine`\n- `get_global_grid() -> SpatialGridIndex`: Accesses global spatial hashing index.\n\n---\n\n### 3.3 Spatial Hashing & Object Pool\n\n#### `SpatialGridIndex`\nUniform 2D Spatial Grid with bucket hashing ($O(1)$ spatial queries).\n- `insert(item_id, bbox)`: Inserts item into spatial grid buckets.\n- `remove(item_id)`: Removes item from grid.\n- `update(item_id, new_bbox)`: Fast update for moving objects. Bypasses cell re-indexing if new bounding box occupies the exact same spatial grid cells.\n- `query_rect(bbox) -> Set[item_id]`: Returns candidate item IDs intersecting rectangle.\n- `query_point(px, py) -> Set[item_id]`: Returns candidate item IDs containing point `(px, py)`.\n- `clear()`: Clears all spatial buckets.\n\n#### `FastObjectPool`\nThread-safe object pool with automatic state reset.\n- `__init__(factory_fn, reset_fn=None, max_size=1000)`\n- `acquire() -> obj`: Acquires object from pool or creates new via `factory_fn`.\n- `release(obj)`: Executes `reset_fn(obj)` or `obj.reset()` if present, then stores object back in pool.\n\n---\n\n### 3.4 Qt Render Profiles & GC Control\n\n#### `RenderProfileManager`\n- `PROFILES`: `\"quality\"`, `\"fast\"`, `\"ultra\"`.\n- `set_profile(profile_name)`: Sets active profile.\n- `get_profile_settings(profile_name=None) -> dict`: Returns settings dict.\n- `apply(painter, profile_name=None) -> bool`: Directly applies `setRenderHint` flags (`Antialiasing`, `SmoothPixmapTransform`, `TextAntialiasing`) onto PySide6 / PyQt `QPainter` instances.\n\n#### `GCTuner`\n- `tune_for_animation()`: Adjusts Python garbage collector generation thresholds to `(50000, 500, 500)` to eliminate frame stutters.\n- `restore()`: Restores system default GC thresholds.\n\n---\n\n## 4. Public API & Usage Examples\n\n### 4.1 System Performance Info & Diagnostics\n```python\nimport Draw\n\n# Query active performance state\ninfo = Draw.performance_info()\nprint(info)\n# Output:\n# {\n#   'backend': 'NumPy',\n#   'numpy': True,\n#   'cython': False,\n#   'cython_module': None,\n#   'gc': False,\n#   'render_profile': 'fast',\n#   'mode': 'dev',\n#   'registered_classes': ['ShapeDef', 'ConnectorRecord'],\n#   'live_instances': 0\n# }\n```\n\n### 4.2 Scene Compilation & Maximum Performance Mode\n```python\nimport Draw\n\n# Force-compile dirty scene objects, activate max mode & GC tuning\nreport = Draw.optimize(mode=\"max\", render_profile=\"fast\")\nprint(report)\n```\n\n### 4.3 Custom Backend Registration\n```python\nfrom Draw._optimize import BackendManager, BackendInterface\n\nclass CustomRustBackend(BackendInterface):\n    name = \"RustNative\"\n    priority = 150\n    def is_available(self):\n        return True\n    # Implement transform_vertices, compute_aabb, etc.\n\n# Register custom backend\nBackendManager.register_backend(CustomRustBackend())\nassert BackendManager.get_active_backend_name() == \"RustNative\"\n```\n\n### 4.4 Spatial Grid Indexing for Moving Objects\n```python\nfrom Draw._optimize import SpatialGridIndex\n\ngrid = SpatialGridIndex(cell_size=100.0)\n\n# Insert static & moving elements\ngrid.insert(\"player\", (10, 10, 30, 30))\ngrid.insert(\"enemy\", (150, 150, 40, 40))\n\n# Fast O(1) Point Query\nhits = grid.query_point(15, 15)  # returns {'player'}\n\n# Fast Update for Moving Player\ngrid.update(\"player\", (12, 12, 30, 30))  # Bypasses bucket re-allocation (same cells)\ngrid.update(\"player\", (400, 400, 30, 30)) # Re-indexes into cell (4, 4)\n```\n\n### 4.5 Applying QPainter Render Profiles\n```python\nfrom Draw._optimize import RenderProfileManager\n\ndef paintEvent(self, event):\n    painter = QPainter(self)\n    RenderProfileManager.apply(painter, \"fast\")  # Configures anti-aliasing & pixmap hints\n    # Render scene...\n```\n\n---\n\n## 5. Thread Safety Guarantees\n\nAll public methods, registries, spatial index queries/updates, object pool operations, and performance state modifications are synchronized using a global reentrant lock (`threading.RLock()`). \n\nThis guarantees **100% thread-safe operation** across background rendering threads, worker tick loops, and async asset loaders.\n"

    "content": "# Draw Tools, Loader & Panel Modules Documentation\n\nThis document provides a comprehensive technical overview of three core utility, UI indicator, and windowing modules in the **Draw** graphics engine:\n\n1. [`_tools.py`](#1-draw_tools-_toolspy) (`Draw._tools`) \u2014 Shared Qt Geometry, Resource, Clipboard, Dialog, Image, Multimedia, & Environment Utilities\n2. [`_loader.py`](#2-draw_loader-_loaderpy) (`Draw.loader`) \u2014 Loading Indicators, Animated Spinners, & Progress Bars with `_colour` Integration\n3. [`_panel.py`](#3-draw_panel-_panelpy) (`Draw.panel`) \u2014 Embedded Floating Mini-Windows with Independent Canvas & Window System Integration\n\n---\n\n## 1. Draw._tools (`_tools.py`)\n\n### Overview & Purpose\n`Draw._tools` is the lowest-level Qt convenience layer in the Draw package. It exposes point, rectangle, polygon, vector, and line geometry functions, clipboard access, file dialog pickers, image scaling/conversion helpers, lazy `QtMultimedia` constructors, and cross-platform system facts.\n\nIt deliberately avoids dependency on higher-level Draw widgets, scenes, layouts, colors, or rendering, making it safe and cheap to import for headless operations.\n\n---\n\n### Functional Modules & Public API\n\n#### A. Qt Geometry & Connection Primitives\n- **Point Coercion**: `_pointf(value)` coerces `QPoint`, `QPointF`, or `(x, y)` tuples/lists into `QPointF`.\n- **Bounding Boxes & Centers**:\n  - `center(val)`: Returns geometric center of `QRect`, `QRectF`, `QLine`, `QLineF`, `QPolygon`, or `QPolygonF`.\n  - `edge_center(rect, edge)`: Returns `QPointF` center of `\"top\"`, `\"bottom\"`, `\"left\"`, or `\"right\"` edge.\n  - `corner(rect, name)`: Returns `QPointF` for `\"top-left\"`, `\"top-right\"`, `\"bottom-left\"`, or `\"bottom-right\"`.\n  - `midpoint(p1, p2)`: Calculates point halfway between `p1` and `p2`.\n  - `nearest_edge(point, rect)` / `nearest_corner(point, rect)`: Returns closest edge string or corner `QPointF`.\n  - `nearest_point(point, candidates)`: Finds closest candidate `QPointF` from an iterable.\n- **Vectors & Spatial Math**:\n  - `distance(p1, p2)`: Euclidean distance in pixels.\n  - `angle(p1, p2)`: Clockwise angle in degrees.\n  - `direction_vector(p1, p2)` / `normalize_vector(vec)`: Vector calculations.\n  - `project_point(p, line_start, line_end)`: Orthogonal projection onto an infinite 2D line.\n  - `snap_point(point, grid)`: Grid snapping for float grid sizes or `(w, h)` grid dimensions.\n  - `bounding_rect(points)`: Calculates normalized `QRectF` enclosing a polygon or point sequence.\n  - `line_intersection(l1, l2)`: Bounded-segment line intersection `QPointF` (or `None`).\n  - `rect_intersection(r1, r2)`: Overlapping `QRectF` intersection (or `None`).\n  - `contains(rect, point)` / `intersects(r1, r2)` / `aspect_ratio(size)`: Common spatial predicates.\n\n#### B. Portable Resource & URL Utilities\n- **`url(val)`**: Converts string/Path/QUrl to `QUrl` (detecting schemes or local file paths).\n- **`file_to_url(path)` / `url_to_file(val)`**: Conversions between local paths and `QUrl`.\n- **`is_url(val)`**: Validates if input is a valid URL or local file URL.\n- **`resource_path(*parts)`**: Generates absolute paths anchored to Draw's package root.\n\n#### C. Lazy Qt Multimedia Wrappers\n`QtMultimedia` modules are imported lazily via `_multimedia()` to preserve geometry-only import speed:\n- `media_player(parent, audio_output=True)`\n- `audio_output(parent)`, `video_sink(parent)`, `sound_effect(parent)`\n- `camera(device=None, parent=None)`\n- `media_capture_session(parent, **targets)`\n- **Dynamic Attribute Access**: `__getattr__(name)` lazily exposes `QMediaPlayer`, `QAudioOutput`, `QVideoSink`, `QSoundEffect`, `QCamera`, `QMediaCaptureSession`.\n\n#### D. Clipboard & GUI Dialog Boundaries\n- `copy_text(val)` / `paste_text()`: System clipboard text access via `Draw._clipboard`.\n- `copy_image(img)` / `paste_image()`: System clipboard `QImage`/`QPixmap` support.\n- `open_file_dialog()`, `save_file_dialog()`, `select_directory()`: Native file picker dialog wrappers.\n- `message_box(text, title, level, parent)`: Standard message box prompt (`information`, `warning`, `critical`, `question`).\n- `color_dialog(initial, parent)` / `font_dialog(initial, parent)`: Native Qt color/font pickers.\n\n#### E. Image Utilities\n- `load_image(path, as_pixmap=False)` / `save_image(img, path, format, quality)`\n- `create_icon(source)`: Preserves or converts images into `QIcon`.\n- `thumbnail(source, size)`: Aspect-ratio preserving smooth-scaled `QImage`.\n\n#### F. Auto Z-Indexing Manager\n- `next_z(step=1.0)`: Returns the current auto Z value and increments by step. Elements created first receive lower Z values (0.0, 1.0, 2.0...).\n- `auto_z(reset=False, start=0.0, step=1.0)`: Auto Z manager call. Set `reset=True` to reset counter to start value.\n- `reset_z(start=0.0)`: Resets global auto Z counter to `start`.\n\n#### G. Environment & Type Validation\n- `screen_size()`, `available_geometry()`, `device_pixel_ratio()`, `dpi()`, `logical_dpi()`\n- `is_number(val)`, `is_path(val, exists=False)`\n- `is_color(val)`: Returns `True` for valid `QColor` instances, hex/named color strings, or numeric RGB/RGBA tuples and lists `(0..255)`.\n- `safe_cast(val, target, default=None)`: Exception-safe conversion wrapper.\n- `platform_name()`, `is_windows()`, `is_linux()`, `is_macos()`\n- `temporary_directory()`, `home_directory()`, `now(utc=False)`, `elapsed_ms(timer)`, `single_shot(ms, callback)`\n\n---\n\n## 2. Draw._loader (`_loader.py`)\n\n### Overview & Purpose\n`Draw._loader` exposes the `loader()` function to create loading indicators, spinners, and progress bars on any display canvas. Under the hood, it combines shape generation (`_shapes.py`), motion animations (`_motion.py`), and dynamic color binding (`_colour.py`).\n\n---\n\n### Public API & Signature\n```python\nfrom Draw._loader import loader\n\nloader(\n    display = None,         # Target window or panel tag\n    tag     = None,         # Alias for display\n    ip      = None,         # Unique identifier for the loader\n    shape   = \"circle\",     # Preset (\"circle\", \"ring\", \"bar\"), custom shape dict/list, or shape IP\n    color   = \"cyan\",       # Color string, QColor, RGB tuple/list, or existing color IP binding\n    motion  = \"spin\",       # Motion preset (\"spin\", \"pulse\", \"progress\"), custom motion dict/list, or motion IP\n    **kwargs                # Extra shape properties (x, y, size, align, z, opacity, etc.)\n)\n```\n\n---\n\n### Key Features & Implementation\n\n1. **Shape Presets & Canvas IP Resolution**:\n   - `\"circle\"`: Dashed 36-vertex circular spinner ring.\n   - `\"ring\"`: Solid 36-vertex circular loader.\n   - `\"bar\"`: Rounded progress bar (`150x8` size, `border_radius=4`).\n   - **Canvas Shape IP**: If `shape` references an existing shape IP on the active canvas (excluding reserved presets), its properties are cloned.\n2. **Color Integration (`_colour.py`)**:\n   - Accepts string color names (`\"red\"`), hex codes (`\"#ff0000\"`), RGB/RGBA tuples/lists (`(0, 188, 212)`), or `QColor` objects.\n   - If `color` is a registered color binding IP in `_colour.py` (`_color_registry.get_binding(color)`), the loader automatically connects to that dynamic color IP binding.\n3. **Motion Integration (`_motion.py`)**:\n   - `\"spin\"` / `\"rotate\"`: Continuous 360\u00b0 rotation (1.2s duration).\n   - `\"pulse\"`: Opacity pulse animation (20% to 100%, 1.0s duration).\n   - `\"progress\"`: Horizontal scale animation (`[0.0, 1.0]` to `[1.0, 1.0]`, 2.0s duration).\n   - **Motion IP**: Reuses connected motion specs registered under existing motion IPs.\n\n---\n\n## 3. Draw._panel (`_panel.py`)\n\n### Overview & Purpose\n`Draw._panel` provides floating, embedded mini-windows inside an existing `Draw` window canvas. Each panel hosts its own inner canvas (`_DrawCanvas`), allowing standard drawing calls like `Draw.shape(display=\"panel_ip\", ...)` to treat panels identically to standard windows.\n\n---\n\n### Public API & Usage\n\n```python\nfrom Draw._panel import panel\n\n# 1. Create an embedded panel\npdef = panel(\n    ip               = \"settings\",      # Unique ID (REQUIRED)\n    display          = \"main\",          # Parent window tag\n    title            = \"Settings\",\n    width            = 300,\n    height           = 400,\n    x                = 50,\n    y                = 50,\n    align            = None,            # \"center\", \"top-left\", \"bottom-right\", etc.\n    background_color = \"#1e1e2e\",\n    title_color      = \"#cdd6f4\",\n    title_background = \"#313244\",\n    border_color     = \"#45475a\",\n    border_width     = 1,\n    border_radius    = 10.0,\n    transparency     = 100,             # Opacity percentage (0-100)\n    draggable        = True,\n    resizable        = False,\n    closable         = True,\n    minimizable      = False,\n    frameless        = False,           # Hides title bar when True\n    always_on_top    = False,\n    visible          = True,\n    min_width        = 80,\n    min_height       = 60,\n    max_width        = None,\n    max_height       = None,\n    shadow           = True,\n    shadow_color     = \"#000000\",\n    shadow_blur      = 12,\n    properties       = {},              # User metadata dict\n)\n\n# 2. Draw directly inside the panel using display=\"settings\"\nDraw.shape(display=\"settings\", shape=[{\"vertices\": 4, \"color\": \"purple\", \"size\": [100, 100]}])\nDraw.text(display=\"settings\", text=\"Panel Content\", x=10, y=10)\n\n# 3. Panel Control API\npanel.show(\"settings\")\npanel.hide(\"settings\")\npanel.move(\"settings\", x=100, y=200)\npanel.resize(\"settings\", width=400, height=500)\npanel.update_style(\"settings\", background_color=\"#282a36\", border_color=\"#bd93f9\")\npanel.clear(\"settings\")                 # Clears shapes/texts inside panel\npanel.close(\"settings\")                 # Closes and deletes panel frame widget\n```\n\n---\n\n### Key Architecture & Implementation Details\n\n1. **`_PanelFrame` Custom Widget**:\n   - Custom `QFrame` subclass rendering drop-shadows, background fill, title bar text, close/minimize buttons, and border lines using anti-aliased `QPainterPath` drawing.\n   - Supports title-bar mouse dragging (`Qt.CursorShape.SizeAllCursor`) and bottom-right corner resizing.\n2. **Inner Canvas Embedding**:\n   - Contains an inner `_content_widget` hosting `_DrawCanvas`.\n   - Registers `_PanelFrame` under `_window_registry._windows[ip]`, allowing all standard drawing calls (`Draw.shape`, `Draw.text`, `Draw.point`, etc.) to target `display=ip`.\n3. **Color Integration (`_colour.py`)**:\n   - Uses `_parse_color` from `Draw._colour` for all color properties (`background_color`, `title_color`, `title_background`, `border_color`, `shadow_color`).\n4. **Validation & Exception Safety**:\n   - Validates parent window existence and raises clear `ValueError` exceptions if no active windows exist or if `display` refers to an unknown parent tag.\n"
  },
  "four-modules": {
    "id": "four-modules",
    "title": "Clipboard, Layout & List Engines",

    "desc": "MIME clipboard, flex grid weights, list sorting/search, spatial collision strategies, alignment engine.",
    "content": "# Comprehensive Technical Documentation: Draw Submodules (`_clipboard`, `_layout`, `_list`, `_overlap`)\n\n---\n\n## 1. Executive Summary\n\nThis documentation details the architecture, public APIs, PySide6 integrations, and enhanced features for four core Draw submodules:\n1. **`Draw._clipboard`** (`_clipboard.py`): Cross-platform clipboard system supporting plain text, HTML/Rich text, custom MIME data payloads, clearing, and live clipboard change notification signals.\n2. **`Draw._layout`** (`_layout.py`): Layout container geometry math engines (`TableLayout`, `GridLayout` flex weights, `ListLayout`, `StackLayout`, `FlowLayout`, `CanvasLayout`, `CombinedCellLayout`).\n3. **`Draw._list`** (`_list.py`): Key-value list renderer, auto-width measurement, interactive column header sorting, multi-field search engine, row predicate filtering, and staggered entry animations.\n4. **`Draw._overlap`** (`_overlap.py`): Collision resolution and flow placement engine (`Rect` geometry, `RotatedRect` oriented bounding box math, `QuadTree` $O(N \\log N)$ spatial partitioning index, 7 placement strategies).\n\n---\n\n## 2. Module Breakdown & API Reference\n\n### 2.1 `Draw._clipboard` (`_clipboard.py`)\n\nThin, robust wrapper around PySide6 `QClipboard` and `QMimeData`.\n\n#### Public API Reference:\n* `Draw.clipboard.copy(text: object) -> None`\n  Write plain text to OS clipboard.\n* `Draw.clipboard.read() -> str`\n  Read plain text from OS clipboard.\n* `Draw.clipboard.copy_html(html: str, text: Optional[str] = None) -> None`\n  Write Rich Text / HTML to OS clipboard with optional plain text fallback.\n* `Draw.clipboard.read_html() -> str`\n  Read HTML content from OS clipboard.\n* `Draw.clipboard.clear() -> None`\n  Wipe all clipboard contents securely.\n* `Draw.clipboard.copy_data(mime_type: str, data: bytes | str) -> None`\n  Write custom binary payload or JSON string to clipboard under a custom MIME type.\n* `Draw.clipboard.read_data(mime_type: str) -> bytes`\n  Read custom binary payload from clipboard by MIME type string.\n* `Draw.clipboard.on_change(callback: Callable[[], None]) -> None`\n  Register a callback listener triggered when external clipboard content changes (`QClipboard.dataChanged`).\n\n---\n\n### 2.2 `Draw._layout` (`_layout.py`)\n\nLayout container math engines decoupled from widget rendering.\n\n#### Supported Layout Types:\n1. **`TableLayout`**: Rectangular grid table math with percentage/pixel margins and cell decoration styling.\n2. **`GridLayout`**: Enhanced grid container supporting fractional flex column weights (`\"1fr\"`, `\"2fr\"`).\n3. **`ListLayout`**: 1D linear container (`orientation=\"vertical\"` or `\"horizontal\"`, `spacing`).\n4. **`StackLayout`**: Layered Z-index container where children overlay each other.\n5. **`FlowLayout`**: Wrapping horizontal flow container across rows (`item_width`, `item_height`, `horizontal_gap`, `vertical_gap`).\n6. **`CanvasLayout`**: Absolute coordinate `(x, y)` positioning container.\n7. **`CombinedCellLayout`**: Virtual cell spanning merged cells across a base table layout.\n\n#### Registration & Parsing:\nRegistered via `Draw.table(dimension={\"type\": \"list\" | \"stack\" | \"flow\" | \"canvas\" | \"grid\" | \"table\", ...})`.\n\n---\n\n### 2.3 `Draw._list` (`_list.py`)\n\nKey-value dictionary renderer and tabular data manipulation helper.\n\n#### Capabilities & Helper API Reference:\n* **Interactive Sorting**: `sort_list_data(data: dict, sort_by: str, sort_order: str = \"asc\") -> dict`\n  Re-orders dictionary rows according to column key values (supports string & numeric sorting, ascending/descending).\n* **Multi-Field Search**: `search_list_data(data: dict, query: str, fields: Optional[list[str]] = None) -> dict`\n  Filters data rows matching substring `query`.\n* **Row Predicate Filtering**: `filter_list_data(data: dict, predicate: Callable[[dict], bool]) -> dict`\n  Filters rows using custom Python lambda/predicate functions.\n* **Auto Sizing**: Character heuristic auto-width calculation (`_estimate_text_width`).\n* **Visual Customization**: Key header styling (`key_color`, `bold_keys`), zebra striping (`alt_color`), hover (`hover_color`), selection colors (`select_color`), padding, cell borders.\n\n---\n\n### 2.4 `Draw._overlap` (`_overlap.py`)\n\nPlacement strategy, spatial indexing, and collision resolution engine.\n\n#### Key Architecture Components:\n* **`Rect`**: Immutable axis-aligned bounding box primitive (`intersects`, `contains_point`, `contains_rect`, `expand`, `move_to`).\n* **`Rect.rotated_bounds(angle_degrees)`**: Oriented Bounding Box (OBB) helper calculating the minimal bounding box enclosing rotated shapes.\n* **`QuadTree`**: Spatial partitioning tree for fast $O(N \\log N)$ 2D collision queries (`insert`, `retrieve`, `clear`).\n* **7 Placement Strategies**:\n  1. `HorizontalStackStrategy`: Left-to-right flow with line wrapping.\n  2. `VerticalStackStrategy`: Top-to-bottom flow with column wrapping.\n  3. `GridPackStrategy`: Grid packing algorithm.\n  4. `RadialSpiralStrategy`: Expanding spiral search around target coordinates.\n  5. `PackingStrategy`: Shelf-packing layout algorithm.\n  6. `SmartStackStrategy`: Hybrid horizontal/vertical strategy fallback.\n  7. `OverlapAllowedStrategy`: Direct placement without collision offset.\n\n---\n\n## 3. Comparative Capabilities Matrix\n\n| Feature | Supported Module | Status / Detail |\n|---|:---:|---|\n| **Plain Text Copy / Paste** | `Draw._clipboard` | `copy()`, `read()` |\n| **Rich Text & HTML Copy / Paste** | `Draw._clipboard` | `copy_html()`, `read_html()` |\n| **Custom MIME Data Storage** | `Draw._clipboard` | `copy_data()`, `read_data()` |\n| **Clipboard Listener Signal** | `Draw._clipboard` | `on_change()` |\n| **Clipboard Wiping** | `Draw._clipboard` | `clear()` |\n| **Grid Table Math** | `Draw._layout` | `TableLayout`, `TableGeometry` |\n| **Flex Column Weights (`1fr`, `2fr`)** | `Draw._layout` | `GridLayout` |\n| **1D Stack Layouts** | `Draw._layout` | `ListLayout` (`vertical` / `horizontal`) |\n| **Layered Z-Index Stacks** | `Draw._layout` | `StackLayout` |\n| **Wrapping Flow Layouts** | `Draw._layout` | `FlowLayout` |\n| **Absolute Canvas Layouts** | `Draw._layout` | `CanvasLayout` |\n| **Cell Merging / Joining** | `Draw._layout` | `CombinedCellLayout` |\n| **Interactive Column Sorting** | `Draw._list` | `sort_list_data()` |\n| **Sub-String Search Engine** | `Draw._list` | `search_list_data()` |\n| **Predicate Row Filtering** | `Draw._list` | `filter_list_data()` |\n| **Staggered Entrance Animation** | `Draw._list` | `animate_in` (`fade`, `slide`, `scale`) |\n| **Collision Spec Parsing** | `Draw._overlap` | `parse_flow_spec()` |\n| **QuadTree Spatial Partitioning** | `Draw._overlap` | `QuadTree` ($O(N \\log N)$ indexing) |\n| **Rotated Bounding Box (OBB)** | `Draw._overlap` | `Rect.rotated_bounds()` |\n| **Flow Placement Strategies** | `Draw._overlap` | 7 placement strategy classes |\n\n---\n\n## 4. Usage Code Examples\n\n### 4.1 Clipboard HTML & Custom Data Example\n```python\nimport Draw\n\n# Copy HTML formatted text\nDraw.clipboard.copy_html(\"<h1>Draw UI Title</h1>\", text=\"Draw UI Title\")\nprint(Draw.clipboard.read_html())\n\n# Copy custom binary/JSON data payload\nDraw.clipboard.copy_data(\"application/json\", b'{\"key\": \"value\"}')\nprint(Draw.clipboard.read_data(\"application/json\"))\n\n# Register change listener\nDraw.clipboard.on_change(lambda: print(\"OS Clipboard updated!\"))\n```\n\n### 4.2 Layout Engine & Flex Weights Example\n```python\nimport Draw\n\n# Create Grid layout with fractional flex weights\ngrid = Draw.table(\n    ip=\"my_grid\",\n    dimension={\n        \"type\": \"grid\",\n        \"rows\": 2,\n        \"columns\": 3,\n        \"col_widths\": [\"1fr\", \"2fr\", 100],\n        \"width\": 800,\n        \"height\": 600\n    }\n)\n```\n\n### 4.3 List Interactive Search & Sorting Example\n```python\nfrom Draw._list import sort_list_data, search_list_data, filter_list_data\n\ndata = {\n    \"Product\": [\"Laptop\", \"Mouse\", \"Keyboard\", \"Monitor\"],\n    \"Price\": [1200, 25, 75, 300]\n}\n\n# 1. Sort by Price descending\nsorted_data = sort_list_data(data, \"Price\", \"desc\")\n\n# 2. Search for items containing \"key\"\nsearched_data = search_list_data(data, \"key\")\n\n# 3. Filter items with Price > 50\nfiltered_data = filter_list_data(data, lambda row: float(row[\"Price\"]) > 50)\n```\n\n---\n\n## 6. Unified Alignment Engine (`Draw._align`)\n\nTo solve historical alignment discrepancies across canvas shapes, text blocks, room scene anchors, and screen windows, a canonical alignment calculation engine was created in `Draw._align` ([_align.py](file:///d:/pg/draw2/Draw/_align.py)).\n\n### Key Advantages & Features:\n1. **High Precision (Subpixel Float Calculation)**: Replaces integer truncation with subpixel float math.\n2. **Unified Signature**: Accepts `align`, subject dimensions (`sw`, `sh`), container dimensions (`cw`, `ch`), optional padding (`pad`), optional origin offsets (`offset_x`, `offset_y`), and `window_tag`.\n3. **Automatic Underscore Normalization**: Accepts both `\"top_left\"` and `\"top-left\"`, converting spelling variations seamlessly.\n4. **Integrated IP Point Anchoring**: Automatically resolves `\"ip:target_ip\"` references via `Draw._bridge.resolve_point_ref()`.\n5. **Zero-Regression Standardization**: Called directly by `_shapes.py`, `_text.py`, `_room.py`, and `_window.py`.\n\n---\n\n## 7. Conclusion\n\n`Draw._clipboard`, `Draw._layout`, `Draw._list`, `Draw._overlap`, and `Draw._align` have been unified into a high-precision, professional desktop framework standard. All implementations pass 100% of test suites in `Draw/tests`.\n"
  },
