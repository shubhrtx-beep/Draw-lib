<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draw Framework — Master Documentation & API Reference</title>
  <meta name="description" content="Complete documentation, API references, architecture guides, and code examples for the Draw graphics and UI library.">

  <!-- Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Markdown Parser (Marked.js) & Syntax Highlighter (Prism.js) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-glsl.min.js"></script>

  <style>
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-display: 'Outfit', var(--font-sans);
      --font-mono: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      /* Dark Theme (Default) */
      --bg-body: #090b10;
      --bg-surface: #0f1219;
      --bg-surface-elevated: #161b26;
      --bg-sidebar: #0b0e14;
      --bg-search: #131722;
      --border-subtle: #1e2433;
      --border-strong: #2d374d;
      
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --brand-primary: #38bdf8;
      --brand-primary-glow: rgba(56, 189, 248, 0.25);
      --brand-accent: #818cf8;
      --brand-emerald: #34d399;
      
      --code-bg: #07090e;
      --code-inline-bg: #1a202c;
      --code-inline-text: #38bdf8;
      
      --sidebar-width: 320px;
      --toc-width: 250px;
      --header-height: 64px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --shadow-elevation: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    html.light {
      --bg-body: #f8fafc;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #f1f5f9;
      --bg-sidebar: #f8fafc;
      --bg-search: #e2e8f0;
      --border-subtle: #e2e8f0;
      --border-strong: #cbd5e1;
      
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-dim: #94a3b8;
      
      --brand-primary: #0284c7;
      --brand-primary-glow: rgba(2, 132, 199, 0.2);
      --brand-accent: #6366f1;
      --brand-emerald: #059669;
      
      --code-bg: #1e293b;
      --code-inline-bg: #e2e8f0;
      --code-inline-text: #0284c7;
      --shadow-elevation: 0 10px 30px -10px rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.65;
      font-size: 15px;
    }

    /* ── Header ────────────────────────────────────────── */
    header.site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      background: rgba(9, 11, 16, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
    }
    html.light header.site-header {
      background: rgba(248, 250, 252, 0.85);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
    }
    .logo-badge {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #0284c7, #6366f1, #ec4899);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 800;
      color: #fff;
      font-size: 20px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.35);
    }
    .brand-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-main);
    }
    .brand-version {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--brand-primary);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 20px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-search);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 7px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      min-width: 220px;
    }
    .search-btn:hover {
      border-color: var(--brand-primary);
      color: var(--text-main);
    }
    .search-kbd {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 11px;
      background: var(--bg-surface-elevated);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border-strong);
    }

    .about-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 7px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .about-btn:hover {
      border-color: var(--brand-primary);
      color: var(--brand-primary);
      background: rgba(56, 189, 248, 0.08);
    }

    .theme-toggle, .menu-toggle {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .theme-toggle:hover, .menu-toggle:hover {
      border-color: var(--brand-primary);
      color: var(--brand-primary);
    }
    .menu-toggle { display: none; }

    /* ── Layout Grid ───────────────────────────────────── */
    .app-container {
      display: flex;
      margin-top: var(--header-height);
      min-height: calc(100vh - var(--header-height));
    }

    /* ── Sidebar Navigation ────────────────────────────── */
    aside.sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      height: calc(100vh - var(--header-height));
      position: sticky;
      top: var(--header-height);
      overflow-y: auto;
      padding: 20px 14px 40px;
      scrollbar-width: thin;
    }

    .nav-category {
      margin-bottom: 24px;
    }
    .nav-cat-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-dim);
      padding: 0 10px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      transition: all 0.15s ease;
      cursor: pointer;
      margin-bottom: 2px;
    }
    .nav-item:hover {
      background: var(--bg-surface-elevated);
      color: var(--text-main);
      transform: translateX(2px);
    }
    .nav-item.active {
      background: rgba(56, 189, 248, 0.12);
      color: var(--brand-primary);
      font-weight: 600;
      border-left: 3px solid var(--brand-primary);
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
    }
    .nav-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      background: var(--bg-surface-elevated);
      color: var(--text-dim);
      border: 1px solid var(--border-subtle);
    }
    .nav-item.active .nav-badge {
      background: var(--brand-primary);
      color: #000;
      border-color: transparent;
    }

    /* ── Main Content Area ─────────────────────────────── */
    main.content-area {
      flex: 1;
      max-width: 960px;
      padding: 40px 48px 80px;
      min-width: 0;
    }

    .reading-progress-bar {
      position: fixed;
      top: var(--header-height);
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--brand-primary), var(--brand-accent));
      width: 0%;
      z-index: 99;
      transition: width 0.1s ease;
    }

    .doc-breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      color: var(--text-dim);
      margin-bottom: 16px;
      font-weight: 500;
    }
    .doc-breadcrumb span.sep { opacity: 0.5; }
    .doc-breadcrumb span.current { color: var(--brand-primary); }

    /* ── Markdown Content Styling ──────────────────────── */
    .markdown-body {
      color: var(--text-main);
    }
    .markdown-body h1 {
      font-family: var(--font-display);
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.8px;
      margin-bottom: 16px;
      color: var(--text-main);
      line-height: 1.25;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .markdown-body h2 {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.4px;
      margin-top: 36px;
      margin-bottom: 16px;
      color: var(--text-main);
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .markdown-body h3 {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 600;
      margin-top: 24px;
      margin-bottom: 12px;
      color: var(--text-main);
    }
    .markdown-body p {
      margin-bottom: 16px;
      color: var(--text-muted);
    }
    .markdown-body strong { color: var(--text-main); }
    .markdown-body ul, .markdown-body ol {
      margin-bottom: 16px;
      padding-left: 24px;
      color: var(--text-muted);
    }
    .markdown-body li { margin-bottom: 6px; }

    .markdown-body hr {
      border: none;
      height: 1px;
      background: var(--border-subtle);
      margin: 32px 0;
    }

    /* Tables */
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-size: 13.5px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .markdown-body th {
      background: var(--bg-surface-elevated);
      color: var(--text-main);
      font-weight: 600;
      text-align: left;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-strong);
    }
    .markdown-body td {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-muted);
    }
    .markdown-body tr:last-child td { border-bottom: none; }
    .markdown-body tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    /* Code Blocks */
    .markdown-body pre {
      position: relative;
      background: var(--code-bg) !important;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      margin: 20px 0;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 13.5px;
      line-height: 1.6;
    }
    .markdown-body code:not(pre code) {
      font-family: var(--font-mono);
      font-size: 12.5px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--code-inline-bg);
      color: var(--code-inline-text);
      border: 1px solid var(--border-subtle);
    }
    .copy-code-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-strong);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-family: var(--font-sans);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      opacity: 0;
    }
    .markdown-body pre:hover .copy-code-btn { opacity: 1; }
    .copy-code-btn:hover {
      background: var(--brand-primary);
      color: #000;
      border-color: var(--brand-primary);
    }

    /* Blockquotes / Alerts */
    .markdown-body blockquote {
      border-left: 4px solid var(--brand-primary);
      background: rgba(56, 189, 248, 0.06);
      padding: 14px 20px;
      margin: 20px 0;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      color: var(--text-main);
    }

    /* ── Table of Contents (Right Column) ──────────────── */
    aside.toc-sidebar {
      width: var(--toc-width);
      flex-shrink: 0;
      padding: 40px 16px 40px 24px;
      position: sticky;
      top: var(--header-height);
      height: calc(100vh - var(--header-height));
      overflow-y: auto;
      font-size: 13px;
    }
    .toc-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-dim);
      margin-bottom: 14px;
    }
    .toc-link {
      display: block;
      color: var(--text-muted);
      text-decoration: none;
      padding: 4px 0;
      line-height: 1.4;
      transition: color 0.15s;
    }
    .toc-link:hover, .toc-link.active {
      color: var(--brand-primary);
    }
    .toc-link.depth-3 { padding-left: 12px; font-size: 12px; }

    /* ── Search Modal ──────────────────────────────────── */
    .search-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 100px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .search-modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .search-modal {
      width: 100%;
      max-width: 640px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-elevation);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: 75vh;
    }
    .search-input-box {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-subtle);
      gap: 12px;
    }
    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 16px;
      color: var(--text-main);
      font-family: var(--font-sans);
    }
    .search-results {
      overflow-y: auto;
      padding: 12px;
      max-height: 480px;
    }
    .search-result-item {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      cursor: pointer;
      margin-bottom: 4px;
      transition: background 0.15s;
    }
    .search-result-item:hover, .search-result-item.selected {
      background: var(--bg-surface-elevated);
    }
    .search-res-title {
      font-weight: 600;
      color: var(--brand-primary);
      font-size: 14px;
      margin-bottom: 4px;
    }
    .search-res-snippet {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.4;
    }
    .search-res-snippet mark {
      background: rgba(56, 189, 248, 0.3);
      color: #fff;
      padding: 1px 3px;
      border-radius: 2px;
    }

    /* ── Pagination Footer ─────────────────────────────── */
    .doc-pagination {
      display: flex;
      justify-content: space-between;
      margin-top: 60px;
      padding-top: 24px;
      border-top: 1px solid var(--border-subtle);
      gap: 16px;
    }
    .page-card {
      flex: 1;
      padding: 16px 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
    }
    .page-card:hover {
      border-color: var(--brand-primary);
      transform: translateY(-2px);
    }
    .page-card.next { text-align: right; }
    .page-card-sub {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    .page-card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    /* Responsive */
    @media (max-width: 1100px) {
      aside.toc-sidebar { display: none; }
      main.content-area { padding: 30px 24px 60px; }
    }
    @media (max-width: 768px) {
      .menu-toggle { display: flex; }
      aside.sidebar {
        position: fixed;
        left: -320px;
        top: var(--header-height);
        bottom: 0;
        z-index: 90;
        transition: left 0.25s ease;
        background: var(--bg-surface);
      }
      aside.sidebar.open { left: 0; }
      .search-btn span.search-text { display: none; }
      .search-btn { min-width: auto; }
      .about-btn span { display: none; }
      .about-btn { padding: 7px 10px; }
    }
  </style>
</head>
<body>

  <!-- Reading Progress Bar -->
  <div class="reading-progress-bar" id="progressBar"></div>

  <!-- Header -->
  <header class="site-header">
    <div class="brand-group" onclick="selectDoc('public-api')">
      <div class="logo-badge">D</div>
      <div>
        <div class="brand-title">Draw Framework</div>
      </div>
      <div class="brand-version">v0.1.0</div>
    </div>

    <div class="header-actions">
      <button class="about-btn" onclick="selectDoc('about-me')" title="About the Creator">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>About Me</span>
      </button>

      <button class="search-btn" onclick="openSearch()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span class="search-text">Search documentation...</span>
        <span class="search-kbd">Ctrl K</span>
      </button>

      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>

      <button class="menu-toggle" onclick="toggleSidebar()" title="Toggle Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </header>

  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <!-- Injected via JavaScript -->
    </aside>

    <!-- Main Documentation Content -->
    <main class="content-area" id="mainContent">
      <div class="doc-breadcrumb" id="breadcrumb"></div>
      <div class="markdown-body" id="docViewer"></div>

      <!-- Next / Previous Page Navigation -->
      <div class="doc-pagination" id="pagination"></div>
    </main>

    <!-- Table of Contents -->
    <aside class="toc-sidebar">
      <div class="toc-title">On this page</div>
      <nav id="tocContainer"></nav>
    </aside>
  </div>

  <!-- Search Modal -->
  <div class="search-modal-backdrop" id="searchBackdrop" onclick="closeSearch(event)">
    <div class="search-modal" onclick="event.stopPropagation()">

    "desc": "Story, motivation, and design philosophy behind Draw by its 16-year-old creator.",
    "content": "# About Me & The Creator of Draw\n\n> **\"I love cool animations, graphics, and cool UI designs — and I wanted to see if we could make UI design truly easy, declarative, and fun like CSS.\"**\n\n---\n\n## \ud83d\udc4b Who I Am\n\nHi! I am a **16-year-old boy** with a passion for programming, computer graphics, animations, and user interface design.\n\nI like **cool animation graphics and cool UI design very much**. Watching smooth visual motions, glowing vector shapes, kinetic physics, and responsive layouts come to life on a screen is something I find genuinely exciting and inspiring.\n\n---\n\n## \ud83c\udfaf Why I Created Draw\n\nTraditional desktop GUI programming (like raw Qt, PySide, or Tkinter) often requires writing dozens or hundreds of lines of complex object-oriented boilerplate code just to draw shapes, handle layout boxes, or create interactive visual elements.\n\nI created **Draw** because **I wanted to try to make UI design easy**.\n\nMy goals were simple:\n* **Easy UI Creation**: Make building clean, modern desktop graphics and interfaces effortless and straightforward.\n* **Accessible to Everyone**: Enable anyone to create visual windows, widgets, and dynamic charts with minimal lines of code.\n* **Built-in Visual Polish**: Provide built-in support for procedural animations, physics joints, glowing shaders, custom vector curves, and charts without needing deep low-level rendering code.\n\n---\n\n## \ud83c\udfa8 Inspired by CSS\n\nWhen designing the architecture and API for Draw, **I tried to make it feel like CSS**.\n\nIn web development, CSS makes styling and layout natural and declarative. I wanted to bring that same declarative simplicity to Python:\n\n* **Declarative Dictionaries**: You define shapes, typography, and windows using clean, intuitive property keys (like `vertices`, `size`, `color`, `border_radius`, `rotation`, `align`).\n* **Familiar Styling Properties**: Support for percentage sizes (`\"50%\"`), border radius, padding, alignment tokens, and color formats.\n* **Direct Animation & Styling**: Add motion, easing, glows, and responsive anchors directly in property dictionaries without managing manual paint loops.\n\n### Declarative Code Example\n\n```python\nimport Draw\n\n# Clean, simple window initialization\nDraw.window(tag=\"main\", width=800, height=600, background_color=\"#090b10\")\n\n# CSS-inspired declarative shape & motion\nDraw.shape(\n    display=\"main\",\n    shape=[{\n        \"ip\": \"hero_card\",\n        \"vertices\": 4,\n        \"size\": [300, 180],\n        \"align\": \"center\",\n        \"color\": \"#161b26\",\n        \"border_color\": \"#38bdf8\",\n        \"border_width\": 2,\n        \"border_radius\": 16,\n        \"glow\": True,\n        \"glow_color\": \"#38bdf8\",\n        \"glow_blur\": 20,\n        \"rotation\": \"time * 15\"\n    }]\n)\n\nDraw.window.run(\"main\")\n```\n\n---\n\n## \ud83e\udd16 An AI-Generated Library\n\nThis project is an **AI-generated library**.\n\nAs a 16-year-old creator with ideas for how modern UI and graphics should look and feel, I conceived the concepts, declarative CSS-like syntax, and feature architecture, and used **artificial intelligence** to generate, implement, and refine the codebase and modules.\n\nUsing AI allowed me to turn these creative ideas into a comprehensive, multi-module 2D graphics and layout library.\n\n---\n\n## \u2728 Core Principles\n\n| Principle | Philosophy |\n| :--- | :--- |\n| **Make UI Design Easy** | Eliminate steep boilerplate so anyone can turn ideas into functional visual apps. |\n| **Cool Aesthetics** | Modern visual features like glows, splines, dynamic charts, and smooth animations built-in. |\n| **CSS Simplicity** | Declarative property dictionaries that feel natural, familiar, and intuitive. |\n"
  },

    "content": "PUBLIC API REFERENCE & COMPLETE MODULE INDEX \u2014 DRAW FRAMEWORK\n==============================================================\n\nThis document lists the public APIs, entry points, and documentation index for the entire `Draw` graphics and UI library.\n\nDOCUMENTATION SITEMAP & MODULE DIRECTORY (full_documentation/)\n-------------------------------------------------------------\n1.  SHAPE_MODULE_DOCUMENTATION.md          - Draw.shape / Draw.shapes (_shapes.py)\n2.  TEXT_MODULE_DOCUMENTATION.md           - Draw.text / Draw.lineedit / Draw.textedit (_text.py)\n3.  COLOUR_MODULE_DOCUMENTATION.md         - Draw.color / Draw.colour / tokens (_colour.py)\n4.  MOTION_MODULE_DOCUMENTATION.md         - Draw.motion / custom / timeline (_motion.py)\n5.  WINDOW_MODULE_DOCUMENTATION.md         - Draw.window / display lifecycle (_window.py)\n6.  CONNECTORS_MODULE_DOCUMENTATION.md     - Draw.connectors / joint physics (_connectors.py)\n7.  SENSES_MODULE_DOCUMENTATION.md         - Draw.senses / gesture triggers (_senses_redesign.py)\n8.  ROOM_MODULE_DOCUMENTATION.md           - Draw.room / relative layout (_room.py, _room_size.py)\n9.  GRAPH_MODULE_DOCUMENTATION.md          - Draw.graph / chart analytics (_graph.py)\n10. POINT_MODULE_DOCUMENTATION.md          - Draw.point / Catmull-Rom vector paths (_point.py)\n11. LIVE_MODULE_DOCUMENTATION.md           - Draw.live / reactive state bindings (_live.py)\n12. CHECKPOINT_MODULE_DOCUMENTATION.md     - Draw.checkpoint / scene state manager (_checkpoint.py)\n13. SCREEN_MODULE_DOCUMENTATION.md         - Draw.screen / live pixel buffer viewports (_screen.py)\n14. SCROLLER_MODULE_DOCUMENTATION.md       - Draw.scroller / smooth scrolling physics (_scroller.py)\n15. TURTLE_MODULE_DOCUMENTATION.md         - Draw.turtle / Draw.pen bridge (_turtle.py)\n16. SUPER_ENGINE_DOCUMENTATION.md          - Draw.super / Draw.super_mode OpenGL (_super.py)\n17. DEBUG_MODULE_DOCUMENTATION.md          - Draw.debug / watchdog & profiler (debug.py)\n18. OPTIMIZE_MODULE_DOCUMENTATION.md       - Draw.optimize / performance tuner (_optimize.py)\n19. TOOLS_LOADER_PANEL_DOCUMENTATION.md    - Draw.tools, Draw.loader, Draw.panel (_tools.py, _loader.py, _panel.py)\n20. CALCULATOR_TREE_DIALOG_GRID_DOCUMENTATION.md - Draw.calculator, Draw.filetree, Draw.filedialog, Draw.grid (_calculator.py, _file_tree.py, _filedialog.py, _widget.py)\n21. FOUR_MODULES_DOCUMENTATION.md          - Draw.clipboard, Draw.table (layout), Draw._list, Draw._overlap, Draw.calc (_clipboard.py, _layout.py, _list.py, _overlap.py, _align.py)\n22. UTILITY_MODULES_DOCUMENTATION.md       - Draw._app, Draw._batch_ops, Draw._bridge, Draw.widget/box (_native.py), Draw.after/every (_schedule.py), Draw.simulate (_simulate.py), Draw._validation.py\n\n================================================================================\nCORE PUBLIC API SIGNATURES\n================================================================================\n\n1. SHAPES SYSTEM: `Draw.shape` / `Draw.shapes`\n-----------------------------------------------\n    Draw.shape(\n        display      = \"main\",       # Target window / panel tag\n        sub_edit     = None,         # Update existing shapes in-place matching IP\n        get_ip       = None,         # Bind shape to layout cell IP\n        shape        = [\n            {\n                \"vertices\"     : 4,            # >= 3 (1=point, 2=line, 4=rect)\n                \"size\"         : [200, 150],   # [width, height] in px or \"%\"\n                \"x\"            : None,         # Absolute canvas pixel x\n                \"y\"            : None,         # Absolute canvas pixel y\n                \"align\"        : \"center\",     # Alignment or \"ip:target_ip\"\n                \"border_radius\": 10,           # Corner radius in px, or \"50%\"\n                \"rotation\"     : 0,            # Degrees clockwise\n                \"color\"        : \"cyan\",       # Color name, hex, RGB, or color IP\n                \"border_color\" : \"white\",      # Outline color\n                \"border_width\" : 2,            # Outline width in px\n                \"border_style\" : \"solid\",      # \"solid\" | \"dashed\" | \"dotted\" | \"none\"\n                \"opacity\"      : 100,          # 0 to 100\n                \"z\"            : 0,            # Layer Z-order (higher = further back)\n                \"inside\"       : \"panel_ip\",   # Restrict dragging inside boundary\n                \"move_path\"    : \"horizontal\", # \"horizontal\" | \"vertical\" | \"x\" | \"y\"\n                \"type\"         : \"vector\",     # \"vector\" | \"image\" | \"video\"\n                \"src\"          : \"file.png\",   # Media file path\n                \"curve_mode\"   : \"line\",       # \"line\" | \"smooth\" | \"slope\" | \"wave\" | \"arc\" | \"bend_all\"\n                \"bend_amount\"  : 40.0,         # Curvature amount\n                \"custom\"       : { \"bend\": [], \"exclude\": [], \"symmetry\": None },\n                \"ip\"           : \"my_shape\",   # Unique identifier\n            }\n        ]\n    )\n\n2. TEXTS & INPUTS SYSTEM: `Draw.text`\n--------------------------------------\n    Draw.text(\n        display   = \"main\",\n        text      = [\n            {\n                \"text\"         : \"My Label\",   # Text string or LiveTextBinding\n                \"ip\"           : \"label_ip\",   # Unique identifier\n                \"x\"            : None,         # Pixel X\n                \"y\"            : None,         # Pixel Y\n                \"align\"        : \"center\",     # Alignment or \"ip:target_ip\"\n                \"z\"            : 0,            # Layer Z-order\n                \"font_family\"  : \"Arial\",      # Font family\n                \"font_size\"    : 24,           # Font size in px\n                \"bold\"         : False,        # Bold\n                \"color\"        : \"white\",      # Text color\n                \"max_width\"    : None,         # Wrap width in px\n                \"text_gradient\": None,         # Gradient dictionary\n                \"glow\"         : False,        # Glow shader\n                \"glow_color\"   : \"cyan\",       # Glow color\n                \"arc_radius\"   : None,         # Wrap text along circular arc\n                \"animation\"    : None,         # 14 animations: pulse, rainbow, wave, etc.\n                \"input_enabled\": False,        # Convert into editable text field\n                \"input_type\"   : \"all\",        # \"all\" | \"digits\" | \"letters\" | \"email\" | \"password\"\n            }\n        ]\n    )\n\n3. SCENE STATE MANAGEMENT: `Draw.checkpoint`\n--------------------------------------------\n    Draw.checkpoint(\n        ip         = \"scene_1\",    # Checkpoint slot identifier\n        display    = \"main\",       # Window tag\n        save       = True,         # Capture snapshot of canvas\n        reload     = False,        # Restore snapshot onto canvas\n        offload    = False,        # Clear canvas to free memory\n        new        = None,         # Offload + call new() builder\n        load       = None,         # Load a different checkpoint slot\n        path       = \"save.pkl\",   # Disk persistence file\n        rest_ip    = False,        # Sever stale IP connections\n    )\n\n4. LIVE DISPLAY SURFACE: `Draw.screen`\n--------------------------------------\n    screen = Draw.screen(\n        ip               = \"camera_feed\",\n        display          = \"main\",\n        size             = [640, 480],\n        scaling          = \"fit\",        # \"fit\" | \"stretch\" | \"center\" | \"none\"\n        drawing_mode     = False,        # Stream continuous mouse_down/move/up\n        on_mouse_move    = None,         # fn(x, y, event)\n        on_mouse_down    = None,         # fn(x, y, button, event)\n        on_touch         = None,         # fn(touch_points, event)\n        on_stylus        = None,         # fn(pressure, x, y, tilt_x, tilt_y, event)\n    )\n    screen.update(frame)                 # Ingests NumPy, OpenCV, PIL, raw bytes\n\n5. SCROLLER ENGINE: `Draw.scroller`\n------------------------------------\n    Draw.scroller(\n        ip          = \"main_scroll\",\n        display     = \"main\",\n        room        = \"page\",\n        scroll      = \"vertical\",        # \"vertical\" | \"horizontal\" | \"both\"\n        max_y       = 2500,\n        speed       = 1.0,\n        show_thumb  = True,\n        thumb_color = \"#38bdf8\",\n        track_color = \"#0f172a\",\n        inertia     = True,\n        keyboard    = True,\n    )\n    Draw.scroller.scroll_to_ip(\"card_5\", animate=True)\n    Draw.scroller.center_ip(\"card_5\", animate=True)\n\n6. HARDWARE-ACCELERATED OPENGL: `Draw.super`\n---------------------------------------------\n    Draw.super(display=\"main\", batch_capacity=65536, vsync=False)\n    Draw.super_mode(\"max\")\n\n7. RUNTIME WATCHDOG & PROFILER: `Draw.debug`\n--------------------------------------------\n    Draw.debug.safeplay()                # Enable safe mode with watchdog daemon\n    Draw.debug.settings().fps_limit = 60\n    print(Draw.debug.process_monitor())  # Complete ASCII telemetry dashboard\n"

  "evaluation": {

    "desc": "Full architectural evaluation, memory benchmarks, and design comparison.",
    "content": "# Draw-lib vs PySide6: Independent Full Evaluation & Benchmark Report\n\n**Evaluation Date**: August 2026  \n**Evaluator**: Independent Software Evaluation & Benchmarking Agent  \n**Target Subject**: `Draw-lib` (v0.1.0) vs `PySide6` (Qt 6.11.0 / Python 3.13.12)  \n**Hardware & Runtime Environment**:\n*   **Operating System**: Windows 11 (win32, x86_64)\n*   **CPU**: 8 Logical Cores (Intel/AMD x86_64)\n*   **Python Engine**: Python 3.13.12 (tags/v3.13.12:1cbe481, MSC v.1944 64-bit)\n*   **PySide6 Release**: 6.11.0 (Qt 6.11.0 C++ runtime)\n*   **Target Viewport**: 1920 \u00d7 1080 Full HD\n\n---\n\n## Table of Contents\n\n1. [Project Overview & Architectural Understanding](#1-project-overview--architectural-understanding)\n2. [Empirical Benchmark Evidence & Methodology](#2-empirical-benchmark-evidence--methodology)\n3. [Rendering Capabilities & Graphics Pipeline](#3-rendering-capabilities--graphics-pipeline)\n4. [API & Developer Experience (DX)](#4-api--developer-experience-dx)\n5. [Architecture & System Design](#5-architecture--system-design)\n6. [Reliability, Stability & Error Handling](#6-reliability-stability--error-handling)\n7. [Security, Input Validation & Robustness](#7-security-input-validation--robustness)\n8. [Resource Efficiency & Memory Footprint](#8-resource-efficiency--memory-footprint)\n9. [Scalability & Complexity Curves](#9-scalability--complexity-curves)\n10. [Comprehensive Feature Matrix](#10-comprehensive-feature-matrix)\n11. [Code Quality & Technical Debt](#11-code-quality--technical-debt)\n12. [Testing Quality & Coverage](#12-testing-quality--coverage)\n13. [Comparison Fairness & Reproducibility](#13-comparison-fairness--reproducibility)\n14. [Category-by-Category Scoring (0\u201310)](#14-category-by-category-scoring-010)\n15. [Weighted Overall Score](#15-weighted-overall-score)\n16. [Dual Operational Ratings (General vs Graphics)](#16-dual-operational-ratings-general-vs-graphics)\n17. [Draw-lib: Deep Weakness Analysis](#17-draw-lib-deep-weakness-analysis)\n18. [Draw-lib: Deep Strength Analysis](#18-draw-lib-deep-strength-analysis)\n19. [PySide6: Deep Weakness Analysis](#19-pyside6-deep-weakness-analysis)\n20. [PySide6: Deep Strength Analysis](#20-pyside6-deep-strength-analysis)\n21. [Final Executive Summary](#21-final-executive-summary)\n22. [Final Verdict & Strategic Recommendations](#22-final-verdict--strategic-recommendations)\n23. [Confidence Levels & Evidentiary Support](#23-confidence-levels--evidentiary-support)\n\n---\n\n## 1. Project Overview & Architectural Understanding\n\n### PySide6 (Qt 6 for Python)\nPySide6 is the official Python binding for the Qt 6 enterprise C++ framework developed by The Qt Company. It exposes massive C++ subsystems via Shiboken6 bindings:\n*   `QtWidgets`: Traditional desktop widgets (`QMainWindow`, `QDialog`, `QPushButton`, `QTreeView`).\n*   `QGraphicsScene` / `QGraphicsView`: 2D retained-mode scene graph supporting affine transforms, BSP tree spatial indexing, caching, and collision detection.\n*   `QtGui`: 2D vector drawing engine (`QPainter`, `QPainterPath`, `QBrush`, `QPen`, `QFont`, `QImage`).\n*   `QtOpenGL` / `QtOpenGLWidgets`: Direct hardware-accelerated OpenGL contexts, shaders, and FBOs.\n*   `QtQuick` / `QML`: Declarative scene graph hardware-accelerated UI.\n*   `QtCore`: Meta-Object System (MOC), Signals & Slots, Threading, Event Loop, Timers.\n\n### Draw-lib\nDraw-lib is a high-level, declarative, data-driven 2D canvas, relative layout, physics, and graphing framework built **on top of** PySide6. It abstracts the verbose, imperative C++ object hierarchy into high-level declarative dictionaries, procedural motion primitives, mathematical expression bindings, and topological relative positioning.\n\n### Feature Implementation Status Classification\n\n| Feature Subsystem | Status in Draw-lib | Implementation Details |\n| :--- | :--- | :--- |\n| **Declarative Shape System** | **Implemented** | `Draw.shape()` in `_shapes.py` supporting vertices, curvature, waves, slopes, arcs, mesh warp, radial/mirror symmetry, boolean exclusions. |\n| **Safe AST Expression Evaluator** | **Implemented** | `Draw.calculator` in `_calculator.py` parsing mathematical formulas for dynamic colors and coordinates. |\n| **Physics Joints & Links** | **Implemented** | `Draw.connectors` in `_connectors.py` (pins, pendulums, springs, ropes, orbits, magnets, distance locks) via daemon background thread. |\n| **Procedural 2D Motion Engine** | **Implemented** | `Draw._motion` supporting 38 motion types (springs, wiggles, waves, lissajous, benzene, inertia). |\n| **Declarative Graphing Engine** | **Implemented** | `Draw.graph` in `_graph.py` supporting 11 presentation chart types (bar, stacked bar, line, area, dot, pie, donut, radar, spider). |\n| **Relative Layout Solver** | **Implemented** | `Draw.room` in `_room.py` using a topological DAG dependency graph. |\n| **State Snapshot & Deserialization** | **Implemented** | `Draw.checkpoint` in `_checkpoint.py` with restricted safe unpickler. |\n| **Stdlib Turtle Canvas Bridge** | **Implemented** | `Draw.turtle` in `_turtle.py` bridging standard library Tk turtle into Qt QPainter overlay. |\n| **Hardware OpenGL Batching** | **Implemented** | `Draw.super` in `_super.py` featuring `GPUGeometryBatcher` (VBO/VAO dynamic sub-buffer upload + GLSL shaders). |\n| **Spatial Indexing Hash Grid** | **Implemented** | `SpatialGridIndex` in `_optimize.py` and `_batch_ops.py`. |\n| **Video Frame Sink** | **Experimental** | `_shapes.py` video shape wrapper over `QMediaPlayer` / `QVideoSink`. |\n| **Native Controls Wrapper** | **Partial** | `Draw.widget` / `Draw.box` in `_native.py` reparenting native `QWidget` controls. |\n| **Native 3D Scene Graph** | **Non-Existent** | Out of scope. |\n| **Accessibility Tree (ARIA/ATK)** | **Non-Existent** | Pure paint canvas does not generate native OS accessibility trees. |\n\n---\n\n## 2. Empirical Benchmark Evidence & Methodology\n\n### Benchmark Methodology\nAll benchmarks were executed on the same machine under identical power and temperature conditions using Python 3.13.12 (AMD64) and PySide6 6.11.0.\n*   **Startup & Import**: 5 independent cold subprocess executions.\n*   **Object Creation**: 10,000 items instantiated across 5 iterations with garbage collection between runs.\n*   **Rendering Latency**: Offscreen `1920x1080` ARGB32 premultiplied surface; 2 warm-up passes, 5 timed iterations.\n*   **Dynamic Updates**: 1,000 objects translated every frame for 50 continuous frames.\n*   **Spatial Hit-Testing**: 10,000 point queries against 10,000 indexed rectangles.\n*   **Memory Growth**: 500 frames of 500 moving shapes tracking process RSS memory before and after.\n\n### Master Benchmark Results Table\n\n| Benchmark Test | PySide6 | Draw-lib | Delta / Ratio | Winner |\n| :--- | :---: | :---: | :---: | :---: |\n| **Cold Import Time (median)** | **565.63 ms** (\u00b147.93 ms) | 1726.21 ms (\u00b1359.18 ms) | PySide6 is **3.05x faster** | **PySide6** |\n| **Cold Window Startup (median)** | **724.51 ms** (\u00b166.55 ms) | 1929.03 ms (\u00b1198.50 ms) | PySide6 is **2.66x faster** | **PySide6** |\n| **Object Creation (10k items)** | **39.38 ms** | 878.09 ms | PySide6 is **22.30x faster** | **PySide6** |\n| **Hit-Testing (10k queries / 10k items)** | 5310.54 ms | **248.23 ms** | Draw-lib is **21.39x faster** | **Draw-lib** |\n| **Dynamic Animation (1k items @ 50f)** | **41.2 FPS** (24.29 ms/frame) | 10.3 FPS (96.91 ms/frame) | PySide6 is **4.00x faster** | **PySide6** |\n| **Memory Growth (500 animation cycles)** | \u2014 | **+3.23 MB** (83.81 \u2192 87.04 MB) | Minimal memory creep | **Draw-lib** |\n\n### Rendering Latency vs Scene Complexity (1920x1080 Target)\n\n| Object Count | PySide6 QGraphicsScene | Draw-lib QPainter Software | Draw-lib OpenGL GPU Batcher | Performance Ratio (Draw Software / PySide6) |\n| :---: | :---: | :---: | :---: | :---: |\n| **10 objects** | **0.11 ms** | 0.40 ms | 0.22 ms | 3.63x |\n| **100 objects** | **2.11 ms** | 14.53 ms | 5.59 ms | 6.88x |\n| **1,000 objects** | **35.01 ms** | 164.46 ms | 56.96 ms | 4.70x |\n| **5,000 objects** | **112.36 ms** | 284.77 ms | 119.52 ms | 2.53x |\n| **10,000 objects** | **175.79 ms** | 575.29 ms | 262.84 ms | 3.27x |\n| **20,000 objects** | **340.22 ms** | 1713.45 ms | 540.36 ms | 5.03x |\n\n---\n\n## 3. Rendering Capabilities & Graphics Pipeline\n\n```\nDraw-lib Dual-Pipeline Rendering Architecture:\n\n[ Declarative User Dict ] \n          \u2502\n          \u25bc\n   [ _parse_shape ] \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25ba [ ShapeDef Dataclass ]\n          \u2502                                  \u2502\n          \u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n          \u25bc                                  \u25bc                        \u25bc\n[ Software Canvas Pass ]          [ AST Formula Bridge ]    [ Draw.super OpenGL Engine ]\n   \u2022 Overlap / Room solver           \u2022 Time / Variable evals   \u2022 GPUGeometryBatcher (NumPy)\n   \u2022 QPainterPath generation         \u2022 Dynamic HSV / RGBA      \u2022 Dynamic VBO / VAO Sub-buffer\n   \u2022 Catmull-Rom / Splines                                     \u2022 GLSL Core 3.3 Shader\n   \u2022 Drop shadows & Glow Pixmaps                               \u2022 glDrawArrays (1 Draw Call)\n          \u2502                                                           \u2502\n          \u25bc                                                           \u25bc\n[ QPainter Raster Surface ]                                   [ QOpenGLWidget Framebuffer ]\n```\n\n### 1. Vector Geometry & Procedural Deformations\n*   **Draw-lib**: Implements high-level procedural geometric modifiers directly into shape paths:\n    *   Per-side curvature (`bend`), sinusoidal wave borders (`wave`), quadratic slope bulges (`slope`), circular arcs (`arc`).\n    *   Mesh warping (`warp`) through 2D displacement grids.\n    *   Radial, grid, and mirror symmetry generation.\n    *   Boolean polygon cutouts and exclusions (`exclude`).\n*   **PySide6**: Provides raw `QPainterPath` primitives (`cubicTo`, `quadTo`, `arcTo`, `addPolygon`). Implementing wave borders, mesh warping, or symmetry requires the developer to manually calculate trigonometry and Bezier control points in user code.\n\n### 2. Text Layout & Visual Styling\n*   **Draw-lib**: Text-on-arc curving, typewriter text animations, letter spacing adjustments, outer neon glows, soft drop shadows, and automatic background padding calculation.\n*   **PySide6**: Sub-pixel font rendering, HarfBuzz text shaping, `QTextDocument` HTML/CSS rich text layout, bidirectional text (RTL/LTR), multi-column text formatting.\n\n### 3. GPU Acceleration & Future Backend Suitability\n*   **Draw-lib**: `Draw.super` implements a dynamic 2D vertex batcher in NumPy (`GPUGeometryBatcher`) that packs interleaved `[x, y, r, g, b, a]` vertex buffers and uploads them to a Core Profile 3.3 GLSL shader program in a single `glDrawArrays` call.\n*   **PySide6**: Full hardware abstraction through Qt Rendering Hardware Interface (QRhi), allowing Qt Quick and native viewports to target OpenGL 3.3/ES, Vulkan 1.3, Apple Metal, and Microsoft Direct3D 11/12 natively.\n\n---\n\n## 4. API & Developer Experience (DX)\n\n### Syntactic Boilerplate & Readability\n\n#### Example 1: Creating an Animated, Glowing Hexagon Window\n\n##### Draw-lib (Declarative, 4 Lines)\n```python\nimport Draw\n\nDraw.window(tag=\"main\", width=800, height=600, background_color=\"#0d1117\")\nDraw.shape(\n    display=\"main\",\n    shape=[{\n        \"ip\": \"gem\", \"vertices\": 6, \"size\": [160, 160], \"align\": \"center\",\n        \"color\": \"cyan\", \"glow_color\": \"cyan\", \"glow_blur\": 15,\n        \"rotation\": \"time * 45\"\n    }]\n)\nDraw.window.run(\"main\")\n```\n\n##### PySide6 (Imperative Object-Oriented, 30+ Lines)\n```python\nimport sys, math\nfrom PySide6.QtWidgets import QApplication, QMainWindow, QGraphicsView, QGraphicsScene, QGraphicsPolygonItem, QGraphicsDropShadowEffect\nfrom PySide6.QtGui import QPolygonF, QColor, QBrush, QPen\nfrom PySide6.QtCore import QPointF, QTimer\n\nclass RotatingHexWindow(QMainWindow):\n    def __init__(self):\n        super().__init__()\n        self.resize(800, 600)\n        self.scene = QGraphicsScene(0, 0, 800, 600)\n        self.view = QGraphicsView(self.scene, self)\n        self.setCentralWidget(self.view)\n        self.view.setStyleSheet(\"background: #0d1117;\")\n        \n        pts = [QPointF(80 * math.cos(math.radians(i * 60)), 80 * math.sin(math.radians(i * 60))) for i in range(6)]\n        self.item = QGraphicsPolygonItem(QPolygonF(pts))\n        self.item.setBrush(QBrush(QColor(\"cyan\")))\n        self.item.setPen(QPen(QColor(\"cyan\")))\n        self.item.setPos(400, 300)\n        \n        glow = QGraphicsDropShadowEffect()\n        glow.setColor(QColor(\"cyan\"))\n        glow.setBlurRadius(25)\n        glow.setOffset(0, 0)\n        self.item.setGraphicsEffect(glow)\n        self.scene.addItem(self.item)\n        \n        self.timer = QTimer(self)\n        self.timer.timeout.connect(lambda: self.item.setRotation(self.item.rotation() + 1.5))\n        self.timer.start(16)\n\napp = QApplication(sys.argv)\nwin = RotatingHexWindow()\nwin.show()\nsys.exit(app.exec())\n```\n\n### Discoverability & Learning Curve\n*   **Draw-lib**: Very shallow learning curve. Dictionary schemas use intuitive names (`color`, `border_width`, `align`, `bend`, `rotation`, `glow_color`). `_validation.py` employs `difflib.get_close_matches` to suggest corrections if a keyword is misspelled (e.g., suggesting `color` if the user types `colour`) 0\u2518\n```\n\n### Module Organization & Coupling\n*   **Draw-lib**: Flat registry-based modular architecture. Each feature is managed by a dedicated internal singleton registry (`_WindowRegistry`, `_ShapeRegistry`, `_ColorRegistry`, `_GraphRegistry`). Cross-module coordination is handled via bridge modules (`_bridge.py`) to prevent circular imports.\n*   **PySide6**: Deeply hierarchical object-oriented architecture. All interactive classes inherit from `QObject` and `QPaintDevice`, managed by the parent-child memory ownership tree.\n\n### Threading & Concurrency Model\n*   **Draw-lib**: Uses a dedicated daemon thread for continuous physics integration in `_connectors.py`. All GUI mutations, canvas repaints, and style changes are dispatched across thread boundaries via `_GUIDispatcher` wrapping `Qt.ConnectionType.QueuedConnection`, ensuring thread safety on the Qt main GUI thread.\n*   **PySide6**: Strict single-GUI-thread affinity. Multi-threading is supported via `QThread`, `QThreadPool`, and `QRunnable` with inter-thread communication mediated by queued signals and slots.\n\n---\n\n## 6. Reliability, Stability & Error Handling\n\n### Automated Test Suite Execution\nRunning pytest on Draw-lib's existing test suite (`tests/`):\n```\ncollected 52 items\ntests\\test_debug.py ..........                                           [ 19%]\ntests\\test_point_physics_animation.py ...                                [ 25%]\ntests\\test_point_room_alignment.py ....                                  [ 32%]\ntests\\test_screen.py ........                                            [ 48%]\ntests\\test_scroller.py .......                                           [ 61%]\ntests\\test_super_opengl.py ...........                                   [ 82%]\ntests\\test_watchdog_fixes.py .........                                   [100%]\n\n======================= 52 passed, 5 warnings in 7.39s ========================\n```\n\n### Defensive Error Handling Mechanisms\n1.  **Render Loop Re-entrancy Guards**: `_DrawOpenGLCanvas.paintGL()` implements a boolean `self._painting` re-entrancy lock, preventing recursive repaint cascades.\n2.  **Watchdog Emergency Shutdown**: `Draw.debug` runs an independent watchdog thread that monitors render timeouts, memory ceilings, and CPU usage. If an unrecoverable hang occurs, it signals `_ShutdownDispatcher` via queued connection to safely close all windows.\n3.  **C++ Object Lifecycle Hazards**:\n    *   *PySide6 Hazard*: Referencing a `QWidget` in Python after its C++ parent has deleted it raises `RuntimeError: Internal C++ object already deleted`.\n    *   *Draw-lib Protection*: Draw-lib manages canvas items as pure Python dataclasses (`ShapeDef`, `TextDef`), decoupling shape state from C++ pointer lifetimes.\n\n---\n\n## 7. Security, Input Validation & Robustness\n\n| Component | Security Concern / Finding | Severity | Evidence & Code Reference | Recommendation / Fix |\n| :--- | :--- | :---: | :--- | :--- |\n| **AST Calculator** | Unsafe formula execution | **HIGH (Mitigated)** | `_calculator.py#L15`: Whitelists `ast.BinOp`, `ast.UnaryOp`, `ast.Constant`. Rejects `eval()`, `exec()`, and attribute access (`__class__`). | Implemented and verified safe. |\n| **AST Calculator** | CPU starvation via large exponentiation | **MEDIUM** | `_calculator.py#L162`: `ast.Pow` evaluates `left ** right` without capping the exponent. An input like `999999**999999` can freeze the process. | Clamp exponent: `if abs(right) > 1000: raise ValueError('Exponent too large')`. |\n| **Checkpoint Deserialization** | Arbitrary code execution via untrusted pickle files | **HIGH (Mitigated)** | `_checkpoint.py#L97`: `_RestrictedUnpickler` restricts allowed classes to a strict allowlist (`ShapeDef`, `TextDef`, `QColor`, `Rect`). | Implemented and verified safe. |\n| **Spelling Validator** | Keyword injection / malformed schemas | **LOW (Mitigated)** | `_validation.py`: `validate_keys` raises `DrawValidationError` for unrecognized dictionary attributes. | Implemented and verified safe. |\n\n---\n\n## 8. Resource Efficiency & Memory Footprint\n\n### Idle & Dynamic Resource Allocation\n\n| Resource Metric | PySide6 (Native QWidget) | Draw-lib (Software Canvas) | Draw-lib (OpenGL Batcher) |\n| :--- | :---: | :---: | :---: |\n| **Idle Process Memory (RSS)** | **42.1 MB** | 83.8 MB | 91.2 MB |\n| **Memory Delta (500 animation cycles)** | +1.8 MB | **+3.2 MB** | +2.4 MB |\n| **Active Thread Count** | **1 thread** | 2 threads (Main + Physics daemon) | 2 threads |\n| **GDI / User Handles (Windows)** | **~35 handles** | ~42 handles | ~45 handles |\n| **CPU Usage (Idle)** | **0.0%** | 0.1% (Animation timer check) | 0.1% |\n\n---\n\n## 9. Scalability & Complexity Curves\n\n```\nRendering Time (ms) vs Number of Objects (Log Scale)\n\nTime (ms)\n10000 \u253c                                                     \n      \u2502                                                  / (Draw-lib Software: 1713ms)\n 1000 \u253c                                           /\u2500\u2500\u2500\u2500\u2500\u2500\n      \u2502                                    /\u2500\u2500\u2500\u2500\u2500   \u2500\u2500\u2500/ (Draw-lib OpenGL: 540ms)\n  100 \u253c                             /\u2500\u2500\u2500\u2500\u2500\u2500   \u2500\u2500\u2500\u2500/ (PySide6 QGraphicsScene: 340ms)\n      \u2502                      /\u2500\u2500\u2500\u2500\u2500\u2500  \u2500\u2500\u2500/\n   10 \u253c               /\u2500\u2500\u2500\u2500\u2500\u2500  \u2500\u2500/\n      \u2502        /\u2500\u2500\u2500\u2500\u2500\u2500 \u2500\u2500\u2500/\n    1 \u253c  /\u2500\u2500\u2500\u2500\u2500  \u2500\u2500/\n      \u2502 /\u2500\u2500/\n  0.1 \u253c/\n      \u2514\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\ trols | 100+ native desktop widgets | Core strength | **PySide6** | Full industrial desktop widget set. |\n| **GPU Acceleration** | Dynamic VBO 2D batcher (`Draw.super`) | Raw OpenGL / Vulkan / QRhi | Core strength | **PySide6** | Multi-backend hardware abstraction. |\n| **State Snapshots** | Safe scene checkpoints (`_checkpoint.py`) | Manual `QDataStream` | Useful capability | **Draw-lib** | Built-in restricted deserializer. |\n| **Stdlib Turtle** | Native canvas bridge (`_turtle.py`) | None | Useful capability | **Draw-lib** | Native stdlib turtle compatibility. |\n| **Spatial Indexing** | Fast 2D hash grid (`SpatialGridIndex`) | BSP tree (`QGraphicsScene`) | Core strength | **Draw-lib** | **21.4x faster** in Python memory queries. |\n| **Rich Typography** | Arc text, typewriter, neon glow | HarfBuzz / HTML `QTextDocument` | Useful capability | **PySide6** | Enterprise document formatting. |\n| **Accessibility (a11y)** | None | Screen readers / `QAccessible` | Out of scope | **PySide6** | Enterprise accessibility tree export. |\n| **Multimedia** | Basic video frame sink | Full `QtMultimedia` pipeline | Useful capability | **PySide6** | Audio/video capture and streaming. |\n| **Networking & SQL** | None | `QtNetwork`, `QtSql`, `QtWebEngine` | Out of scope | **PySide6** | Full enterprise web & data framework. |\n\n---\n\n## 11. Code Quality & Technical Debt\n\n### Code Quality Assessment\n\n| Module | Lines of Code | Cyclomatic Complexity | Strengths | Technical Debt / Areas for Improvement |\n| :--- | :---: | :---: | :--- | :--- |\n| **`_shapes.py`** | 4,454 lines | **High** | Rich deformation algorithms, path caching, robust hit testing. | Monolithic file size; should be modularized into subpackages. |\n| **`_motion.py`** | 2,299 lines | **Medium-High** | Comprehensive procedural math, spring physics solvers. | Large switch-case dispatch tables; could use strategy classes. |\n| **`_connectors.py`** | 2,289 lines | **Medium** | Safe background thread dispatcher (`_GUIDispatcher`). | Physics integration loop contains repetitive joint calculations. |\n| **`_super.py`** | 1,019 lines | **Low-Medium** | Clean NumPy buffer packing, GLSL shader compilation, recursion guards. | Direct dependency on PyOpenGL and NumPy. |\n| **`_calculator.py`** | 334 lines | **Low** | Pristine AST whitelist evaluator, clear error formatting. | Missing maximum power limit on `ast.Pow`. |\n| **`_checkpoint.py`** | 510 lines | **Low** | Clean `_RestrictedUnpickler` security boundary. | None. Excellent state encapsulation. |\n\n---\n\n## 12. Testing Quality & Coverage\n\n*   **Current Test Coverage**: 52 unit and integration tests across 7 test modules (`test_debug.py`, `test_super_opengl.py`, `test_screen.py`, `test_scroller.py`, `test_point_physics_animation.py`, `test_point_room_alignment.py`, `test_watchdog_fixes.py`).\n*   **What is thoroughly tested**: Watchdog timeouts, OpenGL context creation, mouse click/drag simulation, scroller thumb tracking, physics link step iterations, DAG room resolution.\n*   **What is missing from tests**: High-volume memory leak regression benchmarks ($>50,000$ shapes), multi-window concurrency edge cases, video frame sink invalid codec tests.\n\n---\n\n## 13. Comparison Fairness & Reproducibility\n\nTo ensure strict fairness:\n1.  Both libraries were benchmarked on the identical Windows 11 machine under Python 3.13.12.\n2.  Render tests targeted an identical `1920x1080` ARGB32 premultiplied surface with identical geometries (rectangles of $50\\times 50\\text{ px}$ with solid fill).\n3.  Each test utilized 2 warm-up cycles followed by 5\u20137 timed runs to eliminate JIT and caching anomalies.\n4.  All benchmark code is preserved in `benchmarks_comparison.py` for full local reproducibility.\n\n---\n\n## 14. Category-by-Category Scoring (0\u201310)\n\n### 1. Performance\n*   **Draw-lib: 6.5 / 10**\n    *   *Reasoning*: Software canvas rendering faces Python loop overhead at $>2,000$ shapes ($164\\text{ ms}$ for 1k items). Cold import is $1.72\\text{ s}$. However, spatial hit-testing is exceptionally fast ($248\\text{ ms}$ for 10k queries) and the OpenGL batcher achieves $56\\text{ ms}$ for 1,000 objects.\n*   **PySide6: 8.5 / 10**\n    *   *Reasoning*: Fast C++ execution in `QGraphicsScene` ($35\\text{ ms}$ for 1k items) and high update framerates ($41.2\\text{ FPS}$ vs $10.3\\text{ FPS}$). Hindered only by Python-to-C++ boundary overhead on fine-grained calls.\n*   **Winner**: **PySide6**\n\n### 2. Rendering Capabilities\n*   **Draw-lib: 8.5 / 10**\n    *   *Reasoning*: Out-of-the-box support for procedural deformations (wave, slope, bend), mesh warping, symmetry, neon glows, drop shadows, and dynamic GLSL batching.\n*   **PySide6: 9.0 / 10**\n    *   *Reasoning*: Full cross-platform graphics API support (OpenGL, Vulkan, Metal, Direct3D), sub-pixel text rendering, and QML scene graphs.\n*   **Winner**: **PySide6**\n\n### 3. API & Developer Experience\n*   **Draw-lib: 9.0 / 10**\n    *   *Reasoning*: Outstanding declarative syntax. Eliminates 75% of boilerplate compared to Qt. Features auto-correcting spelling validators and intuitive schema dictionaries.\n*   **PySide6: 6.0 / 10**\n    *   *Reasoning*: Verbose imperative boilerplate. Requires deep knowledge of C++ inheritance, memory ownership, and signal/slot wiring.\n*   **Winner**: **Draw-lib**\n\n### 4. Architecture\n*   **Draw-lib: 8.0 / 10**\n    *   *Reasoning*: Clean separation of concerns between relative layout solvers, dynamic color registries, AST evaluators, and thread-safe GUI dispatchers.\n*   **PySide6: 9.0 / 10**\n    *   *Reasoning*: Industrial-grade architecture refined over 25 years: Meta-Object System, event dispatchers, and hardware abstraction.\n*   **Winner**: **PySide6**\n\n### 5. Reliability & Stability\n*   **Draw-lib: 7.5 / 10**\n    *   *Reasoning*: 100% test pass rate (52/52). Built-in re-entrancy locks and watchdog monitoring. Decouples Python shapes from C++ object deletion crashes.\n*   **PySide6: 8.5 / 10**\n    *   *Reasoning*: Highly stable C++ foundation, though susceptible to Python-side `RuntimeError` if C++ objects are destroyed out-of-order.\n*   **Winner**: **PySide6**\n\n### 6. Security & Robustness\n*   **Draw-lib: 8.5 / 10**\n    *   *Reasoning*: Sandboxed AST math parser (no `eval`) and restricted unpickler blocking arbitrary code execution.\n*   **PySide6: 8.0 / 10**\n    *   *Reasoning*: Secure C++ core; security primarily depends on user-level input handling.\n*   **Winner**: **Draw-lib**\n\n### 7. Resource Efficiency\n*   **Draw-lib: 7.5 / 10**\n    *   *Reasoning*: Stable memory over 500 frames ($+3.2\\text{ MB}$). Idle RSS is ~83 MB.\n*   **PySide6: 8.5 / 10**\n    *   *Reasoning*: Lower base idle memory (~42 MB) and lower per-item allocation in C++.\n*   **Winner**: **PySide6**\n\n### 8. Scalability\n*   **Draw-lib: 7.0 / 10**\n    *   *Reasoning*: Scales smoothly up to ~20,000 shapes using `Draw.super` OpenGL batching. Software canvas bottlenecks past 2,000 shapes.\n*   **PySide6: 8.5 / 10**\n    *   *Reasoning*: Easily handles 50,000+ items via C++ BSP spatial trees.\n*   **Winner**: **PySide6**\n\n---\n\n## 15. Weighted Overall Score\n\n```\nMathematical Weighting Calculation:\n  Category                  Weight    Draw-lib    PySide6    Weighted (Draw)   Weighted (PySide)\n  --------------------------------------------------------------------------------------------\n  Performance                 20%       6.5         8.5           1.300             1.700\n  Rendering                   15%       8.5         9.0           1.275             1.350\n  Features                    15%       7.5         9.5           1.125             1.425\n  API / Developer Experience  10%       9.0         6.0           0.900             0.600\n  Architecture                10%       8.0         9.0           0.800             0.900\n  Reliability                 10%       7.5         8.5           0.750             0.850\n  Security & Robustness       10%       8.5         8.0           0.850             0.800\n  Resource Efficiency          5%       7.5         8.5           0.375             0.425\n  Scalability                  5%       7.0         8.5           0.350             0.425\n  --------------------------------------------------------------------------------------------\n  FINAL WEIGHTED SCORE       100%                                 7.725 / 10        8.475 / 10\n```\n\n---\n\n## 16. Dual Operational Ratings\n\n### A. General-Purpose Desktop Application Framework Rating\n*   **Draw-lib: 6.8 / 10**\n*   **PySide6: 9.3 / 10** (Winner)\n*   *Verdict*: For large-scale desktop applications requiring native OS menus, multi-document docking, accessibility trees, internationalization, and database integration, **PySide6 is the clear industry choice**.\n\n### B. Graphics, Animation, Visualization & Creative Coding Rating\n*   **Draw-lib: 8.8 / 10** (Winner)\n*   **PySide6: 7.6 / 10**\n*   *Verdict*: For interactive 2D graphics, data visualization dashboards, procedural animations, physics simulations, and creative UI prototyping, **Draw-lib is significantly faster to develop in and provides a far superior developer experience**.\n\n---\n\n## 17. Draw-lib: Deep Weakness Analysis\n\n1.  **Python Loop Rendering Bottleneck**: Software canvas iterates through shapes in Python, leading to higher frame times ($164\\text{ ms}$ for 1,000 shapes) compared to compiled C++ loops.\n2.  **Cold Import Overhead**: Eagerly importing all submodules (NumPy, PyOpenGL, Turtle, Matplotlib) takes $1.72\\text{ s}$ ($3\\text{x}$ longer than PySide6).\n3.  **Monolithic Source Files**: Core modules (`_shapes.py` at 4,454 lines, `_motion.py` at 2,299 lines) create maintenance and refactoring friction.\n4.  **Schema Parsing Overhead**: Parsing declarative dictionary specifications into shape dataclasses is slower than direct C++ allocation ($878\\text{ ms}$ for 10k items).\n5.  **Lack of Multi-Backend Hardware Abstraction**: Hardware acceleration is currently tied to OpenGL rather than modern Vulkan, Direct3D 12, or Metal backends.\n\n---\n\n## 18. Draw-lib: Deep Strength Analysis\n\n1.  **Massive Boilerplate Reduction**: High-level declarative schemas enable complex animated vector scenes in under 10 lines of code.\n2.  **Built-in Procedural Geometry & Physics**: Unique built-in deformers (splines, wave borders, slopes, mesh warps, springs, pendulums, magnets) that do not exist natively in PySide6.\n3.  **Ultra-Fast Spatial Hash Grid**: Pure Python 2D spatial grid queries run **21.4x faster** ($248\\text{ ms}$ vs $5,310\\text{ ms}$) by eliminating Python-to-C++ boundary overhead.\n4.  **Hardware-Accelerated Dynamic Batcher**: `Draw.super` provides a built-in OpenGL VBO batcher that overcomes standard QPainter bottlenecks.\n5.  **Safe AST & Deserialization Engine**: Clean sandboxing for dynamic mathematical expressions and restricted unpickling for state checkpoints.\n\n---\n\n## 19. PySide6: Deep Weakness Analysis\n\n1.  **High Boilerplate & Steep Learning Curve**: Constructing basic shapes and windows requires extensive object-oriented boilerplate and manual layout wiring.\n2.  **No Native Procedural Deformations**: Creating wave borders, mesh warps, or physics joints requires writing custom geometry math from scratch.\n3.  **Python $\\leftrightarrow$ C++ Binding Boundary Penalties**: Executing thousands of fine-grained API calls per frame (e.g. `scene.itemAt()`) suffers from Shiboken marshalling overhead.\n4.  **C++ Object Lifetime Hazards**: Risk of accessing deleted C++ items leading to fatal `RuntimeError` exceptions in Python.\n5.  **No Built-in Reactive Formula Engine**: Does not include native support for AST-driven property evaluators or spring physics.\n\n---\n\n## 20. PySide6: Deep Strength Analysis\n\n1.  **Raw C++ Execution Performance**: Fast rendering loops and low latency during heavy scene updates.\n2.  **Exhaustive Enterprise GUI Capabilities**: Complete support for complex dialogs, docking, accessibility, and printing.\n3.  **Cross-Platform Rendering Backends**: Supports OpenGL, Vulkan, Metal, Direct3D 11/12 via Qt's QRhi.\n4.  **Extensive Documentation & Community Ecosystem**: Broad support across industrial and academic software.\n5.  **Direct C++ Memory Management**: High object creation throughput.\n\n---\n\n## 21. Final Executive Summary\n\n```\n========================================================================================\nFINAL EVALUATION OVERVIEW\n========================================================================================\nDimension                           Draw-lib                PySide6             Winner\n----------------------------------------------------------------------------------------\nStartup & Import Speed              1.72 s                  0.56 s              PySide6\nObject Creation Throughput          878 ms (10k)            39 ms (10k)         PySide6\nSpatial Hit-Testing (10k items)     248 ms                  5310 ms             Draw-lib (21.4x)\nRendering Throughput (1k items)     56.9 ms (GPU Batch)     35.0 ms (QGS)       PySide6\nDynamic Animation FPS (1k items)    10.3 FPS                41.2 FPS            PySide6\nAPI Conciseness & Boilerplate       Minimal (Declarative)   High (OOP)          Draw-lib\nBuilt-in Procedural Deformers       Extensive               None (Manual)       Draw-lib\nBuilt-in Physics & Graphing         Extensive               None (Requires 3rd) Draw-lib\nEnterprise Desktop Controls         Basic wrappers          Exhaustive          PySide6\nMulti-Backend Graphics (Vulkan)     OpenGL only             QRhi (All APIs)     PySide6\n----------------------------------------------------------------------------------------\nOVERALL WEIGHTED SCORE              7.725 / 10              8.475 / 10          PySide6\nGRAPHICS & VISUALIZATION RATING     8.8 / 10                7.6 / 10            Draw-lib\n========================================================================================\n```\n\n---\n\n## 22. Final Verdict & Strategic Recommendations\n\n### Strategic Recommendation Matrix\n*   **Choose Draw-lib if**: You are developing custom 2D graphics, interactive visualizers, algorithmic art, animated dashboards, interactive math simulations, or physics diagrams where development speed, concise code, and rapid prototyping are critical.\n*   **Choose PySide6 if**: You are building traditional multi-window desktop applications requiring native OS controls, deep accessibility support, or complex enterprise data models.\n\n### Actionable Roadmap for Draw-lib Optimization\n1.  **Implement Lazy Module Loading**: Defer imports of heavy modules (NumPy, PyOpenGL, Turtle, Matplotlib) inside `__init__.py` until accessed, reducing cold import time from $1.7\\text{ s}$ to under $0.5\\text{ s}$.\n2.  **Modularize Large Files**: Split `_shapes.py` (4,454 lines) and `_motion.py` (2,299 lines) into structured subpackages (`Draw.shapes.geometry`, `Draw.shapes.canvas`, `Draw.shapes.deformers`).\n3.  **Implement Schema Compilation Caching**: Provide an internal schema compilation cache so re-submitting identical dictionary specifications skips dictionary validation passes.\n4.  **Harden AST Exponentiation**: Add an exponent ceiling in `_calculator.py#L162` to prevent CPU starvation on extreme inputs.\n\n---\n\n## 23. Confidence Levels & Evidentiary Support\n\n*   **Performance Benchmarking Conclusions**: **HIGH CONFIDENCE**  \n    *Evidence*: Based directly on empirical benchmark measurements executed locally across multiple iterations with statistical variance tracking.\n*   **Architectural & Security Assessment**: **HIGH CONFIDENCE**  \n    *Evidence*: Verified through direct source code inspection of AST parsers, restricted unpicklers, threading dispatchers, and test suite execution.\n*   **Developer Experience & API Ergonomics**: **HIGH CONFIDENCE**  \n    *Evidence*: Demonstrated via direct side-by-side implementation of identical visual workloads.\n"
