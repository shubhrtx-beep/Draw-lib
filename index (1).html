    "content": "# Draw Motion Engine (`Draw._motion`) Technical Documentation\n\n`Draw._motion` (`Draw.motion`, `Draw.custom.motion`, `Draw.timeline`) is the high-performance structured 2D animation, procedural kinematics, and analytical physical simulation engine for the **Draw** framework. It parses declarative motion specifications, solves differential physics equations in real-time, compiles sandboxed AST math expressions, handles vertex morphing across complex vector paths, and feeds animated state overrides directly into PySide6 rendering passes at 60 FPS.\n\n---\n\n## Table of Contents\n1. [Overview & Core Architecture](#overview--core-architecture)\n2. [Public API & Registries Reference](#public-api--registries-reference)\n   - [`Draw.motion(...)` (`MotionRegistry`)](#drawmotion-motionregistry)\n   - [`Draw.custom.motion(...)` (`_CustomNamespace`)](#drawcustommotion-_customnamespace)\n   - [`Draw.timeline(...)` (`Timeline`)](#drawtimeline-timeline)\n   - [`VelocityTracker`](#velocitytracker)\n3. [Comprehensive Motion Types Reference](#comprehensive-motion-types-reference)\n4. [Easing Suite & Curve Systems](#easing-suite--curve-systems)\n   - [Built-in Graph Easing Functions (30 Modes)](#built-in-graph-easing-functions-30-modes)\n   - [Custom Cubic Bezier Solver (`solve_cubic_bezier`)](#custom-cubic-bezier-solver-solve_cubic_bezier)\n5. [Analytical Physics Solvers ($O(1)$)](#analytical-physics-solvers-o1)\n   - [1. Vector Spring Kinetics (`solve_spring`)](#1-vector-spring-kinetics-solve_spring)\n   - [2. Gravity & Ground Bounce Physics (`solve_gravity_bounce`)](#2-gravity--ground-bounce-physics-solve_gravity_bounce)\n   - [3. 2D Parabolic Projectile Motion (`solve_projectile_2d`)](#3-2d-parabolic-projectile-motion-solve_projectile_2d)\n   - [4. Kinetic Inertia & Friction Deceleration (`solve_inertia`)](#4-kinetic-inertia--friction-deceleration-solve_inertia)\n   - [5. Damped Harmonic Pendulum (`solve_pendulum`)](#5-damped-harmonic-pendulum-solve_pendulum)\n   - [6. 2D Attractor & Point Magnetism (`solve_attractor_2d`)](#6-2d-attractor--point-magnetism-solve_attractor_2d)\n6. [Procedural Kinematics & Orbital Curves](#procedural-kinematics--orbital-curves)\n   - [1. 2D Simplex Noise & Organic Wiggles (`solve_wiggle`)](#1-2d-simplex-noise--organic-wiggles-solve_wiggle)\n   - [2. Harmonic Wave Displacement (`solve_wave`)](#2-harmonic-wave-displacement-solve_wave)\n   - [3. Parametric Lissajous Figures (`solve_lissajous`)](#3-parametric-lissajous-figures-solve_lissajous)\n   - [4. Spirals (Archimedean & Logarithmic) (`solve_spiral`)](#4-spirals-archimedean--logarithmic-solve_spiral)\n   - [5. Regular Polygon Orbit (`solve_polygon_orbit`)](#5-regular-polygon-orbit-solve_polygon_orbit)\n   - [6. Area-Preserving Stretch & Squash (`solve_stretch_squash`)](#6-area-preserving-stretch--squash-solve_stretch_squash)\n7. [Vector Path Polyline Sampling & Morphing](#vector-path-polyline-sampling--morphing)\n   - [SVG Path Sampling & Tangent Orientation (`sample_polyline_at`)](#svg-path-sampling--tangent-orientation-sample_polyline_at)\n   - [Polygon Morphing & Resampling Strategies](#polygon-morphing--resampling-strategies)\n8. [Sandboxed AST Expression Engine (`DrawExprSolver`)](#sandboxed-ast-expression-engine-drawexprsolver)\n9. [Timeline Orchestration & Keyframes](#timeline-orchestration--keyframes)\n10. [Interactive Triggers](#interactive-triggers)\n11. [Comprehensive Code Examples](#comprehensive-code-examples)\n\n---\n\n## Overview & Core Architecture\n\nThe `Draw._motion` engine decouples animation definitions from rendering loops. It evaluates time-dependent states, executes physical models, and injects transformed parameters (`x`, `y`, `scale`, `rotation`, `opacity`, `vertices`, `color`) into shapes, hitboxes, and text items.\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502              Draw.motion(ip=..., motion=[...])           \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                            \u2502 parses into\n                            \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                      MotionRecord                        \u2502\n\u2502   (Type, Keyframes, Physics, AST Solvers, Triggers)      \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                            \u2502 evaluated per-frame via\n                            \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                     MotionRegistry                       \u2502\n\u2502 - Analytical Physics: Spring, Gravity, Projectile, Drag \u2502\n\u2502 - Parametric Kinematics: Lissajous, Orbit, Simplex Noise \u2502\n\u2502 - Path Followers & Polygon Vertex Morphing               \u2502\n\u2502 - AST Expression Engine (DrawExprSolver)                 \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                            \u2502 state applied in\n                            \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                      _DrawCanvas                         \u2502\n\u2502 - ShapeDef._last_motion_state position overrides         \u2502\n\u2502 - Hitbox & TextDef transformed coordinate mapping        \u2502\n\u2502 - Continuous 60 FPS animation timer dispatch             \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n## Public API & Registries Reference\n\n### `Draw.motion(...)` (`MotionRegistry`)\n\nAttaches one or more motion records to target elements matching an IP identifier:\n\n```python\n# Preferred syntax using canonical 'ip' keyword:\nDraw.motion(\n    ip            = \"my_shape_ip\",     # Target element IP tag\n    motion_get_ip = \"my_layout\",       # Optional layout IP\n    trigger       = \"hover\",           # Optional trigger: \"hover\", \"press\", \"visible\", \"drag\", \"scroll\"\n    motion        = [\n        {\n            \"type\": \"spring\",\n            \"attribute\": \"position\",\n            \"from\": [0, 0],\n            \"to\": [200, 150],\n            \"stiffness\": 300.0,\n            \"damping\": 25.0,\n        }\n    ]\n)\n\n# Connection dict syntax (backward-compatible):\nDraw.motion(\n    connection = {\"motion_ip\": \"my_shape_ip\", \"motion_get_ip\": \"my_layout\"},\n    motion     = [...],\n)\n```\n\n#### Registry Methods on `Draw.motion`\n* **`Draw.motion.register_type(name: str, handler: Callable) -> str`**: Registers a custom motion handler function `handler(record, value, state)`.\n* **`Draw.motion.register_graph(name: str, fn: Callable[[float], float]) -> str`**: Registers a custom graph easing function mapping $t \\in [0, 1] \\to [0, 1]$.\n* **`Draw.motion.parse_target_ref(raw, default_target=\"shape\") -> TargetRef`**: Normalizes target references into `TargetRef(target, ip)`.\n* **`Draw.motion.parse_motion_list(raw_motion, time_line=None) -> list[MotionRecord]`**: Parses a list of motion dictionaries into compiled `MotionRecord` objects.\n* **`Draw.motion.progress(record, now, started_at) -> Optional[float]`**: Computes normalized, eased fractional progress $t \\in [0, 1]$ for a motion record.\n* **`Draw.motion.interpolate(start, end, t) -> Any`**: Linearly or recursively interpolates between numbers, lists, or dictionary states.\n* **`Draw.motion.interpolate_color(start, end, t, parse_color) -> QColor`**: Smoothly blends between two colors in RGBA space.\n* **`Draw.motion.compute_shape_state(shape, now, parse_color, x, y, w, h, canvas) -> dict`**: Evaluates all active motion records for a shape, returning animated state overrides.\n* **`Draw.motion.compute_hitbox_state(shape, now, parse_color, x, y, w, h, canvas) -> dict`**: Evaluates active motion records targeting hitboxes.\n* **`Draw.motion.tick_shape_triggers(shape, dt: float) -> None`**: Updates interactive trigger interpolation progress ($0.0 \\to 1.0$) for hover, press, drag, etc.\n* **`Draw.motion.tick_timelines(now: float) -> bool`**: Advances active `Timeline` instances.\n* **`Draw.motion.create_timeline(*args, **kwargs) -> Timeline`**: Creates and activates an orchestrated `Timeline`.\n\n---\n\n### `Draw.custom.motion(...)` (`_CustomNamespace`)\n\nRegisters a programmatic motion hook that computes custom animated values or updates external state every frame:\n\n```python\nrecord = Draw.custom.motion(\n    ip           = \"custom_orbit\",\n    get_custom   = lambda record, t: {\"x\": math.cos(t * math.tau) * 100, \"y\": math.sin(t * math.tau) * 100},\n    motion       = [{\"from\": 0, \"to\": 1, \"duration\": 3.0, \"repeat\": True}],\n)\n```\n\n#### Custom Motion Registry Methods\n* **`Draw.motion.get_custom(ip: str) -> Optional[CustomMotionRecord]`**: Retrieves a custom motion record by IP.\n* **`Draw.motion.list_custom() -> list[dict]`**: Returns serialized dictionaries of all active custom motion records.\n* **`Draw.motion.clear_custom(ip: Optional[str] = None) -> None`**: Clears a specific custom motion record, or flushes all when `ip=None`.\n* **`Draw.motion.tick_custom(now: float) -> bool`**: Evaluates all registered custom motion callbacks.\n\n---\n\n### `Draw.timeline(...)` (`Timeline`)\n\nCreates an orchestrated animation timeline supporting sequential tracks, keyframes, and staggered execution across multiple shape IDs:\n\n```python\ntl = Draw.timeline(\n    repeat = True,\n    delay  = 0.5,\n)\n\n# Stagger animations across multiple shapes\ntl.stagger(\n    targets = [\"card_1\", \"card_2\", \"card_3\"],\n    stagger = 0.15, # 150ms delay between consecutive items\n    motion  = {\"type\": \"move\", \"from\": [0, 50], \"to\": [0, 0], \"duration\": 0.6, \"graph\": \"ease_out_back\"},\n)\n```\n\n---\n\n### `VelocityTracker`\n\nUtility class for tracking interactive drag-and-drop or gesture position samples to compute smooth inertial release velocities:\n\n```python\nfrom Draw._motion import VelocityTracker\n\ntracker = VelocityTracker(max_samples=10, max_age=0.25)\ntracker.add_sample(time.perf_counter(), current_x)\nrelease_velocity = tracker.get_velocity()\n```\n\n---\n\n## Comprehensive Motion Types Reference\n\n`Draw._motion` includes 38 built-in 2D animation and physics types:\n\n| Motion Type | Animated State Keys | Required / Supported Parameters | Description |\n| :--- | :--- | :--- | :--- |\n| `\"move\"`, `\"position\"` | `x`, `y` | `from: [x, y]`, `to: [x, y]`, `duration`, `graph` | 2D translation between two coordinates |\n| `\"x\"`, `\"y\"` | `x` or `y` | `from: float`, `to: float`, `duration`, `graph` | 1D axis-specific translation |\n| `\"path\"` | `x`, `y`, `rotation` | `path: str`, `orient: bool`, `orient_offset: float`, `offset: [x, y]` | Follows an SVG path string or vertex polyline |\n| `\"expand\"` | `width`, `height` | `from: [w, h]`, `to: [w, h]`, `duration` | Pixel dimension scaling |\n| `\"scale\"` | `scale_x`, `scale_y` | `from: float/[sx, sy]`, `to: float/[sx, sy]` | Relative geometric scaling multiplier |\n| `\"rotate\"` | `rotation`, `rotation_center` | `from: float`, `to: float`, `center: tuple/ip` | Degrees clockwise rotation around shape or IP pivot |\n| `\"opacity\"`, `\"blur\"` | `opacity`, `blur` | `from: int`, `to: int` | Alpha transparency ($0..100$) and blur strength |\n| `\"color\"` | `color` | `color: [from, to]` or `from`, `to` | Smooth RGBA color transition |\n| `\"glow\"` | `glow`, `glow_radius`, `glow_color` | `radius: int`, `color: str/tuple` | Animated outer glow effect |\n| `\"skew\"`, `\"shear\"` | `skew_x`, `skew_y` | `from: [sx, sy]`, `to: [sx, sy]` | 2D skew matrix deformation |\n| `\"trim_path\"` | `trim_start`, `trim_end` | `from: [s, e]`, `to: [s, e]` ($0..1$) | Strokes fractional sub-segments of a vector path |\n| `\"stroke_dash\"` | `dash_offset`, `dash_array` | `offset: float`, `array: list[float]` | Animated dashed line marching ants effect |\n| `\"shake\"`, `\"wiggle\"` | `x`, `y` | `frequency: float`, `amplitude: float`, `octaves: int` | Multi-octave continuous 2D Simplex noise wiggle |\n| `\"wave\"`, `\"pulse\"` | `y` (wave) or `scale` (pulse) | `frequency: float`, `amplitude: float`, `phase: float` | Sinusoidal displacement or pulsing |\n| `\"gravity\"`, `\"bounce_physics\"` | `y` | `v0`, `g`, `restitution`, `floor_y`, `start_y` | Analytical multi-bounce vertical gravity physics |\n| `\"projectile\"`, `\"gravity_2d\"` | `x`, `y` | `vx0`, `vy0`, `g`, `drag`, `restitution`, `floor_y`, `wall_x` | 2D parabolic trajectory with air drag & wall reflection |\n| `\"spring\"` | `x`, `y`, `scale`, `rotation` | `from`, `to`, `stiffness`, `damping`, `mass`, `velocity` | 2nd-order analytical damped spring kinetics |\n| `\"inertia\"` | `x`, `y`, `scroll_y` | `velocity`, `friction`, `bounds: [min, max]` | Exponential kinetic deceleration with wall clamping |\n| `\"pendulum\"` | `rotation` | `amplitude`, `frequency`, `damping` | Damped harmonic pendulum oscillations |\n| `\"orbit\"`, `\"polygon_orbit\"` | `x`, `y` | `radius: float`, `sides: int`, `frequency: float` | Parametric regular polygon edge orbit ($N \\ge 3$) |\n| `\"benzene\"` | `x`, `y` | `radius: float`, `frequency: float` | 6-sided hexagonal face orbit |\n| `\"lissajous\"` | `x`, `y` | `amplitude_x`, `amplitude_y`, `freq_x`, `freq_y`, `phase_x`, `phase_y` | Parametric harmonic 2D Lissajous figure |\n| `\"spiral\"` | `x`, `y` | `a`, `b`, `frequency`, `logarithmic: bool` | Archimedean ($r = a + b\\theta$) or Logarithmic spiral |\n| `\"attractor\"` | `x`, `y` | `target_x`, `target_y`, `strength: float` | Exponential point attraction towards target/cursor |\n| `\"stretch_squash\"` | `scale_x`, `scale_y` | `amplitude`, `frequency`, `damping` | Area-preserving physical stretch and squash |\n| `\"morph\"` | `vertices` | `from: dict`, `to: dict`, `resample: str` | Vector polygon morphing across shape geometries |\n| `\"vertices\"` | `vertices` / `vertices_count` | AST expression or numeric vertex count | Dynamic procedural polygon vertex evaluation |\n| `\"rotate_x\"`, `\"rotate_y\"`, `\"rotate_3d\"`, `\"perspective\"` | 3D transform emulations | `rotate_x`, `rotate_y`, `perspective` | Pseudo-3D tilt and perspective projection |\n| `\"transform\"` | `x`, `y`, `w`, `h`, `scale`, `rotation`, `opacity` | Dictionary of combined properties | Multi-property unified transformation |\n| `\"custom\"` | Custom state dictionary | `custom_data: Any` | User-defined custom animation payload |\n\n---\n\n## Easing Suite & Curve Systems\n\n### Built-in Graph Easing Functions (30 Modes)\n\nSpecify the curve using the `\"graph\"` (or `\"easing\"`) parameter:\n\n| Family | Easing Names | Curve Characteristics |\n| :--- | :--- | :--- |\n| **Linear** | `\"linear\"` | Uniform constant speed ($f(t) = t$) |\n| **Quadratic** | `\"ease_in\"`, `\"ease_out\"`, `\"ease_in_out\"`, `\"ease_in_quad\"`, `\"ease_out_quad\"`, `\"ease_in_out_quad\"` | $t^2$ smooth acceleration and deceleration |\n| **Cubic** | `\"ease_in_cubic\"`, `\"ease_out_cubic\"`, `\"ease_in_out_cubic\"` | $t^3$ cubic curvature |\n| **Quartic** | `\"ease_in_quart\"`, `\"ease_out_quart\"`, `\"ease_in_out_quart\"` | $t^4$ steep curve |\n| **Quintic** | `\"ease_in_quint\"`, `\"ease_out_quint\"`, `\"ease_in_out_quint\"` | $t^5$ dramatic acceleration |\n| **Exponential** | `\"ease_in_expo\"`, `\"ease_out_expo\"`, `\"ease_in_out_expo\"` | Exponential curve ($2^{10(t-1)}$) |\n| **Circular** | `\"ease_in_circ\"`, `\"ease_out_circ\"`, `\"ease_in_out_circ\"` | Quarter-circle arc curvature |\n| **Back / Overshoot**| `\"back\"`, `\"ease_in_back\"`, `\"ease_out_back\"`, `\"ease_in_out_back\"` | Retracts before moving or overshoots target |\n| **Elastic** | `\"elastic\"`, `\"ease_in_elastic\"`, `\"ease_out_elastic\"`, `\"ease_in_out_elastic\"` | Damped sine wave oscillation |\n| **Bounce** | `\"bounce\"`, `\"ease_in_bounce\"`, `\"ease_out_bounce\"`, `\"ease_in_out_bounce\"` | Piecewise simulated ground bounce |\n\n### Custom Cubic Bezier Solver (`solve_cubic_bezier`)\n\nEvaluates CSS-style cubic Bezier curves `(x1, y1, x2, y2)` at progress $t \\in [0, 1]$ using high-precision binary parameter inversion:\n\n```python\nfrom Draw._motion import solve_cubic_bezier\n\n# Equivalent to CSS cubic-bezier(0.25, 0.1, 0.25, 1.0)\neased_progress = solve_cubic_bezier(t=0.4, x1=0.25, y1=0.1, x2=0.25, y2=1.0)\n```\n\n---\n\n## Analytical Physics Solvers ($O(1)$)\n\nAll physics models in `_motion.py` are solved analytically in constant $O(1)$ time per frame without iterative Euler simulation loops:\n\n### 1. Vector Spring Kinetics (`solve_spring`)\nSolves the second-order differential equation $m \\ddot{x} + c \\dot{x} + k x = 0$ across all 3 physical damping regimes:\n* **Underdamped ($\\zeta < 1.0$)**: Sinusoidal overshoot with exponential envelope decay.\n* **Critically Damped ($\\zeta = 1.0$)**: Fastest settling time without overshoot.\n* **Overdamped ($\\zeta > 1.0$)**: Hyperbolic non-oscillatory return.\n\n```python\nDraw.motion(\n    ip=\"btn\",\n    motion=[{\n        \"type\": \"spring\",\n        \"attribute\": \"position\",\n        \"from\": [100, 100],\n        \"to\": [300, 200],\n        \"stiffness\": 350.0,  # Spring constant k\n        \"damping\": 22.0,     # Damping coefficient c\n        \"mass\": 1.0,         # Body mass m\n        \"velocity\": \"inherit\", # Inherits release velocity from drag tracker\n    }]\n)\n```\n\n### 2. Gravity & Ground Bounce Physics (`solve_gravity_bounce`)\nEvaluates vertical position $y(t)$ under gravitational acceleration $g$ bouncing off `floor_y` with restitution $e$:\n\n```python\nDraw.motion(\n    ip=\"bouncing_ball\",\n    motion=[{\n        \"type\": \"gravity\",\n        \"from\": 50.0,        # Initial Y position\n        \"velocity\": 0.0,     # Initial vertical velocity v0\n        \"g\": 980.0,          # Gravity (pixels/s^2)\n        \"restitution\": 0.75, # Coefficient of restitution (energy retention)\n        \"floor_y\": 450.0,    # Ground impact floor\n    }]\n)\n```\n\n### 3. 2D Parabolic Projectile Motion (`solve_projectile_2d`)\nSimulates full 2D ballistic trajectories with horizontal velocity $v_{x0}$, vertical launch $v_{y0}$, air drag, ground bounce, and optional vertical wall reflection:\n\n```python\nDraw.motion(\n    ip=\"cannon_shot\",\n    motion=[{\n        \"type\": \"projectile\",\n        \"from\": [50, 400],\n        \"vx0\": 300.0,\n        \"vy0\": -500.0,\n        \"g\": 980.0,\n        \"drag\": 0.04,\n        \"restitution\": 0.7,\n        \"floor_y\": 500.0,\n        \"wall_x\": 750.0,     # Rebounds horizontally off wall at x=750\n    }]\n)\n```\n\n### 4. Kinetic Inertia & Friction Deceleration (`solve_inertia`)\nSimulates touch/wheel deceleration ($v(t) = v_0 \\cdot \\text{friction}^t$) with boundary clamping:\n\n```python\nDraw.motion(\n    ip=\"scroller_content\",\n    motion=[{\n        \"type\": \"inertia\",\n        \"attribute\": \"scroll_y\",\n        \"velocity\": -1200.0,\n        \"friction\": 0.94,\n        \"bounds\": [0.0, 5000.0],\n    }]\n)\n```\n\n### 5. Damped Harmonic Pendulum (`solve_pendulum`)\nComputes angular displacement $\\theta(t) = A e^{-\\gamma t} \\cos(2\\pi f t + \\phi)$ in degrees:\n\n```python\nDraw.motion(\n    ip=\"pendulum_arm\",\n    motion=[{\n        \"type\": \"pendulum\",\n        \"amplitude\": 60.0,   # Initial swing angle in degrees\n        \"frequency\": 1.2,    # Oscillation frequency in Hz\n        \"damping\": 0.2,      # Decay rate\n    }]\n)\n```\n\n### 6. 2D Attractor & Point Magnetism (`solve_attractor_2d`)\nPulls elements smoothly toward moving targets (e.g. mouse cursor or leader shapes):\n\n```python\nDraw.motion(\n    ip=\"follower_dot\",\n    motion=[{\n        \"type\": \"attractor\",\n        \"strength\": 8.0,     # Pull strength\n        # Automatically tracks canvas mouse coordinates if target_x/y omitted\n    }]\n)\n```\n\n---\n\n## Procedural Kinematics & Orbital Curves\n\n### 1. 2D Simplex Noise & Organic Wiggles (`solve_wiggle`)\nUses continuous 2D Simplex gradient noise to produce smooth natural wiggles:\n\n```python\nDraw.motion(\n    ip=\"floating_island\",\n    motion=[{\n        \"type\": \"wiggle\",\n        \"frequency\": 3.0,\n        \"amplitude\": 25.0,\n        \"octaves\": 3,\n    }]\n)\n```\n\n### 2. Harmonic Wave Displacement (`solve_wave`)\nRenders smooth sinusoidal undulations:\n```python\nDraw.motion(ip=\"wave_bar\", motion=[{\"type\": \"wave\", \"frequency\": 2.0, \"amplitude\": 30.0, \"phase\": 0.0}])\n```\n\n### 3. Parametric Lissajous Figures (`solve_lissajous`)\nTraces 2D harmonic orbital figures ($x = A_x \\sin(2\\pi f_x t + \\phi_x), y = A_y \\sin(2\\pi f_y t + \\phi_y)$):\n```python\nDraw.motion(\n    ip=\"orbit_particle\",\n    motion=[{\n        \"type\": \"lissajous\",\n        \"amplitude_x\": 120.0,\n        \"amplitude_y\": 80.0,\n        \"freq_x\": 3.0,\n        \"freq_y\": 2.0,\n    }]\n)\n```\n\n### 4. Spirals (Archimedean & Logarithmic) (`solve_spiral`)\n```python\nDraw.motion(ip=\"galaxy_star\", motion=[{\"type\": \"spiral\", \"a\": 10.0, \"b\": 15.0, \"frequency\": 1.0, \"logarithmic\": False}])\n```\n\n### 5. Regular Polygon Orbit (`solve_polygon_orbit`)\nConstrains motion along the boundary of an $N$-sided regular polygon (e.g., $N=6$ for benzene ring motion):\n```python\nDraw.motion(ip=\"electron\", motion=[{\"type\": \"polygon_orbit\", \"radius\": 120.0, \"sides\": 6, \"frequency\": 0.5}])\n```\n\n### 6. Area-Preserving Stretch & Squash (`solve_stretch_squash`)\nMaintains geometric volume during dynamic impacts ($\\text{scale}_y = 1 / \\text{scale}_x$):\n```python\nDraw.motion(ip=\"jelly_box\", motion=[{\"type\": \"stretch_squash\", \"amplitude\": 0.35, \"frequency\": 2.5, \"damping\": 1.2}])\n```\n\n---\n\n## Vector Path Polyline Sampling & Morphing\n\n### SVG Path Sampling & Tangent Orientation (`sample_polyline_at`)\nFollows arbitrary SVG path strings or coordinate lists at constant speed, automatically computing the tangent heading:\n\n```python\nDraw.motion(\n    ip=\"airplane\",\n    motion=[{\n        \"attribute\": \"path\",\n        \"path\": \"M 50 300 C 150 50, 450 50, 550 300\",\n        \"duration\": 4.0,\n        \"orient\": True,          # Auto-rotates shape to face path tangent\n        \"orient_offset\": 90.0,   # Adjusts asset base orientation angle\n        \"graph\": \"ease_in_out_cubic\",\n        \"repeat\": True,\n    }]\n)\n```\n\n### Polygon Morphing & Resampling Strategies\nMorphs vertices between two vector shapes using one of three resampling algorithms:\n1. **`\"distribute\"`** *(default)*: Samples points at equal perimeter arc-lengths.\n2. **`\"subdivide\"`**: Iteratively inserts midpoints along the longest edges.\n3. **`\"polar_map\"`**: Maps vertices via centroid radial ray intersections.\n\n```python\nDraw.motion(\n    ip=\"shape_morph\",\n    motion=[{\n        \"type\": \"morph\",\n        \"from\": {\"shape\": \"circle\", \"radius\": 80, \"cx\": 200, \"cy\": 200},\n        \"to\": {\"shape\": \"star\", \"points\": 5, \"outer_radius\": 100, \"inner_radius\": 40, \"cx\": 200, \"cy\": 200},\n        \"resample\": \"polar_map\",\n        \"duration\": 2.0,\n        \"repeat\": True,\n        \"reverse\": True,\n    }]\n)\n```\n\n---\n\n## Sandboxed AST Expression Engine (`DrawExprSolver`)\n\nAllows writing secure, per-frame evaluated math expressions without `eval()` or `exec()`:\n\n```python\nDraw.motion(\n    ip=\"procedural_mesh\",\n    motion=[{\n        \"type\": \"vertices\",\n        \"solver\": {\n            \"expression\": \"{'x': x + sin(time * 3 + index) * 20, 'y': y + cos(time * 2 + index) * 20}\"\n        }\n    }]\n)\n```\n\n### Available Expression Globals\n* **Math Functions**: `sin`, `cos`, `tan`, `atan2`, `abs`, `min`, `max`, `exp`, `pow`, `sqrt`, `round`, `floor`, `degrees`, `radians`, `sign`, `fract`, `smoothstep`, `mod`, `lerp`, `step`, `clamp`.\n* **Noise Functions**: `noise(x, y)`, `simplex(x, y)`.\n* **Injected Context Variables**: `time`, `dt`, `x`, `y`, `w`, `h`, `mouse_x`, `mouse_y`, `scroll_x`, `scroll_y`, `drag_x`, `drag_y`, `index`, `total`.\n\n---\n\n## Timeline Orchestration & Keyframes\n\n### Keyframe Sequences with Bezier Handles\n```python\nDraw.motion(\n    ip=\"box\",\n    motion=[{\n        \"keyframes\": [\n            {\"time\": 0.0, \"value\": [0, 0], \"outgoing\": {\"x1\": 0.4, \"y1\": 0.0, \"x2\": 0.2, \"y2\": 1.0}},\n            {\"time\": 1.5, \"value\": [200, 50], \"incoming\": {\"x1\": 0.8, \"y1\": 0.0, \"x2\": 0.2, \"y2\": 1.0}},\n            {\"time\": 3.0, \"value\": [400, 0]},\n        ],\n        \"repeat\": True,\n    }]\n)\n```\n\n---\n\n## Interactive Triggers\n\nAttaching a `trigger` allows animations to interpolate smoothly upon interaction state changes:\n\n```python\n# Smooth 300ms hover lift and grow\nDraw.motion(\n    ip=\"hover_card\",\n    trigger=\"hover\",\n    motion=[\n        {\"type\": \"move\", \"from\": [0, 0], \"to\": [0, -10], \"duration\": 0.3, \"graph\": \"ease_out_quad\"},\n        {\"type\": \"scale\", \"from\": 1.0, \"to\": 1.05, \"duration\": 0.3, \"graph\": \"ease_out_quad\"},\n    ]\n)\n```\n\nSupported triggers: `\"hover\"`, `\"press\"`, `\"visible\"`, `\"drag\"`, `\"scroll\"`.\n\n---\n\n## Comprehensive Code Examples\n\n### 1. Interactive Spring Button with Release Kinetics\n```python\nimport Draw\n\nwin = Draw.window(title=\"Spring Motion Demo\", size=[800, 600])\n\nDraw.shape(\n    display=\"main\",\n    ip=\"spring_btn\",\n    vertices=4,\n    size=[160, 50],\n    align=\"center\",\n    color=\"#3b82f6\",\n    border_radius=12,\n)\n\nDraw.motion(\n    ip=\"spring_btn\",\n    trigger=\"hover\",\n    motion=[{\n        \"type\": \"spring\",\n        \"attribute\": \"scale\",\n        \"from\": 1.0,\n        \"to\": 1.12,\n        \"stiffness\": 400.0,\n        \"damping\": 18.0,\n    }]\n)\n```\n\n### 2. SVG Path Follower with Tangential Orientation\n```python\nDraw.shape(\n    display=\"main\",\n    ip=\"drone\",\n    vertices=3,\n    size=[30, 20],\n    color=\"yellow\",\n)\n\nDraw.motion(\n    ip=\"drone\",\n    motion=[{\n        \"attribute\": \"path\",\n        \"path\": \"M 100 250 C 200 100, 400 400, 500 250 S 700 100, 800 250\",\n        \"duration\": 5.0,\n        \"orient\": True,\n        \"orient_offset\": 90.0,\n        \"repeat\": True,\n        \"reverse\": True,\n        \"graph\": \"ease_in_out_cubic\",\n    }]\n)\n```\n\n### 3. Ballistic Projectile with Wall Reflection\n```python\nDraw.shape(\n    display=\"main\",\n    ip=\"cannon_ball\",\n    vertices=1, # Circle point\n    size=[24, 24],\n    color=\"crimson\",\n)\n\nDraw.motion(\n    ip=\"cannon_ball\",\n    motion=[{\n        \"type\": \"projectile\",\n        \"from\": [50, 450],\n        \"vx0\": 320.0,\n        \"vy0\": -550.0,\n        \"g\": 980.0,\n        \"drag\": 0.03,\n        \"restitution\": 0.8,\n        \"floor_y\": 500.0,\n        \"wall_x\": 700.0,\n    }]\n)\n```\n"

    "desc": "Topological dependency solver, parent-child scene constraints, container scoping, responsive breakpoints.",
    "content": "# Comprehensive Technical Documentation: `Draw._room` & `Draw._room_size` Modules\n\n---\n\n## 1. Executive Summary & Module Overview\n\n`Draw._room` (`_room.py`) and `Draw._room_size` (`_room_size.py`) form the **Relative Scene Layout & Geometry Resolution Engine** of the Draw framework. They allow developers to position, anchor, and dynamically size shapes, text blocks, UI panels, and point paths declaratively\u2014relative to the scene canvas, scoped container rectangles, or other placed objects\u2014without relying on hardcoded absolute coordinates.\n\n`Draw.room()` resolves object dependencies via a topological sort, computes exact floating-point geometry, handles nested containers, validates double-alignment conflicts, automatically manages Z-layering to eliminate Z-overlap bugs, and applies computed `(x, y, w, h, z)` coordinates directly onto live Qt rendering objects.\n\n---\n\n## 1.1 Developer Reflection & Experience Note: Recommended Architecture for Large Projects\n\n> [!IMPORTANT]\n> ### \ud83d\udca1 Developer Reflection & Experience Note\n> **Primary Recommendation for Large & Complex Applications:**\n> When building non-trivial applications, dashboards, or multi-panel design tools using the `Draw` framework, **always use `Draw.room` (`room.py`) as your primary scene layout engine**.\n>\n> **Lessons Learned & Best Practice:**\n> 1. **Avoid Manual Absolute `(x, y)` Pixel Math**: Relying solely on hardcoded absolute `(x, y)` coordinates across complex component hierarchies makes layouts brittle, difficult to refactor, prone to Z-flicker overlap bugs, and unresponsive to window resizing.\n> 2. **Leverage `Draw.room()` Dependency Graph**: `Draw.room` automates relative scene layout (`\"title\": [\"panel\", \"top\", \"inside\"]`), topological dependency resolution, container-scoped relative bounds (`container=\"panel_ip\"`), dynamic sizing (`sizes={\"width\": \"70%\"}`), and automatic Z-depth hierarchy (`z_step`).\n> 3. **Modular & Scalable Code**: Using `Draw.room()` keeps application logic clean, scalable, and publication-grade by declaring layout relationships instead of imperative pixel calculations.\n\n---\n\n## 2. Core Architecture & Layout Paradigms\n\n### 2.1 Supported Placement Forms\n\n`Draw.room()` parses five distinct placement forms inside the `scene={...}` dict:\n\n| Form | Example Syntax | Description |\n|---|---|---|\n| **Scene-Relative** | `\"title\": \"top\"` | Positions object relative to the canvas/container bounds using one of 9 anchors. |\n| **Object-Relative (Outside)** | `\"legend\": [\"graph\", \"right\"]` | Places object outside adjacent to parent edge with general padding. |\n| **Object-Relative (Inside)** | `\"header\": [\"panel\", \"top\", \"inside\"]` | Places object inside the parent box against specified edge. |\n| **Object-Relative with Gap** | `\"btn\": [\"panel\", \"bottom\", 15]` | Object-relative placement with custom pixel gap offset. |\n| **Absolute Coordinates** | `\"logo\": {\"x\": 20, \"y\": 30}` or `(20, 30)` | Hardcoded absolute coordinates. |\n\n---\n\n### 2.2 Z-Axis General Settings & Overlap Prevention\n\nTo solve Z-fighting and overlapping flickering where child text or shapes were hidden underneath parent background panels:\n\n```python\nDraw.room(\n    display=\"main\",\n    general={\n        \"padding\": 20,\n        \"z\": 10,       # Base Z-index for root objects\n        \"z_step\": 5    # Z-index increment per dependency depth level\n    },\n    scene={\n        \"card\": \"center\",\n        \"avatar\": [\"card\", \"top-left\", \"inside\"],\n        \"title\": [\"avatar\", \"right\", \"inside\"],\n    }\n)\n```\n- **Topological Z-Ordering**: `Draw.room()` automatically assigns Z-indices in topological parent-to-child order (`card.z = 10`, `avatar.z = 15`, `title.z = 20`).\n- **Eliminates Overlaps**: Guarantees children render on top of parent boxes, completely resolving Z-axis overlapping bugs framework-wide.\n\n---\n\n### 2.3 Scoped Containers (`container=`)\n\n```python\nDraw.room(\n    display=\"main\",\n    container=\"card_panel\",\n    scene={\n        \"avatar\": \"top-left\",\n        \"name\":   [\"avatar\", \"right\", \"inside\"],\n    }\n)\n```\n- When `container=\"card_panel\"` is passed, `Draw.room()` resolves all anchors and percentage sizes against `card_panel`'s bounds instead of the entire window canvas.\n- Transformed coordinates are mapped back to window-absolute space when applied.\n\n---\n\n### 2.4 Topological Sort & Cycle Detection\n\n1. **Dependency Graph**: Builds a directed graph where object-relative entries depend on their parent IDs.\n2. **Cycle Prevention**: Performs DFS cycle detection. If a circular reference is detected (e.g. `A -> B -> A`), raises a descriptive `RoomLayoutError`.\n3. **Order of Execution**:\n   - Resolves all scene-relative and absolute entries first.\n   - Resolves object-relative entries in topological dependency order.\n   - Executes dynamic size pass (`sizes=`, `fit_cell`, percentage scaling).\n   - Writes computed coordinates and Z-indices to live objects and triggers canvas repaints.\n\n---\n\n### 2.5 Animated Layout Transitions (`general={\"animate\": True}`)\n\n```python\nDraw.room(\n    display=\"main\",\n    general={\n        \"animate\": True,\n        \"duration\": 0.4,\n        \"ease\": \"ease_out\"\n    },\n    scene={ ... }\n)\n```\n- Instead of snapping instantly, objects smoothly interpolate to their new layout positions using `Draw.motion`.\n\n---\n\n### 2.6 Declarative Responsive Breakpoints (`Draw.room.responsive`)\n\n```python\nDraw.room.responsive(\n    display=\"main\",\n    breakpoints={\n        \"< 600\": {\n            \"scene\": {\"card\": \"center\", \"title\": [\"card\", \"top\", \"inside\"]}\n        },\n        \">= 600\": {\n            \"scene\": {\"card\": \"center\", \"title\": [\"card\", \"top-left\", \"inside\"]}\n        }\n    }\n)\n```\n- Automatically re-evaluates layout scenes whenever window dimensions cross width thresholds during window resize events.\n- Direct callback binding on `win._draw_on_resize` prevents handler closure stack accumulation on repeated calls.\n\n---\n\n## 3. Dynamic Sizing System (`Draw._room_size`)\n\n`Draw.room` integrates with `Draw._room_size` to handle dynamic responsive sizing via `sizes={...}` or inline placement specs:\n\n- **Keywords**: `\"fit\"`, `\"fill\"`, `\"half\"`, `\"auto\"`, `\"fit_width\"`, `\"fit_height\"`, `\"square\"`, `\"double\"`, `\"third\"`, `\"quarter\"`.\n- **Percentage Strings**: `\"50%\"`, `\"100%\"`.\n- **Reference Arithmetic**: `\"parent-40\"`, `\"panel.width/2\"`, `[\"panel\", \"*1.5\"]`.\n- **Aspect Ratio**: `{\"aspect\": \"16:9\"}` or `{\"ratio\": 1.777}` (with zero-denominator validation).\n- **Auto-Scaling**: `{\"scale\": \"fit\"}` / `{\"scale\": \"cover\"}` / `{\"scale\": \"contain\"}` (CSS object-fit aspect ratio scaling).\n- **Match Size**: `{\"match\": \"largest\", \"of\": [\"a\", \"b\", \"c\"]}`.\n- **Fit Grid Cell**: `{\"fit_cell\": True}` pins object to its layout grid cell.\n\n---\n\n## 4. Text In-Box Alignment Modifiers (`align_text`, `valign`)\n\nWhen placing text inside parent bounding boxes:\n```python\n\"label\": [\"sidebar\", \"left\", \"inside\", {\"align_text\": \"left\", \"valign\": \"middle\"}]\n```\n- `align_text`: `\"left\"`, `\"center\"`, `\"right\"`.\n- `valign`: `\"top\"`, `\"middle\"`, `\"bottom\"`.\n\n---\n\n## 5. Usage Example\n\n```python\nimport Draw\n\nDraw.window(tag=\"dashboard\", title=\"Relative Room Layout Demo\", width=900, height=600)\n\n# Create live UI components\nDraw.shapes(tag=\"dashboard\", customise={\"ip\": \"main_panel\", \"vertices\": 4, \"size\": [600, 400]})\nDraw.text(tag=\"dashboard\", text=\"Dashboard Title\", ip=\"title_text\")\nDraw.text(tag=\"dashboard\", text=\"Sidebar Navigation\", ip=\"sidebar_text\")\n\n# Execute declarative room layout with Z-layering and sizing\nDraw.room(\n    display=\"dashboard\",\n    general={\"padding\": 20, \"z\": 10, \"z_step\": 5},\n    sizes={\n        \"main_panel\": {\"width\": \"70%\", \"height\": \"80%\"},\n        \"sidebar_text\": {\"width\": \"parent/3\"}\n    },\n    scene={\n        \"main_panel\": \"center\",\n        \"title_text\": [\"main_panel\", \"top\", \"inside\"],\n        \"sidebar_text\": [\"main_panel\", \"left\", \"inside\", {\"align_text\": \"left\"}]\n    }\n)\n\nDraw.window.run(\"dashboard\")\n```\n\n---\n\n## 6. Technical Specifications & Error Handling\n\n- **Error Types**: `RoomLayoutError` and `RoomSizeError` (subclasses of `ValueError`).\n- **Safety**: Safe division by zero error handling in math size expressions and aspect ratio denominator parsing.\n- **Precision**: 64-bit floating point calculations throughout geometry pipelines.\n- **Canvas Repaint**: Automatically sets `_occupied_dirty = True` and triggers `canvas.update()`.\n"

    "content": "# Comprehensive Technical Documentation: `Draw._window` Module\n\n---\n\n## 1. Executive Summary & Module Overview\n\n`Draw._window` (`Draw.window`) is the window lifecycle, creation, and orchestration module for the **Draw** framework. It wraps PySide6 (`QMainWindow`, `QApplication`, `QTimer`, `QColor`, `QIcon`, `QMenuBar`, `QStatusBar`, `QAction`) to provide a simplified, tag-based, declarative API for desktop window management.\n\nInstead of requiring developers to manually manage Qt object trees, event loops, layout hierarchy, and signal/slot connections, `_window.py` exposes a unified registry singleton `Draw.window` that allows creating, showing, hiding, positioning, styling with traditional CSS/QSS strings, and destroying application windows using string identifiers (tags).\n\n---\n\n## 2. Core Architecture & Code Breakdown\n\n### 2.1 Imports, Constants & Dependencies\n\n```python\nfrom typing import Callable, Optional, Tuple, Union\nfrom PySide6.QtCore import Qt, QTimer, QPoint, QObject, Signal, Slot\nfrom PySide6.QtGui import QColor, QCloseEvent, QIcon, QMouseEvent, QResizeEvent, QMoveEvent, QAction\nfrom PySide6.QtWidgets import QApplication, QMainWindow, QMenuBar, QStatusBar, QMenu\nfrom Draw._app import get_app\nfrom Draw._colour import _parse_color, _NAMED_COLORS\nfrom Draw._align import _ALIGN_PRESETS as _ALIGN_VALUES\n```\n\n- **PySide6 Bindings**: Imports Qt primitives for window creation, styling, and event interception.\n- **Singleton App Access**: Calls `get_app()` from `Draw._app` to lazily construct or retrieve the global `QApplication` instance.\n- **Color Re-export**: Re-exports `_parse_color` and `_NAMED_COLORS` for backward compatibility.\n- **Alignment Presets**: 9 canonical alignment presets (`center`, `top`, `bottom`, `left`, `right`, `top-left`, `top-right`, `bottom-left`, `bottom-right`).\n\n---\n\n### 2.2 Subclassed Window: `_ManagedWindow`\n\n```python\nclass _ManagedWindow(QMainWindow):\n    \"\"\"\n    QMainWindow that tells the registry when Qt actually closes it, supports\n    frameless dragging, and dispatches window event callbacks.\n    \"\"\"\n```\n\n- **Registry Synchronization**: `closeEvent` intercepts window closure and triggers user-defined `on_close` callbacks. If `on_close` returns `False`, the close event is ignored (`event.ignore()`). Otherwise, it executes `_draw_on_closed(tag)` (`_WindowRegistry._forget`), removing the window tag and cleaning up connectors and canvases.\n- **Event Dispatching**:\n  - `resizeEvent`: Dispatches `on_resize(width, height)`.\n  - `moveEvent`: Dispatches `on_move(x, y)`.\n  - `changeEvent`: Dispatches `on_focus(is_active)` on window activation changes.\n- **Keyboard Shortcuts**: Built-in `Escape` and `Ctrl+Q` keyboard handlers that cleanly close the window.\n- **Frameless Window Dragging**:\n  - `mousePressEvent`: Captures mouse click offset on frameless windows.\n  - `mouseMoveEvent`: Smoothly repositions window as user drags mouse.\n  - `mouseReleaseEvent`: Clears drag state.\n\n---\n\n### 2.3 Positioning & Geometry Engine: `_apply_align`\n\nCalculates target `(x, y)` position based on screen available geometry (`sw, sh`), offset (`cx, cy`), and window dimensions (`w, h`) using `Draw._align.calculate_alignment_pos`:\n- `center`: `(cx + (sw - w) // 2, cy + (sh - h) // 2)`\n- `top`, `bottom`, `left`, `right`, `top-left`, `top-right`, `bottom-left`, `bottom-right`.\n\n---\n\n### 2.4 Live Dynamic Background Color Engine\n\n- **60 FPS Polling**: Polled every 16ms via `QTimer` parented to the window (`_start_dynamic_bg_timer`).\n- **Performance Optimization**: Resolves `Draw.color(ip=...)` via `_bridge` and skips palette updating/repainting if the resolved RGBA color has not changed since the last tick (`no-op`).\n\n---\n\n### 2.5 Thread-Safe Shutdown Dispatcher: `_ShutdownDispatcher`\n\nRoutes emergency shutdown requests (e.g. from background worker threads or `Draw.debug`'s watchdog thread) safely onto the Qt GUI thread via queued signal/slot connections (`_fire.connect(..., Qt.ConnectionType.QueuedConnection)`).\n\n---\n\n### 2.6 Window Registry Singleton: `_WindowRegistry`\n\nThe primary class that powers `Draw.window`.\n\n#### Creation Signature & Parameters: `__call__(...)`\n\n```python\nDraw.window(\n    tag: str = \"main\",\n    title: str = \"\",\n    width: int = 800,\n    height: int = 600,\n    x: Optional[int] = None,\n    y: Optional[int] = None,\n    align: Optional[str] = None,\n    background_color: Union[str, Tuple[int, int, int], QColor] = \"white\",\n    transparency: int = 100,\n    frameless: bool = False,\n    always_on_top: bool = False,\n    resizable: bool = True,\n    min_width: Optional[int] = None,\n    min_height: Optional[int] = None,\n    max_width: Optional[int] = None,\n    max_height: Optional[int] = None,\n    ip: Optional[str] = None,\n    # \u2500\u2500 Traditional CSS & Professional Features \u2500\u2500\n    style: Optional[str] = None,\n    css: Optional[str] = None,\n    icon: Optional[str] = None,\n    modal: Union[bool, str] = False,\n    screen: Optional[Union[int, str]] = None,\n    draggable: bool = True,\n    on_resize: Optional[Callable[[int, int], None]] = None,\n    on_move: Optional[Callable[[int, int], None]] = None,\n    on_focus: Optional[Callable[[bool], None]] = None,\n    on_close: Optional[Callable[[], bool]] = None,\n) -> QMainWindow\n```\n\n##### Parameter Reference:\n- `tag`: Unique window string identifier (default `\"main\"`). Required.\n- `title`: Window title-bar text.\n- `width` / `height`: Window size in pixels (default `800x600`).\n- `x` / `y`: Absolute screen pixel position (ignored when `align` is set).\n- `align`: 9-point screen alignment string (`\"center\"`, `\"top-left\"`, `\"bottom-right\"`, etc.).\n- `background_color`: Named color, HEX string, RGB/RGBA tuple, or `QColor` (default `\"white\"`).\n- `transparency`: Window opacity from `0` (invisible) to `100` (opaque).\n- `frameless`: Removes OS window border/title bar.\n- `always_on_top`: Keeps window pinned above all other desktop windows.\n- `resizable`: If `False`, sets fixed window dimensions.\n- `min_width` / `min_height` / `max_width` / `max_height`: Sizing constraints.\n- `ip`: Dynamic background color IP binding tag evaluated via `Draw.color()`.\n- `style` / `css`: Direct text-based CSS / QSS styling string (e.g. `style=\"QMainWindow { background-color: #1e1e2e; color: #ffffff; }\"`).\n- `icon`: File path to the window icon (`win.setWindowIcon(QIcon(path))`).\n- `modal`: Window modality flag (`True`, `\"application\"`, or `\"window\"`).\n- `screen`: Screen index (`int`) or screen name (`str`) to target specific monitors.\n- `draggable`: When `frameless=True`, enables mouse dragging to reposition the window.\n- `on_resize`: Event callback function `(width, height) -> None`.\n- `on_move`: Event callback function `(x, y) -> None`.\n- `on_focus`: Event callback function `(is_active: bool) -> None`.\n- `on_close`: Event callback function `() -> bool`. Returning `False` cancels window closing.\n\n---\n\n#### Methods on `Draw.window`\n\n##### Traditional CSS Styling\n```python\nDraw.window.set_style(tag: str, css: str) -> None\nDraw.window.set_css(tag: str, css: str) -> None\n```\nApplies direct text-based CSS / QSS stylesheets to a target window dynamically.\n\nExample:\n```python\nDraw.window.set_style(\"main\", \"\"\"\n    QMainWindow {\n        background-color: #121212;\n        border: 2px solid #333333;\n    }\n\"\"\")\n```\n\n##### Window State Controls\n```python\nDraw.window.maximize(tag: str = \"main\") -> None\nDraw.window.minimize(tag: str = \"main\") -> None\nDraw.window.fullscreen(tag: str = \"main\") -> None\nDraw.window.restore(tag: str = \"main\") -> None\n\nDraw.window.is_maximized(tag: str = \"main\") -> bool\nDraw.window.is_minimized(tag: str = \"main\") -> bool\nDraw.window.is_fullscreen(tag: str = \"main\") -> bool\n```\n\n##### Declarative Menu Bar & Status Bar Builders\n```python\nDraw.window.set_menu(tag: str, schema: list[dict]) -> QMenuBar\nDraw.window.set_status(tag: str, message: str, timeout: int = 0) -> None\n```\n\nExample Menu Schema:\n```python\nDraw.window.set_menu(\"main\", [\n    {\n        \"File\": [\n            (\"New Document\", on_new_file),\n            (\"Open\", on_open_file),\n            \"---\",  # Separator line\n            (\"Exit\", Draw.quit)\n        ]\n    },\n    {\n        \"View\": [\n            (\"Maximize\", lambda: Draw.window.maximize(\"main\")),\n            (\"Restore\", lambda: Draw.window.restore(\"main\"))\n        ]\n    }\n])\n```\n\n##### Transparency & Icon Setters\n```python\nDraw.window.set_transparency(tag: str, transparency: int) -> None  # 0 to 100\nDraw.window.set_icon(tag: str, icon_path: str) -> None\n```\n\n##### Core Window Lifecycle Methods\n```python\nDraw.window.show(tag: str) -> None\nDraw.window.hide(tag: str) -> None\nDraw.window.close(tag: str) -> bool\nDraw.window.close_all() -> None\nDraw.window.request_shutdown(reason: str = \"\") -> None  # Thread-safe emergency shutdown\nDraw.window.quit() -> None\nDraw.window.get(tag: str) -> QMainWindow\nDraw.window.get_canvas(tag: str) -> _DrawCanvas\nDraw.window.run(tag: Optional[str] = None) -> int\nDraw.window.list_tags() -> list[str]\nDraw.window.list_all_tags() -> list[str]\n```\n\n---\n\n## 3. Updated Capabilities Feature Matrix\n\n| Feature | Supported in `Draw._window` | Implementation Detail |\n|---|:---:|---|\n| **Tag-based Window Registry** | Yes | Dictionary key lookup (`self._windows[tag]`) |\n| **Traditional CSS Text Styling** | Yes | `style` / `css` param + `set_style()` / `set_css()` |\n| **Window State (Max/Min/Fullscreen/Restore)** | Yes | `maximize()`, `minimize()`, `fullscreen()`, `restore()` |\n| **Window State Queries** | Yes | `is_maximized()`, `is_minimized()`, `is_fullscreen()` |\n| **Title & Size Initializers** | Yes | `setWindowTitle()`, `resize()`, `setFixedSize()` |\n| **Min/Max Size Constraints** | Yes | `setMinimumSize()`, `setMaximumSize()` |\n| **Screen Positioning & Alignments**| Yes | 9 alignment positions (`center`, `top-right`, etc.) |\n| **Multi-Monitor Targeting** | Yes | `screen=0` or `screen=\"Display 2\"` targeting |\n| **Frameless Window Support** | Yes | `Qt.WindowType.FramelessWindowHint` |\n| **Interactive Frameless Dragging** | Yes | Built-in mouse press/move drag handler |\n| **Always-on-Top Window Support** | Yes | `Qt.WindowType.WindowStaysOnTopHint` |\n| **Window Modality (Dialogs / Popups)** | Yes | `modal=True` / `\"application\"` / `\"window\"` |\n| **Window Icon Support** | Yes | `icon=\"path/to/icon.ico\"` + `set_icon()` |\n| **Declarative Native Menu Bar** | Yes | `set_menu(\"main\", schema=[...])` |\n| **Status Bar Support** | Yes | `set_status(\"main\", \"Message\", timeout)` |\n| **Event Callbacks (Resize, Move, Focus, Close)** | Yes | `on_resize`, `on_move`, `on_focus`, `on_close` |\n| **Cancelable Close Events** | Yes | `on_close` returning `False` cancels event |\n| **Window Opacity / Transparency** | Yes | `transparency` param + `set_transparency()` |\n| **Static & Dynamic Background Color** | Yes | QPalette + 60fps bridge polling timer |\n| **Thread-Safe Shutdown Dispatch** | Yes | `request_shutdown()` via queued signal/slot |\n| **Safe Close & Cleanup Sync** | Yes | Overridden `closeEvent` + `WA_DeleteOnClose` |\n| **Event Loop Orchestration** | Yes | `app.exec()` returning integer exit code |\n\n---\n\n## 4. Usage Code Examples\n\n### 4.1 Professional Window with Direct Text CSS Styling & Menu Bar\n\n```python\nimport Draw\n\ndef on_window_resize(width, height):\n    print(f\"Window resized to {width}x{height}\")\n\n# 1. Create Window with CSS styling and event callbacks\nDraw.window(\n    tag=\"main\",\n    title=\"Professional Dark App\",\n    width=1024,\n    height=728,\n    align=\"center\",\n    style=\"\"\"\n        QMainWindow {\n            background-color: #1e1e2e;\n            color: #cdd6f4;\n            font-family: 'Segoe UI', sans-serif;\n        }\n        QMenuBar {\n            background-color: #181825;\n            color: #cdd6f4;\n        }\n        QMenuBar::item:selected {\n            background-color: #313244;\n        }\n        QStatusBar {\n            background-color: #181825;\n            color: #a6adc8;\n        }\n    \"\"\",\n    on_resize=on_window_resize,\n    on_close=lambda: print(\"User requested app exit...\") or True\n)\n\n# 2. Build Menu Bar Declaratively\nDraw.window.set_menu(\"main\", [\n    {\n        \"File\": [\n            (\"New Project\", lambda: print(\"New project clicked\")),\n            \"---\",\n            (\"Exit Application\", Draw.quit)\n        ]\n    },\n    {\n        \"View\": [\n            (\"Maximize\", lambda: Draw.window.maximize(\"main\")),\n            (\"Restore\", lambda: Draw.window.restore(\"main\")),\n            (\"Full Screen\", lambda: Draw.window.fullscreen(\"main\"))\n        ]\n    }\n])\n\n# 3. Set Status Message\nDraw.window.set_status(\"main\", \"Application Ready\", timeout=5000)\n\n# 4. Run Application\nDraw.window.run(\"main\")\n```\n"

    "content": "# Comprehensive Technical Documentation: `Draw._connectors` Module\n\n`Draw._connectors` (`Draw.connectors`) is the joint physics, data-wiring, and thread-safe event-link engine of the **Draw** framework. It enables dynamic physical relationships (pendulums, springs, pins, ropes, orbits, magnets, distance locks, and property synchronizations) and thread-safe event-driven payload delivery between UI elements.\n\n---\n\n## Table of Contents\n1. [Overview & Core Architecture](#overview--core-architecture)\n2. [Public API & Registry Reference](#public-api--registry-reference)\n   - [`Draw.connectors(...)` (`_ConnectorRegistry`)](#drawconnectors-_connectorregistry)\n   - [Shape Drag Lock Management (`lock`, `unlock`, `is_locked`)](#shape-drag-lock-management)\n   - [Connector Query, Activation & Lifecycle Methods](#connector-query-activation--lifecycle-methods)\n3. [Joint & Physical Link Types (9 Models)](#joint--physical-link-types-9-models)\n4. [Anchor Points](#anchor-points)\n5. [Interactive Dragging & Re-baselining](#interactive-dragging--re-baselining)\n6. [Thread Safety & GUI Dispatcher](#thread-safety--gui-dispatcher)\n7. [Connector Groups & Bulk Pause/Resume](#connector-groups--bulk-pauseresume)\n8. [Window Cleanup & Lifecycle Integration](#window-cleanup--lifecycle-integration)\n9. [Comprehensive Code Examples](#comprehensive-code-examples)\n\n---\n\n## Overview & Core Architecture\n\n`Draw.connectors` operates via a background ticker thread running at 60 FPS (16ms interval). To maintain UI responsiveness and guarantee thread safety with PySide6:\n- The background thread calculates continuous differential joint physics, evaluates callable predicates, and checks spatial proximity between shapes.\n- Position writes, style changes, and user `work` callbacks are safely queued and marshaled onto the Qt main GUI thread via `_GUIDispatcher`.\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                 Background Ticker Loop                   \u2502\n\u2502 - Evaluates senses & proximity                           \u2502\n\u2502 - Solves 9 joint physics types at 60 FPS                 \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                            \u2502 Queued Signal (Thread-Safe)\n                            \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                     _GUIDispatcher                       \u2502\n\u2502 - Dispatches work callbacks & joint solvers on Qt Main    \u2502\n\u2502 - Updates ShapeDef positions & triggers canvas repaints  \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n## Public API & Registry Reference\n\n### `Draw.connectors(...)` (`_ConnectorRegistry`)\n\nDefines a physical joint relationship, data connection, or event trigger link between UI elements:\n\n```python\n# Preferred keyword syntax:\nrecord = Draw.connectors(\n    from_ip      = \"anchor_pivot\",   # Source shape IP (or ip=...)\n    to_ip        = \"swinging_bob\",   # Target shape IP\n    link         = \"pendulum\",       # Physics joint type\n    anchor       = \"center\",         # Anchor point on from_ip\n    length       = 180.0,            # Pendulum arm length\n    angle        = 45.0,             # Initial displacement angle in degrees\n    gravity      = 980.0,            # Gravitational acceleration\n    damping      = 0.05,             # Angular friction damping\n    draggable    = True,             # User can drag the target shape; physics re-baselines on release\n    group        = \"simulation\",     # Optional group tag for batch pause/resume\n    sense        = None,             # Optional SenseRecord to trigger callback\n    work         = None,             # Optional callback function: fn(record)\n    payload      = {},               # Custom metadata dictionary\n)\n```\n\n#### Spec Format Aliases\nYou can also supply connection parameters using positional tuples/lists:\n```python\n# [from_ip, sense, to_ip, work_callback, payload_dict]\nDraw.connectors([\"btn_submit\", sense_click, \"status_label\", on_submit_callback])\n```\n\n---\n\n### Shape Drag Lock Management\n\n`Draw.connectors` provides global shape drag-lock management. By default, shapes are **locked (`is_locked=True`)** to prevent accidental movement when clicked:\n\n```python\n# Lock / Unlock functions\nDraw.connectors.lock(\"shape_ip\")       # Locks shape from being dragged\nDraw.connectors.unlock(\"shape_ip\")     # Unlocks shape to allow dragging\nis_locked = Draw.connectors.is_locked(\"shape_ip\")  # Returns True if locked (default True)\n\n# Inline locking via connectors call:\nDraw.connectors(ip=\"shape_ip\", locked=True)\nDraw.connectors(ip=\"shape_ip\", draggable=True)  # Automatically unlocks shape\n```\n\n---\n\n### Connector Query, Activation & Lifecycle Methods\n\n* **`Draw.connectors.get(id: object) -> Optional[ConnectorRecord]`**: Retrieves a connector record by its ID.\n* **`Draw.connectors.list() -> List[Dict[str, Any]]`**: Returns serialized dictionaries of all registered connectors.\n* **`Draw.connectors.set_active(id: object, active: bool) -> None`**: Enables or disables a specific connector.\n* **`Draw.connectors.clear(id: Optional[object] = None) -> None`**: Removes a specific connector, or flushes all when `id=None`.\n* **`Draw.connectors.stop_ticker() -> None`**: Shuts down the background physics ticker thread cleanly.\n\n---\n\n## Joint & Physical Link Types (9 Models)\n\n| Link Type | Description | Key Parameters |\n| :--- | :--- | :--- |\n| `\"pin\"` | Rigid attachment. `to_ip` remains fixed to an anchor point on `from_ip`. Supports rotation tracking (`rotate_with=True`). | `anchor`, `offset_x`, `offset_y`, `rotate_with` |\n| `\"pendulum\"` | `to_ip` swings smoothly as a gravity pendulum with angular damping. | `length`, `gravity`, `damping`, `angle` |\n| `\"spring\"` | `to_ip` is pulled toward `from_ip` via 2nd-order damped Hooke's Law spring physics. | `stiffness`, `damping`, `mass`, `rest_length` |\n| `\"rope\"` | Distance-capped hanging rope constraint with gravity, tautness, and loose slack. | `length`, `gravity`, `damping` |\n| `\"orbit\"` | `to_ip` orbits continuously around `from_ip` at a fixed radius and angular velocity. | `radius`, `speed` (deg/s), `angle` |\n| `\"benzene\"` | `to_ip` orbits `from_ip` along a 6-sided hexagonal perimeter. | `radius`, `speed` (deg/s), `angle` |\n| `\"magnet\"` | `to_ip` is magnetically pulled toward `from_ip` with distance attenuation. | `strength`, `max_speed`, `damping` |\n| `\"distance_lock\"` | Enforces a rigid distance constraint between `from_ip` and `to_ip`. | `length`, `anchor` |\n| `\"sync\"` | Mirrors properties (`position`, `color`, `opacity`, `size`, `rotation`) from `from_ip` to `to_ip`. | `properties`, `offset_x`, `offset_y` |\n\n---\n\n## Anchor Points\n\nAnchor points determine the geometric attachment coordinate on `from_ip`:\n* `\"center\"`\n* `\"top\"`, `\"bottom\"`, `\"left\"`, `\"right\"`\n* `\"top-left\"`, `\"top-right\"`, `\"bottom-left\"`, `\"bottom-right\"`\n\n---\n\n## Interactive Dragging & Re-baselining\n\nWhen `draggable=True` (or `grab=True`) is set:\n1. While the user clicks and drags `to_ip`, the joint solver yields control to the mouse cursor.\n2. Upon mouse release, `_reinit_joint_after_drag` recalculates joint state (such as pendulum swing angle, spring velocity, orbit radius, or pin offset) relative to the drop coordinate, preventing jarring snapping artifacts or physics divergence.\n\n---\n\n## Thread Safety & GUI Dispatcher\n\nThe connector engine guarantees thread safety via `_GUIDispatcher`:\n```python\nclass _GUIDispatcher(QObject):\n    _fire: Signal = Signal(object, object)\n```\n- Joint solvers and user callbacks run strictly inside Qt's event loop on the main GUI thread via queued signals (`Qt.ConnectionType.QueuedConnection`).\n- Thread locks (`self._lock`) protect registry mutations against concurrency races.\n\n---\n\n## Connector Groups & Bulk Pause/Resume\n\nTagging connectors with a `group` string allows pausing and resuming entire simulation subsystems:\n\n```python\n# Pause all physics joints in the \"sim\" group\nDraw.connectors.pause_group(\"sim\")\n\n# Resume physics simulation\nDraw.connectors.resume_group(\"sim\")\n```\n\n---\n\n## Window Cleanup & Lifecycle Integration\n\nWhen a display window closes, `Draw.window` automatically triggers:\n```python\nDraw.connectors.cleanup_window(window_tag, shape_ips)\n```\nThis removes connector records whose shapes have been destroyed and resets ticker window bindings.\n\n---\n\n## Comprehensive Code Examples\n\n### 1. Interactive Pendulum with Toss Kinematics\n```python\nimport Draw\n\nwin = Draw.window(title=\"Pendulum Simulation\", size=[800, 600])\n\n# Anchor Pivot\nDraw.shape(\n    display=\"main\",\n    ip=\"pivot\",\n    vertices=4,\n    size=[20, 20],\n    x=400, y=100,\n    color=\"gray\",\n)\n\n# Swinging Bob\nDraw.shape(\n    display=\"main\",\n    ip=\"bob\",\n    vertices=1, # Circle point\n    size=[40, 40],\n    color=\"#38bdf8\",\n)\n\n# Physical Pendulum Joint\nDraw.connectors(\n    from_ip=\"pivot\",\n    to_ip=\"bob\",\n    link=\"pendulum\",\n    length=220.0,\n    angle=60.0,\n    gravity=980.0,\n    damping=0.04,\n    draggable=True, # Allows user to pick up and toss the bob\n)\n\nDraw.window.run(\"main\")\n```\n\n### 2. Spring Follower with Dynamic Offset\n```python\nDraw.connectors(\n    from_ip=\"leader_card\",\n    to_ip=\"follower_badge\",\n    link=\"spring\",\n    stiffness=350.0,\n    damping=22.0,\n    mass=1.0,\n    rest_length=50.0,\n    draggable=True,\n)\n```\n"
  },

    "content": "# Comprehensive Technical Documentation: `Draw._senses` Module\n\n`Draw._senses` (`Draw.senses`) is the event, gesture, spatial proximity, and predicate evaluation engine of the **Draw** framework. It translates mouse actions, keyboard shortcuts, multi-touch gestures, focus state changes, geometric collisions, and custom callable functions into unified, debounced trigger records for interactive UI components.\n\n---\n\n## Table of Contents\n1. [Overview & Core Architecture](#overview--core-architecture)\n2. [Public API & Registry Reference](#public-api--registry-reference)\n   - [`Draw.senses(...)` (`_SenseRegistry`)](#drawsenses-_senseregistry)\n   - [Registry Methods on `Draw.senses`](#registry-methods-on-drawsenses)\n3. [Comprehensive Sense Types & Aliases](#comprehensive-sense-types--aliases)\n   - [Mouse & Gesture Senses](#mouse--gesture-senses)\n   - [Touch Senses](#touch-senses)\n   - [Focus & Keyboard Senses](#focus--keyboard-senses)\n   - [Spatial & Collision Senses](#spatial--collision-senses)\n   - [Callable Predicate Senses](#callable-predicate-senses)\n4. [Canvas Region Drag Selection & Pixel Capture](#canvas-region-drag-selection--pixel-capture)\n5. [Automatic Cursor Shape Management (`mouse_type`)](#automatic-cursor-shape-management-mouse_type)\n6. [Debounce, State Tracking & In-Place Drag Locking](#debounce-state-tracking--in-place-drag-locking)\n7. [Comprehensive Code Examples](#comprehensive-code-examples)\n\n---\n\n## Overview & Core Architecture\n\n`Draw.senses` routes platform input events into index-accelerated `SenseRecord` objects:\n- `_ip_index`: Maps shape IP tags for $O(1)$ lookup and event dispatch on pointer interactions.\n- `_type_index`: Groups senses by category for $O(1)$ background polling of continuous proximity and callable conditions.\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                   Qt Event / Gesture                     \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                            \u2502 Normalizes into\n                            \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                        InputEvent                        \u2502\n\u2502      (kind, ip, button, x, y, key, modifiers, meta)      \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                            \u2502 Dispatches via O(1) index\n                            \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                       SenseRecord                        \u2502\n\u2502   - Debounce calculation (time / count tracking)         \u2502\n\u2502   - Context menu payload metadata                        \u2502\n\u2502   - Automatic Cursor Management                          \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n## Public API & Registry Reference\n\n### `Draw.senses(...)` (`_SenseRegistry`)\n\nRegisters a sense condition on a specific shape IP or globally:\n\n```python\nsense = Draw.senses(\n    expression = \"click\",          # Sense type string, callable lambda, or boolean\n    ip         = \"submit_btn\",     # Target shape IP tag\n    key        = [\"return\", \"a\"],  # Keyboard key filter (for key senses)\n    active     = False,            # Initial active state\n    debounce   = 200,              # Minimum trigger interval (ms if >2.0, else seconds)\n    mouse_type = \"pointer\",        # Automatic hover cursor shape\n    target     = \"target_shape\",   # Secondary shape for proximity/overlap senses\n    threshold  = 50.0,             # Distance threshold in pixels for proximity\n)\n```\n\n---\n\n### Registry Methods on `Draw.senses`\n\n* **`Draw.senses.get(id: object) -> Optional[SenseRecord]`**: Retrieves a sense record by its unique ID.\n* **`Draw.senses.get_by_ip(ip: str) -> List[SenseRecord]`**: Returns all senses attached to a specific shape IP.\n* **`Draw.senses.get_by_type(sense_type: str) -> List[SenseRecord]`**: Returns all senses registered under a specific sense type.\n* **`Draw.senses.list() -> List[Dict[str, Any]]`**: Returns serialized dictionaries of all active senses.\n* **`Draw.senses.clear(id: Optional[object] = None) -> None`**: Clears a specific sense, or flushes all when `id=None`.\n* **`Draw.senses.get_menu(ip: str) -> List[Dict[str, Any]]`**: Retrieves the context menu schema registered for a shape IP.\n\n---\n\n## Comprehensive Sense Types & Aliases\n\n### Mouse & Gesture Senses\n* `\"click\"`, `\"mouse_click\"`, `\"leftclick\"`, `\"rightclick\"`\n* `\"doubleclick\"`, `\"mouse_doubleclick\"`, `\"leftdoubleclick\"`, `\"rightdoubleclick\"`, `\"middledoubleclick\"`\n* `\"hover\"`, `\"mouse_hover\"`, `\"leave\"`, `\"mouse_leave\"`\n* `\"press\"`, `\"mouse_press\"`, `\"release\"`, `\"mouse_release\"`\n* `\"scroll_up\"`, `\"mouse_scroll_up\"`, `\"scroll_down\"`, `\"mouse_scroll_down\"`\n* `\"drag_start\"`, `\"drag_move\"`, `\"drag_end\"`\n* `\"longpress\"`, `\"hold\"`, `\"mouse_longpress\"`\n* `\"context_menu\"`, `\"contextmenu\"`\n\n### Touch Senses\n* `\"touch_start\"`, `\"touchstart\"`\n* `\"touch_move\"`, `\"touchmove\"`\n* `\"touch_end\"`, `\"touchend\"`\n\n### Focus & Keyboard Senses\n* `\"focus_in\"`, `\"focus\"`, `\"focusin\"`\n* `\"focus_out\"`, `\"blur\"`, `\"focusout\"`\n* `\"key_press\"`, `\"key_release\"`: Filters by `key=[\"space\", \"return\"]` and `modifier=\"ctrl\"` (`\"ctrl\"`, `\"shift\"`, `\"alt\"`, `\"meta\"`).\n\n### Spatial & Collision Senses\n* **`\"proximity\"` / `\"near\"`**: Triggers when Euclidean distance between shape centers is $\\le \\text{threshold}$ pixels.\n* **`\"overlap\"` / `\"collide\"`**: Triggers when the bounding boxes of `ip` and `target` intersect.\n* **`\"distance\"`**: Continuously updates `record.meta[\"distance\"]` with the current distance between shapes.\n\n### Callable Predicate Senses\nCustom lambdas or functions evaluated automatically on every ticker frame:\n```python\nDraw.senses(lambda: player.health <= 0, id=\"game_over\")\n```\n\n---\n\n## Canvas Region Drag Selection & Pixel Capture\n\nGlobal canvas selection tools independent of individual shapes:\n\n### `Draw.senses.first_click(display=None) -> Optional[Tuple[float, float]]`\nReturns `(x, y)` coordinate of the latest left-click mouse press.\n\n### `Draw.senses.last_release(display=None) -> Optional[Tuple[float, float]]`\nReturns `(x, y)` coordinate of the latest left-click mouse release.\n\n### `Draw.senses.region(display=None) -> Optional[Dict[str, Any]]`\nReturns the bounding box spanned by the latest press $\\to$ release drag:\n```python\n{\"start\": (x0, y0), \"end\": (x1, y1), \"rect\": (x, y, w, h)}\n```\n\n### `Draw.senses.capture_region(display=None, as_array=True)`\nCaptures on-screen pixels inside the selection rectangle:\n- Returns a `numpy.ndarray` shaped `(H, W, 4)` in RGBA format when `as_array=True`.\n- Returns a `QPixmap` when `as_array=False`.\n\n### `Draw.senses.clear_region(display=None) -> None`\nResets the tracked press/release positions for the canvas.\n\n---\n\n## Automatic Cursor Shape Management (`mouse_type`)\n\nSetting `mouse_type` automatically changes the cursor when hovering over the target shape:\n\n| `mouse_type` Value | Qt Cursor Shape |\n| :--- | :--- |\n| `\"pointer\"`, `\"hand\"` | `Qt.CursorShape.PointingHandCursor` |\n| `\"grab\"` | `Qt.CursorShape.OpenHandCursor` |\n| `\"grabbing\"` | `Qt.CursorShape.ClosedHandCursor` |\n| `\"crosshair\"` | `Qt.CursorShape.CrossCursor` |\n| `\"text\"`, `\"ibeam\"` | `Qt.CursorShape.IBeamCursor` |\n| `\"move\"` | `Qt.CursorShape.SizeAllCursor` |\n| `\"wait\"` | `Qt.CursorShape.WaitCursor` |\n| `\"not-allowed\"` | `Qt.CursorShape.ForbiddenCursor` |\n\n---\n\n## Debounce, State Tracking & In-Place Drag Locking\n\n- **Debounce**: Setting `debounce=250` prevents double firing by enforcing a 250ms quiet period between trigger activations.\n- **In-place Lock Control**: Passing `draggable=True` or `locked=True` in `Draw.senses` modifies the shape's drag-lock status in `Draw.connectors`.\n\n---\n\n## Comprehensive Code Examples\n\n### 1. Interactive Button Click & Hover\n```python\nimport Draw\n\nwin = Draw.window(title=\"Senses Demo\", size=[600, 400])\n\nDraw.shape(\n    display=\"main\",\n    ip=\"action_btn\",\n    vertices=4,\n    size=[180, 50],\n    align=\"center\",\n    color=\"#2563eb\",\n    border_radius=8,\n)\n\n# Sense registration with debounced click and pointer cursor\nclick_sense = Draw.senses(\n    \"click\",\n    ip=\"action_btn\",\n    debounce=300,\n    mouse_type=\"pointer\",\n)\n\nDraw.connectors(\n    from_ip=\"action_btn\",\n    sense=click_sense,\n    work=lambda rec: print(\"Action button clicked!\"),\n)\n\nDraw.window.run(\"main\")\n```\n\n### 2. Canvas Screenshot Cropper using `capture_region`\n```python\nDraw.shape(display=\"main\", ip=\"canvas_area\", vertices=4, size=[500, 350], align=\"center\")\n\n# After user clicks and drags a box on the canvas:\ncrop = Draw.senses.capture_region(display=\"main\", as_array=True)\nif crop is not None:\n    print(f\"Captured pixel array of shape: {crop.shape}\")\n```\n"
  },
