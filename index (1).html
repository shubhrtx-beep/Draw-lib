    "content": "\ufeff# Comprehensive Technical Documentation: Draw Visibility Optimization Engine (`Draw.veo` / `Draw._veo`)\n\n`Draw.veo` (`Draw.voe` / `Draw.dust_remover`) is the high-performance scene preprocessing, spatial hierarchy indexing, and 5-phase visibility culling subsystem of the **Draw** framework.\n\n---\n\n## Table of Contents\n1. [Overview & Core Architecture](#overview--core-architecture)\n2. [The 5 Phases of Visibility Optimization](#the-5-phases-of-visibility-optimization)\n   - [Phase 1: Viewport Culling](#phase-1-viewport-culling)\n   - [Phase 2: Hierarchical 2D Spatial Grid](#phase-2-hierarchical-2d-spatial-grid)\n   - [Phase 3: Static / Dynamic Separation](#phase-3-static--dynamic-separation)\n   - [Phase 4: Compact Render Queue](#phase-4-compact-render-queue)\n   - [Phase 5: 2D Occlusion Culling](#phase-5-2d-occlusion-culling)\n3. [Public API & Reference](#public-api--reference)\n4. [Diagnostic & Telemetry Metrics](#diagnostic--telemetry-metrics)\n5. [Comprehensive Code Examples](#comprehensive-code-examples)\n\n---\n\n## Overview & Core Architecture\n\nIn complex 2D graphical scenes containing thousands of vector shapes, charts, and text items across large scrollable viewports, naive rendering traverses and draws every single item on every tick. This introduces severe rendering bottlenecks.\n\n`Draw.veo` implements a multi-tier spatial and visibility optimization pipeline:\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                   Full Scene Elements                    \u2502\n\u2502           (Thousands of Shapes, Charts & Texts)          \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                             \u2502\n                             \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502           Phase 1: Fast Viewport AABB Culling            \u2502\n\u2502   (Discards elements entirely outside visible viewport)  \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                             \u2502\n                             \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502        Phase 2: Hierarchical 2D Spatial Grid Index       \u2502\n\u2502  (Coarse 500px & Fine 100px cells for O(k) range queries)\u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                             \u2502\n                             \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502       Phase 3: Static vs Dynamic Item Separation         \u2502\n\u2502(Static bounds cached once; dynamic motion re-evaluated)  \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                             \u2502\n                             \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502           Phase 5: Front-to-Back Occlusion Culling       \u2502\n\u2502    (Culls items completely covered by opaque shapes)     \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                             \u2502\n                             \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502             Phase 4: Compact Render Queue                \u2502\n\u2502 (Zero-allocation pre-allocated buffer for GPU/QPainter)  \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n## The 5 Phases of Visibility Optimization\n\n### Phase 1: Viewport Culling\n* Uses Axis-Aligned Bounding Boxes (`AABB`).\n* Evaluates screen boundary intersections with a configurable safety margin (default $64\\text{px}$) to prevent visual popping during rapid scrolling.\n\n### Phase 2: Hierarchical 2D Spatial Grid\n* Organizes 2D space into a two-level grid:\n  - **Coarse Grid ($500\\text{px}$)**: Accelerated wide-viewport testing.\n  - **Fine Grid ($100\\text{px}$)**: Precise localized hit queries.\n* Accelerates range lookups to $O(k)$ where $k$ is the number of items in visible cells.\n\n### Phase 3: Static / Dynamic Separation\n* Separates stationary UI cards, background panels, and fixed glyphs from moving items (active `motion`, 1:1 dragging, or `Draw.live` data streams).\n* Static bounding boxes are computed once during scene compilation, drastically minimizing per-frame CPU load.\n\n### Phase 4: Compact Render Queue\n* Utilizes pre-allocated buffer arrays (`CompactRenderQueue`) to eliminate dynamic list allocations and garbage collection pressure in the 60Hz render loop.\n\n### Phase 5: 2D Occlusion Culling\n* Evaluates solid opaque shapes front-to-back.\n* When a solid rectangular shape completely covers an item behind it, the occluded item is discarded before paint instructions are generated.\n\n---\n\n## Public API & Reference\n\n### `Draw.veo` / `Draw.voe` / `Draw.dust_remover`\n\n#### `Draw.veo.set_enabled(enabled: bool) -> None`\nEnables or disables visibility culling globally.\n\n#### `Draw.veo.set_occlusion_enabled(enabled: bool) -> None`\nToggles front-to-back 2D occlusion culling.\n\n#### `Draw.veo.get_stats() -> Dict[str, Any]`\nReturns real-time performance telemetry:\n```python\n{\n    \"total_items\": 5000,\n    \"visible_items\": 120,\n    \"culled_frustum\": 4820,\n    \"culled_occlusion\": 60,\n    \"cull_time_ms\": 0.35,\n    \"init_time_ms\": 1.2,\n}\n```\n\n#### `Draw.veo.preprocess_scene(shape_items, text_items, cw, ch) -> None`\nIndexes static shapes and compiles the spatial hierarchy on window resize or scene updates.\n\n#### `Draw.veo.cull_scene(shapes, texts, viewport_w, viewport_h, scroll_x, scroll_y) -> List[Tuple[Any, str, int]]`\nExecutes the full visibility optimization pipeline, returning the compact sorted render queue in correct Z-order.\n\n---\n\n## Comprehensive Code Examples\n\n### 1. Enabling and Querying VEO Telemetry\n```python\nimport Draw\n\nwin = Draw.window(title=\"VEO Showcase\", width=800, height=600)\n\n# Build a large scene\nfor i in range(100):\n    for j in range(50):\n        Draw.shape(\n            display=\"main\",\n            ip=f\"node_{i}_{j}\",\n            vertices=4,\n            size=[40, 40],\n            x=i * 50,\n            y=j * 50,\n            color=\"#3B82F6\",\n        )\n\n# Query VEO statistics\nstats = Draw.veo.get_stats()\nprint(f\"Total elements: {stats['total_items']}, Rendered: {stats['visible_items']}\")\n\nDraw.window.run(\"main\")\n```\n"
},
  "utility-modules": {
    "id": "utility-modules",

    "desc": "Lifecycle app singleton, batch math ops, cross-module bridge, native controls, scheduler, simulation.",
    "content": "# Draw Utility & Core Infrastructure Modules Documentation\n\nThis document provides a comprehensive overview of the seven core utility and infrastructure modules supporting the **Draw** graphics engine:\n\n1. [`_app.py`](#1-draw_app-_apppy) \u2014 Application Instance Lifecycle Management\n2. [`_batch_ops.py`](#2-draw_batch_ops-_batch_opspy) \u2014 Vectorized Math & Spatial Partitioning\n3. [`_bridge.py`](#3-draw_bridge-_bridgepy) \u2014 Central Cross-Module Integration Hub\n4. [`_native.py`](#4-draw_native-_nativepy) \u2014 Native Qt Controls & Box Layout System\n5. [`_schedule.py`](#5-draw_schedule-_schedulepy) \u2014 Asynchronous & Repeating Event Scheduling\n6. [`_simulate.py`](#6-draw_simulate-_simulatepy) \u2014 Programmatic Input Simulation for Automation\n7. [`_validation.py`](#7-draw_validation-_validationpy) \u2014 Fail-Fast API Schema Validation\n\n---\n\n## 1. Draw._app (`_app.py`)\n\n### Overview & Purpose\n`Draw._app` manages the singleton `QApplication` lifecycle required by PySide6. It guarantees that any call requiring Qt primitives (such as creating windows, canvases, or native widgets) safely obtains or initializes the underlying Qt application loop without raising multiple `QApplication` instantiation errors.\n\n### Public API\n```python\nfrom Draw._app import get_app\n\napp = get_app() -> QApplication\n```\n- **`get_app()`**: Checks `QApplication.instance()` to reuse any existing application instance, or creates `QApplication(sys.argv)` if none exists.\n\n---\n\n## 2. Draw._batch_ops (`_batch_ops.py`)\n\n### Overview & Purpose\n`Draw._batch_ops` provides high-performance batch numerical operations and spatial partitioning primitives. It optimizes proximity checks and geometric transformations across hundreds of objects while ensuring NumPy remains an optional zero-dependency fallback.\n\n### Features & Implementation\n- **Vectorized Math**: Switches to NumPy for arrays exceeding 32 elements; falls back to pure-Python list comprehensions for small arrays.\n- **SpatialGrid Partitioning**: A 2D uniform grid system (`SpatialGrid`) reducing $O(n^2)$ pairwise proximity checks down to near $O(n)$ candidate queries during collision detection and alignment operations.\n\n### Public API & Key Methods\n- **`batch_translate(points, dx, dy)`**: Translates a sequence of $(x, y)$ coordinates. Converts NumPy arrays via high-speed `.tolist()` methods.\n- **`batch_distances(origin, points)`**: Computes Euclidean distances from an origin point to a sequence of target points.\n- **`SpatialGrid(cell_size=100.0)`**:\n  - `rebuild(items)`: Clears and re-indexes `(id, x, y)` items into grid cells.\n  - `nearby(x, y, radius)`: Queries target cell and 8 surrounding neighbor cells for candidate points within `radius`.\n\n---\n\n## 3. Draw._bridge (`_bridge.py`)\n\n### Overview & Purpose\n`Draw._bridge` acts as the central cross-module integration hub. It eliminates circular dependency crashes across the `Draw` package by serving as a single front door for lazy, function-local registry imports.\n\n### Registry Accessors & Cross-Cutting Helpers\n- **Singleton Accessors**:\n  - `get_color_registry()`, `get_color_parser()`\n  - `get_shape_registry()`, `get_text_registry()`, `get_point_registry()`\n  - `get_panel_registry()`, `get_window_registry()`, `get_layout_registry()`\n  - `get_room_registry()`, `get_motion_registry()`, `get_graph_registry()`\n- **Cross-Cutting Utilities**:\n  - `get_shape_rect(window_tag, ip)`: Retrieves $(x, y, w, h)$ canvas bounding boxes.\n  - `get_shape_center(window_tag, ip)`: Calculates center coordinates $(cx, cy)$.\n  - `get_anchor_point(rect, anchor)`: Resolves named anchors (`top-left`, `center`, `bottom-right`, etc.) into absolute points.\n  - `resolve_point_ref(ref, window_tag, self_rect)`: Decodes point references (e.g. `\"ip:shape_id:top-right\"` or `\"ip:path_id:left\"`), supporting both painted shapes and `Draw.point` path bounding boxes.\n  - `resolve_dynamic_color(ip, x, y, w, h)`: Resolves live dynamic color bindings for shape/text items.\n\n---\n\n## 4. Draw._native (`_native.py`)\n\n### Overview & Purpose\n`Draw._native` enables building rich native UI interfaces directly inside the `Draw` canvas using real Qt widgets (`Draw.widget`) and layout containers (`Draw.box`).\n\n### Features & Implementation\n1. **`Draw.widget`**: Factory for native controls including `checkbox`, `radio`, `button`, `listbox`, `combobox`, `slider`, `spinbox`, `progressbar`, `tabs`, `scrollarea`, and embedded `canvas`.\n2. **`Draw.box`**: True `QVBoxLayout` and `QHBoxLayout` container management. Styles applied to `Draw.box` instances are scoped using `QWidget#<ip>` object-name selectors to prevent style leaks to child widgets.\n\n### Public API Examples\n```python\n# Create a checkbox\nDraw.widget(ip=\"chk_agree\", type=\"checkbox\", text=\"I agree\", on_toggle=handle_toggle)\n\n# Group widgets into a vertical container\nDraw.box(ip=\"sidebar\", direction=\"vertical\", children=[\"chk_agree\"])\n```\n\n---\n\n## 5. Draw._schedule (`_schedule.py`)\n\n### Overview & Purpose\n`Draw._schedule` provides lightweight, non-blocking time-based callbacks without needing raw `QTimer` boilerplate.\n\n### Key Functions & Handles\n- **`after(seconds, fn)`**: Executes `fn()` once after `seconds` elapsed.\n- **`every(seconds, fn)`**: Executes `fn()` repeatedly every `seconds` until canceled.\n- **`_ScheduledHandle`**: Returned handle exposing `.stop()` and `.active` status. Maintains active timer references to prevent premature Python garbage collection.\n\n---\n\n## 6. Draw._simulate (`_simulate.py`)\n\n### Overview & Purpose\n`Draw._simulate` provides programmatic input simulation (`click` and `drag`) for automated testing and demo scripts.\n\n### Functions & Implementation\n- **`click(ip, display=None, button=\"left\", double=False, x=None, y=None)`**: Synthesizes press and release events targeting shape centers or explicit canvas coordinates.\n- **`drag(ip, to_x, to_y, display=None)`**: Synthesizes drag operations and invokes `canvas.grab()` to synchronously update shape bounds without waiting for asynchronous repaint ticks.\n- **Canvas Resolution**: Raises clear, distinct `ValueError` messages if no active window is open or if multiple windows require explicit `display` targeting.\n\n---\n\n## 7. Draw._validation (`_validation.py`)\n\n### Overview & Purpose\n`Draw._validation` provides lightweight, fail-fast schema key validation at `Draw` public API boundaries.\n\n### Implementation & Error Handling\n- **`KNOWN_SHAPE_KEYS`**: Immutable set of valid shape dict keys.\n- **`validate_keys(raw, known_keys, kind, obj_id=None)`**: Detects misspelled dict keys (e.g. `\"colour\"` or `\"opactiy\"`) and uses `difflib` fuzzy matching to raise informative `DrawValidationError` exceptions with correct spelling suggestions.\n\n---\n\n## Summary of Optimizations Applied\n\n1. **`_batch_ops.py`**: Replaced row-by-row NumPy iteration with fast `.tolist()` array conversions in `batch_translate` and `batch_distances`.\n2. **`_bridge.py`**: Expanded `resolve_point_ref` anchor resolution to support named anchors (e.g., `\"top-left\"`, `\"bottom-right\"`) on `Draw.point` paths via `point_registry` bounds lookup.\n3. **`_native.py`**: Scoped QSS styling rules on `Draw.box` containers using `QWidget#<ip>` selectors to eliminate stylesheet leakage into nested child controls.\n4. **`_simulate.py`**: Added explicit error check when no active canvas window exists (`\"no active window found.\"`).\n"
  }

    let currentDocId = "public-api";

    // Initialize Navigation Sidebar
    function renderSidebar() {
      const sidebar = document.getElementById("sidebar");
      let html = "";
      NAV_STRUCTURE.forEach(cat => {
        html += `<div class="nav-category">
          <div class="nav-cat-title">${cat.icon} ${cat.category}</div>`;
        cat.items.forEach(item => {
          const isActive = item.id === currentDocId ? "active" : "";
          html += `<div class="nav-item ${isActive}" onclick="selectDoc('${item.id}')">
            <span>${item.title}</span>
            <span class="nav-badge">${item.badge}</span>
          </div>`;
        });
        html += `</div>`;
      });
      sidebar.innerHTML = html;
    }

    // Select Document
    function selectDoc(docId) {
      if (!DOCS_DB[docId]) return;
      currentDocId = docId;
      if (window.location.hash !== "#" + docId) {
        history.replaceState(null, "", "#" + docId);
      }
      const doc = DOCS_DB[docId];

      // Breadcrumb
      document.getElementById("breadcrumb").innerHTML = `
        <span>Draw Docs</span>
        <span class="sep">/</span>
        <span>${doc.category}</span>
        <span class="sep">/</span>
        <span class="current">${doc.title}</span>
      `;

      // Render Markdown
      const htmlContent = marked.parse(doc.content);
      const viewer = document.getElementById("docViewer");
      viewer.innerHTML = htmlContent;

      // Highlight syntax & add copy buttons
      Prism.highlightAllUnder(viewer);
      addCopyButtons();

      // Build Table of Contents
      buildTOC();

      // Build Pagination
      buildPagination();

      // Update sidebar active states
      renderSidebar();

      // Scroll to top
      window.scrollTo({ top: 0, behavior: 'instant' });

      // Close mobile sidebar if open
      document.getElementById("sidebar").classList.remove("open");
    }

    // Add Copy Code Buttons
    function addCopyButtons() {
      document.querySelectorAll("pre").forEach(pre => {
        if (pre.querySelector(".copy-code-btn")) return;
        const btn = document.createElement("button");
        btn.className = "copy-code-btn";
        btn.innerText = "Copy";
        btn.onclick = () => {
          const code = pre.querySelector("code") ? pre.querySelector("code").innerText : pre.innerText;
          navigator.clipboard.writeText(code).then(() => {
            btn.innerText = "Copied! ✓";
            setTimeout(() => btn.innerText = "Copy", 2000);
          });
        };
        pre.appendChild(btn);
      });
    }

    // Build Table of Contents
    function buildTOC() {
      const container = document.getElementById("tocContainer");
      const headings = document.querySelectorAll("#docViewer h2, #docViewer h3");
      if (!headings.length) {
        container.innerHTML = `<span style="color: var(--text-dim); font-size: 12px;">No sub-sections</span>`;
        return;
      }
      let html = "";
      headings.forEach((h, idx) => {
        const id = "heading-" + idx;
        h.id = id;
        const isH3 = h.tagName.toLowerCase() === "h3";
        html += `<a href="#${id}" class="toc-link ${isH3 ? 'depth-3' : ''}">${h.innerText}</a>`;
      });
      container.innerHTML = html;
    }

    // Build Next / Previous Page Cards
    function buildPagination() {
      const allItems = [];
      NAV_STRUCTURE.forEach(cat => cat.items.forEach(it => allItems.push(it)));
      const idx = allItems.findIndex(it => it.id === currentDocId);
      const prev = idx > 0 ? allItems[idx - 1] : null;
      const next = idx < allItems.length - 1 ? allItems[idx + 1] : null;

      let html = "";
      if (prev) {
        html += `<div class="page-card prev" onclick="selectDoc('${prev.id}')">
          <div class="page-card-sub">← Previous</div>
          <div class="page-card-title">${prev.title}</div>
        </div>`;
      } else {
        html += `<div></div>`;
      }
      if (next) {
        html += `<div class="page-card next" onclick="selectDoc('${next.id}')">
          <div class="page-card-sub">Next →</div>
          <div class="page-card-title">${next.title}</div>
        </div>`;
      }
      document.getElementById("pagination").innerHTML = html;
    }

    // Search Engine
    function openSearch() {
      const backdrop = document.getElementById("searchBackdrop");
      backdrop.classList.add("open");
      const input = document.getElementById("searchInput");
      input.value = "";
      input.focus();
      handleSearch("");
    }

    function closeSearch(event) {
      document.getElementById("searchBackdrop").classList.remove("open");
    }

    function handleSearch(query) {
      const container = document.getElementById("searchResults");
      const q = query.trim().toLowerCase();
      if (!q) {
        container.innerHTML = `<div style="padding: 20px; text-align: center; color: var(--text-dim); font-size: 13px;">Type keywords to search all modules...</div>`;
        return;
      }

      const results = [];
      Object.values(DOCS_DB).forEach(doc => {
        let score = 0;
        if (doc.title.toLowerCase().includes(q)) score += 10;
        if (doc.desc.toLowerCase().includes(q)) score += 5;
        
        const rawContent = doc.content.toLowerCase();
        const count = (rawContent.match(new RegExp(q, "g")) || []).length;
        score += count;

        if (score > 0) {
          // Find first matching snippet
          const idx = rawContent.indexOf(q);
          const start = Math.max(0, idx - 40);
          const end = Math.min(rawContent.length, idx + 100);
          let snippet = doc.content.substring(start, end).replace(/\n/g, " ");
          
          results.push({ doc, score, snippet });
        }
      });

      results.sort((a, b) => b.score - a.score);

      if (!results.length) {
        container.innerHTML = `<div style="padding: 20px; text-align: center; color: var(--text-dim); font-size: 13px;">No results found for "${query}".</div>`;
        return;
      }

      let html = "";
      results.slice(0, 10).forEach(res => {
        const highlighted = res.snippet.replace(new RegExp(q, "gi"), match => `<mark>${match}</mark>`);
        html += `<div class="search-result-item" onclick="selectDoc('${res.doc.id}'); closeSearch();">
          <div class="search-res-title">${res.doc.title} <span style="font-size: 11px; opacity: 0.6;">(${res.doc.category})</span></div>
          <div class="search-res-snippet">...${highlighted}...</div>
        </div>`;
      });
      container.innerHTML = html;
    }

    // Keyboard Shortcuts (Ctrl+K, ESC)
    window.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        openSearch();
      }
      if (e.key === "Escape") {
        closeSearch();
      }
    });

    // Reading Progress Indicator
    window.addEventListener("scroll", () => {
      const winScroll = document.documentElement.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const scrolled = (winScroll / height) * 100;
      document.getElementById("progressBar").style.width = scrolled + "%";
    });

    // Theme Switcher
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle("dark");
      document.documentElement.classList.toggle("light", !isDark);
      localStorage.setItem("draw_theme", isDark ? "dark" : "light");
    }

    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("open");
    }

    // Initialize App on Load
    window.addEventListener("DOMContentLoaded", () => {
      const savedTheme = localStorage.getItem("draw_theme") || "dark";
      if (savedTheme === "light") {
        document.documentElement.classList.remove("dark");
        document.documentElement.classList.add("light");
      }
      const initialDoc = window.location.hash.replace("#", "");
      if (initialDoc && DOCS_DB[initialDoc]) {
        selectDoc(initialDoc);
      } else {
        selectDoc("public-api");
      }
    });
  </script>
