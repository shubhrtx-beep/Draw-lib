    "content": "# Comprehensive Technical Documentation: Draw Checkpoint Engine (`Draw._checkpoint`)\n\n`Draw._checkpoint` (`Draw.checkpoint`) is the scene-level state management, canvas snapshotting, offload/reload caching, scene-swapping, and disk persistence subsystem of the **Draw** framework. It enables developers to capture frozen snapshots of canvas state (shapes, text items, layout grids, fast-lookup hashes), offload heavy scenes to conserve GPU/memory during background workflows, seamlessly transition between scenes, and safely persist scene states to disk with restricted unpickling security hardening.\n\n---\n\n## Table of Contents\n1. [Overview & Core Architecture](#overview--core-architecture)\n2. [Security Hardening (`_RestrictedUnpickler`)](#security-hardening-_restrictedunpickler)\n3. [Data Structures (`CheckpointState`)](#data-structures-checkpointstate)\n4. [Public API Reference (`Draw.checkpoint(...)`)](#public-api-reference-drawcheckpoint)\n5. [Registry Utility & Lifecycle Methods](#registry-utility--lifecycle-methods)\n   - [`get(ip)`, `list()`, `info(ip)`](#getip-list-infoip)\n   - [`delete(ip)`, `clear_all()`, `rename(old, new)`, `copy(src, dst)`](#deleteip-clear_all-renameold-new-copysrc-dst)\n   - [`diff(ip_a, ip_b)`](#diffip_a-ip_b)\n6. [IP Namespace Invalidation (`rest_ip=True`)](#ip-namespace-invalidation-rest_iptrue)\n7. [Comprehensive Code Examples](#comprehensive-code-examples)\n\n---\n\n## Overview & Core Architecture\n\nIn complex desktop applications, managing state across multiple views (e.g. main menu, level editor, game canvas, settings panel) often leads to memory churn and widget tree clutter. `Draw.checkpoint` manages these transitions via named state slots:\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502              Draw.checkpoint(ip=\"level_1\", ...)          \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                            \u2502\n        \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n        \u25bc                   \u25bc                   \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510    \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510    \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502  save=True   \u2502    \u2502 offload=True \u2502    \u2502 reload=True  \u2502\n\u2502 Deep-copies  \u2502    \u2502 Clears canvas\u2502    \u2502 Deep-copies  \u2502\n\u2502 ShapeDef and \u2502    \u2502 (frees paint \u2502    \u2502 snapshot back\u2502\n\u2502 TextDef lists\u2502    \u2502 loops & GPU) \u2502    \u2502 onto canvas  \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518    \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518    \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n        \u2502                   \u2502                   \u2502\n        \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                            \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                    _CheckpointRegistry                   \u2502\n\u2502 - In-memory state slots (CheckpointState)                \u2502\n\u2502 - Restricted file serialization (path=\"save.pkl\")        \u2502\n\u2502 - State diffing & namespace isolation (rest_ip)          \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n## Security Hardening (`_RestrictedUnpickler`)\n\nWhen saving checkpoints to disk (`path=\"saves/slot1.pkl\"`), standard Python `pickle` can be vulnerable to arbitrary code execution if untrusted files are loaded. `Draw._checkpoint` enforces a strict class allowlist via `_RestrictedUnpickler`:\n\n```python\n_SAFE_PICKLE_CLASSES = {\n    \"Draw._checkpoint\": {\"CheckpointState\"},\n    \"Draw._shapes\":     {\"ShapeDef\"},\n    \"Draw._text\":       {\"TextDef\"},\n    \"Draw._layout\":     {\"TableLayout\", \"CombinedCellLayout\"},\n    \"Draw._overlap\":    {\"Rect\", \"FlowSpec\"},\n    \"PySide6.QtGui\":    {\"QColor\"},\n    \"PySide6.QtCore\":   {\"QPointF\", \"QRectF\"},\n    \"builtins\":         {\"dict\", \"list\", \"tuple\", \"set\", \"frozenset\", \"int\", \"float\", \"str\", \"bool\", \"bytes\"},\n    \"collections\":      {\"OrderedDict\", \"defaultdict\"},\n}\n```\nAny attempt to unpickle non-whitelisted modules or functions immediately raises a `pickle.UnpicklingError`.\n\n---\n\n## Data Structures (`CheckpointState`)\n\nEach saved checkpoint is encapsulated by `CheckpointState`:\n\n```python\n@dataclass\nclass CheckpointState:\n    ip: str                               # Unique checkpoint slot name\n    display: str                          # Target window / panel tag\n    properties: Dict[str, Any]            # User-attached metadata\n    shape_items: list                     # Deep-copied list of ShapeDef instances\n    text_items: list                      # Deep-copied list of TextDef instances\n    layout_items: list                    # Deep-copied list of TableLayout instances\n    shape_by_ip: Dict[str, Any]           # Fast lookup dict mapping shape IP to ShapeDef\n    saved_at: Optional[str] = None        # ISO timestamp string of snapshot creation\n```\n\n---\n\n## Public API Reference (`Draw.checkpoint(...)`)\n\nPerforms one or more checkpoint operations on the canvas.\n\n```python\nstate = Draw.checkpoint(\n    ip         = \"main_menu\",        # Name of this checkpoint slot (REQUIRED)\n    display    = \"main\",             # Target window or panel tag (auto-resolved if single window)\n    save       = True,               # Snapshot current canvas state into slot\n    offload    = False,              # Clear the canvas without deleting the saved snapshot\n    reload     = False,              # Restore THIS slot's snapshot onto the canvas\n    new        = None,               # Callable: offloads canvas, then executes new() to build scene\n    load       = None,               # Name of a DIFFERENT checkpoint slot to restore\n    path       = \"saves/menu.pkl\",   # Optional file path for disk persistence\n    on_save    = None,               # Hook callback(ip, state) invoked after save\n    on_load    = None,               # Hook callback(ip, state) invoked after load/reload\n    properties = {\"version\": 1},     # Arbitrary metadata attached to snapshot\n    rest_ip    = False,              # Reset all IP namespaces across shapes, colors, motion, and senses\n)\n```\n\n### Operation Execution Order\nWhen multiple operation flags are passed simultaneously in a single call, they execute in this strict deterministic order:\n$$\\text{rest\\_ip} \\longrightarrow \\text{save} \\longrightarrow \\text{offload} \\longrightarrow \\text{new} \\longrightarrow \\text{reload} \\longrightarrow \\text{load}$$\n\n---\n\n## Registry Utility & Lifecycle Methods\n\n### `get(ip)` / `list()` / `info(ip)`\n* **`Draw.checkpoint.get(ip: str) -> Optional[CheckpointState]`**: Returns the raw `CheckpointState` object.\n* **`Draw.checkpoint.list() -> List[str]`**: Returns a list of all registered checkpoint slot names.\n* **`Draw.checkpoint.info(ip: str) -> Optional[Dict[str, Any]]`**: Returns a lightweight summary dictionary without copying shape data:\n  ```python\n  {\n      \"ip\": \"main_menu\",\n      \"display\": \"main\",\n      \"saved_at\": \"2026-08-15 11:20:00\",\n      \"shape_count\": 12,\n      \"text_count\": 4,\n      \"properties\": {\"version\": 1}\n  }\n  ```\n\n### `delete(ip)` / `clear_all()` / `rename(old, new)` / `copy(src, dst)`\n* **`Draw.checkpoint.delete(ip: str) -> bool`**: Removes a checkpoint slot from memory (does not affect current canvas).\n* **`Draw.checkpoint.clear_all() -> None`**: Wipes all checkpoint slots from memory.\n* **`Draw.checkpoint.rename(old_ip: str, new_ip: str) -> bool`**: Renames a checkpoint slot.\n* **`Draw.checkpoint.copy(src_ip: str, dst_ip: str) -> Optional[CheckpointState]`**: Clones a snapshot under a new slot identifier.\n\n### `diff(ip_a, ip_b)`\nComputes a structural comparison between two snapshots:\n```python\ndiff_report = Draw.checkpoint.diff(\"level_1\", \"level_2\")\n```\nReturns a dictionary containing:\n* `\"shapes_only_in_a\"`: List of shape IPs present only in snapshot A.\n* `\"shapes_only_in_b\"`: List of shape IPs present only in snapshot B.\n* `\"shapes_in_both\"`: List of shape IPs shared across both snapshots.\n* `\"shape_count_a\"`, `\"shape_count_b\"`, `\"text_count_a\"`, `\"text_count_b\"`.\n\n---\n\n## IP Namespace Invalidation (`rest_ip=True`)\n\nWhen transitioning between major scene boundaries, old shape IPs, color bindings, and motion triggers can linger in memory. Passing `rest_ip=True` severs all stale connections:\n1. Clears shape IP lookup caches and content hash tables across canvases.\n2. Flushes color binding registries in `Draw._colour`.\n3. Flushes active motion bindings in `Draw._motion`.\n4. Resets connector links and active senses in `Draw._connectors`.\n\n---\n\n## Comprehensive Code Examples\n\n### 1. Scene Swapping (Menu $\\longleftrightarrow$ Gameplay)\n```python\nimport Draw\n\nwin = Draw.window(tag=\"main\", title=\"Game App\", width=800, height=600)\n\ndef build_menu():\n    Draw.text(display=\"main\", ip=\"title\", text=\"SUPER ARCADE\", font_size=32, align=\"center\")\n    Draw.shape(display=\"main\", ip=\"btn_play\", vertices=4, size=[160, 50], align=\"center\", y=350, color=\"green\")\n\ndef build_gameplay():\n    Draw.shape(display=\"main\", ip=\"player\", vertices=3, size=[40, 40], x=400, y=500, color=\"cyan\")\n    Draw.text(display=\"main\", ip=\"score\", text=\"Score: 0\", x=20, y=20)\n\n# 1. Build and save Menu Scene\nbuild_menu()\nDraw.checkpoint(ip=\"menu_scene\", display=\"main\", save=True)\n\n# 2. Transition to Gameplay Scene\nDraw.checkpoint(ip=\"game_scene\", display=\"main\", new=build_gameplay, save=True)\n\n# 3. Return to Menu Scene later\nDraw.checkpoint(ip=\"menu_scene\", display=\"main\", reload=True)\n```\n\n### 2. Disk Persistence & Snapshot Restore\n```python\n# Save game state to file\nDraw.checkpoint(\n    ip=\"slot_1\",\n    display=\"main\",\n    save=True,\n    path=\"saves/slot_1.pkl\",\n    properties={\"level\": 5, \"score\": 12400}\n)\n\n# Offload canvas\nDraw.checkpoint(ip=\"slot_1\", display=\"main\", offload=True)\n\n# Reload from disk file\nDraw.checkpoint(ip=\"slot_1\", display=\"main\", reload=True, path=\"saves/slot_1.pkl\")\n```\n"
  },
  "screen": {
    "id": "screen",
    "title": "Live Screen Viewport (Draw.screen)",
    "category": "Data, Paths & Viewports",
    "badge": "Live",
    "desc": "Host pixel buffer display (OpenCV, AI models, cameras, NumPy, PIL) and subpixel interaction streams.",
    "content": "# Comprehensive Technical Documentation: Draw Screen Engine (`Draw._screen`)\n\n`Draw._screen` (`Draw.screen`) is the high-performance live display surface and interaction streaming module of the **Draw** framework. It acts as a decoupled, host-driven viewport designed to ingest and render real-time pixel streams (OpenCV feeds, AI model outputs, video frames, camera captures, 3D viewport renders, NumPy arrays, PIL images, raw byte buffers) and stream user input (mouse, multi-touch, pressure-sensitive stylus, keyboard, wheel, drag) back to host logic with subpixel coordinate precision.\n\n---\n\n## Table of Contents\n1. [Overview & Architectural Philosophy](#overview--architectural-philosophy)\n2. [Universal Frame Ingestion & Conversion (`_to_qimage`)](#universal-frame-ingestion--conversion-_to_qimage)\n3. [Thread-Safe Background Dispatcher (`_ScreenDispatcher`)](#thread-safe-background-dispatcher-_screendispatcher)\n4. [Public API Reference (`Draw.screen(...)`)](#public-api-reference-drawscreen)\n5. [Screen Surface Component (`ScreenSurface`)](#screen-surface-component-screensurface)\n   - [Display Scaling Modes](#display-scaling-modes)\n   - [Coordinate Reporting & Drawing Mode](#coordinate-reporting--drawing-mode)\n   - [Event Subscriptions (`screen.on(...)`)](#event-subscriptions-screenon)\n6. [Registry Methods on `Draw.screen`](#registry-methods-on-drawscreen)\n7. [Comprehensive Code Examples](#comprehensive-code-examples)\n\n---\n\n## Overview & Architectural Philosophy\n\n`Draw.screen` is deliberately architected with a strict separation of concerns:\n- **It does not own the data**: It never generates shapes, paths, or vector calculations.\n- **It is a window into external pixels**: It accepts pre-rendered frames or camera buffers from Python worker threads, C++ extensions, or AI pipelines.\n- **Bi-directional event streaming**: It captures user gestures (clicks, drags, pressure, touches) and dispatches them directly to registered host callbacks.\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502              Host Data Feed (Background Thread)          \u2502\n\u2502   (OpenCV Video, AI Generation, Camera, NumPy, PIL)      \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                            \u2502 Thread-Safe Queued Signal\n                            \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                    _ScreenDispatcher                     \u2502\n\u2502 - Ingests frame buffers asynchronously                   \u2502\n\u2502 - Marshals QImage conversion to Qt Main GUI thread       \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                            \u2502 Repaints at 60+ FPS\n                            \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                      ScreenSurface                       \u2502\n\u2502 - Aspect-ratio scaling: fit, stretch, center, none       \u2502\n\u2502 - Dispatches mouse, touch, stylus, wheel, and key events \u2502\n\u2502 - Coordinate stream: rx, ry relative to screen bounds    \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n## Universal Frame Ingestion & Conversion (`_to_qimage`)\n\n`Draw.screen.update(...)` automatically converts any standard Python frame format into an optimized `QImage`:\n\n| Host Input Format | Internal Conversion Logic | Supported Color Spaces |\n| :--- | :--- | :--- |\n| **`numpy.ndarray`** | Zero-copy byte buffer conversion using strides. Auto-scales float arrays ($0.0..1.0 \\to 0..255$) and clips to `uint8`. | Grayscale (2D `[H, W]`), RGB (3D `[H, W, 3]`), RGBA/BGRA (3D `[H, W, 4]`). |\n| **`PIL.Image.Image`** | Extracts `.tobytes(\"raw\", ...)` directly into `QImage.Format_RGBA8888` / `Format_RGB888`. | `RGBA`, `RGB`, `L` (Grayscale), `P`, `CMYK` (auto-converted). |\n| **`bytes` / `bytearray`** | Auto-detects compressed formats (`PNG`, `JPEG`, `WebP`, `BMP`) via `QImage.fromData` or raw uncompressed buffers when target size is specified. | Encoded streams or raw byte buffers. |\n| **File Path (`str`/`Path`)** | Loads image file from disk path directly. | `.png`, `.jpg`, `.jpeg`, `.webp`, `.bmp`, `.svg`. |\n| **`QPixmap` / `QImage`** | Direct ingestion with zero overhead. | Native Qt image structures. |\n| **Nested Lists / Tuples** | Converts Python nested pixel arrays to NumPy `uint8` matrices. | 2D / 3D nested numerical lists. |\n| **`None`** | Clears the display surface back to the background color. | Canvas clear. |\n\n---\n\n## Thread-Safe Background Dispatcher (`_ScreenDispatcher`)\n\nHigh-frequency camera loops and AI inferences typically run in separate Python `threading.Thread` workers. Calling `screen.update(frame)` from any background thread is 100% thread-safe:\n- The background thread emits a queued Qt signal (`_update_signal`).\n- Qt automatically marshals the frame update onto the main GUI event loop, preventing UI thread blocking and cross-thread memory corruption.\n\n---\n\n## Public API Reference (`Draw.screen(...)`)\n\nFactory function that creates or retrieves a `ScreenSurface` viewport on a window:\n\n```python\nscreen = Draw.screen(\n    ip               = \"camera_view\",      # Unique identifier for the screen surface\n    display          = \"main\",             # Parent window tag (auto-resolved if single window)\n    size             = [640, 480],         # Surface dimensions [width, height]\n    x                = None,               # Explicit X coordinate (optional)\n    y                = None,               # Explicit Y coordinate (optional)\n    align            = \"center\",           # Screen alignment inside window (\"center\", \"top-left\", etc.)\n    source           = None,               # Initial image/frame or path\n    scaling          = \"fit\",              # \"fit\", \"stretch\", \"center\", \"none\"\n    background_color = \"#000000\",          # Canvas background fill behind letterboxed frames\n    drawing_mode     = False,              # Enables mouse_down, mouse_move, mouse_up drawing streams\n    # Event Callback Hooks:\n    on_mouse_move    = None,               # fn(x, y, event)\n    on_mouse_down    = None,               # fn(x, y, button, event)\n    on_mouse_up      = None,               # fn(x, y, button, event)\n    on_click         = None,               # fn(x, y, button)\n    on_drag          = None,               # fn(x, y, dx, dy, button)\n    on_wheel         = None,               # fn(delta_x, delta_y, x, y, event)\n    on_touch         = None,               # fn(points_list, event)\n    on_stylus        = None,               # fn(pressure, x, y, tilt_x, tilt_y, event)\n    on_key           = None,               # fn(key_text, key_code, event)\n    on_resize        = None,               # fn(w, h)\n)\n```\n\n---\n\n## Screen Surface Component (`ScreenSurface`)\n\n### Display Scaling Modes\n\nConfigured via `scaling=\"<mode>\"`:\n\n* **`\"fit\"`** *(default)*: Preserves frame aspect ratio, scaling smoothly to fit within surface dimensions with letterboxing.\n* **`\"stretch\"`**: Stretches the frame to fill the entire surface bounding box.\n* **`\"center\"`**: Renders frame at 1:1 original pixel resolution centered in the viewport.\n* **`\"none\"`**: Renders frame at 1:1 anchored at top-left $(0, 0)$.\n\n---\n\n### Coordinate Reporting & Drawing Mode\n\nAll reported $(x, y)$ coordinates in callbacks are normalized **relative to the screen surface's top-left corner $(0, 0)$**:\n\n* **`screen.mouse_x` / `screen.mouse_y`**: Current cursor position relative to surface.\n* **`screen.last_x` / `screen.last_y`**: Last recorded click/move coordinate.\n* **`screen.enable_drawing_mode(True)`**: Activates interactive drawing mode streams (`mouse_down`, `mouse_move`, `mouse_up`) for paint tools and canvas annotation.\n\n---\n\n### Event Subscriptions (`screen.on(...)`)\n\nRegister event listeners dynamically via method call or Python decorators:\n\n```python\n# Direct method registration\nscreen.on(\"mouse_move\", lambda x, y, event: print(f\"Cursor: {x}, {y}\"))\n\n# Python decorator syntax\n@screen.on(\"drag\")\ndef handle_drag(x, y, dx, dy, button):\n    print(f\"Dragged by ({dx}, {dy}) with {button} button\")\n```\n\n---\n\n## Registry Methods on `Draw.screen`\n\n* **`Draw.screen.get(ip: str) -> Optional[ScreenSurface]`**: Returns active `ScreenSurface` by IP.\n* **`Draw.screen.list() -> List[str]`**: Lists all registered screen IPs.\n* **`Draw.screen.update(ip: str, frame: Any) -> None`**: Pushes a new frame to the screen with identifier `ip`.\n* **`Draw.screen.clear(ip: Optional[str] = None) -> None`**: Clears the frame buffer for a specific screen, or all screens if `ip=None`.\n* **`Draw.screen.capture(ip: str) -> Optional[QImage]`**: Captures the current visible frame as a `QImage`.\n* **`Draw.screen.resize(ip: str, size: [w, h]) -> None`**: Dynamically resizes the viewport.\n* **`Draw.screen.remove(ip: str) -> bool`**: Closes and unregisters the screen surface.\n\n---\n\n## Comprehensive Code Examples\n\n### 1. Real-Time Camera / Video Stream with OpenCV\n```python\nimport threading\nimport time\nimport Draw\nimport cv2  # pip install opencv-python\n\nwin = Draw.window(title=\"Live Video Viewport\", width=800, height=600)\n\n# Create live screen surface\nview = Draw.screen(\n    ip=\"cam_feed\",\n    display=\"main\",\n    size=[640, 480],\n    align=\"center\",\n    scaling=\"fit\",\n)\n\n# Background camera polling thread\ndef camera_worker():\n    cap = cv2.VideoCapture(0)\n    while cap.isOpened():\n        ret, frame = cap.read()\n        if ret:\n            # OpenCV BGR -> RGB conversion\n            rgb_frame = cv2.cvtColor(frame, cv2.COLOR_BGR2RGB)\n            # Push frame to Draw.screen thread-safely\n            view.update(rgb_frame)\n        time.sleep(0.033)  # ~30 FPS\n\nthread = threading.Thread(target=camera_worker, daemon=True)\nthread.start()\n\nDraw.window.run(\"main\")\n```\n\n### 2. Interactive Paint Canvas with Stylus Pressure\n```python\nimport numpy as np\nimport Draw\n\nwin = Draw.window(title=\"Pressure Paint App\", width=900, height=700)\n\ncanvas_buffer = np.zeros((600, 800, 3), dtype=np.uint8)\n\npaint_screen = Draw.screen(\n    ip=\"canvas\",\n    display=\"main\",\n    size=[800, 600],\n    align=\"center\",\n    source=canvas_buffer,\n    drawing_mode=True,\n)\n\n@paint_screen.on(\"stylus\")\ndef on_stylus_draw(pressure, x, y, tilt_x, tilt_y, event):\n    radius = int(max(1, pressure * 12))\n    # Draw onto NumPy buffer\n    cv2.circle(canvas_buffer, (int(x), int(y)), radius, (0, 255, 200), -1)\n    paint_screen.update(canvas_buffer)\n\nDraw.window.run(\"main\")\n```\n"
  },
  "scroller": {
    "id": "scroller",
    "title": "Scroller Engine (Draw.scroller)",
    "category": "Data, Paths & Viewports",
    "badge": "Pan",
    "desc": "Declarative kinetic inertia scrolling, programmatic jumping, scrollbar shapes, keyboard navigation.",
    "content": "# Comprehensive Technical Documentation: Draw Scroller Engine (`Draw._scroller`)\n\n`Draw._scroller` (`Draw.scroller`) is the high-level declarative scrolling, gesture-driven canvas panning, and viewport navigation subsystem of the **Draw** framework. Rather than implementing raw rendering directly, it orchestrates existing core subsystems:\n- **`Draw._shapes`**: Automatically renders and scales scrollbar track and thumb geometries.\n- **`Draw._motion`**: Drives smooth, spring, kinetic inertia, and animated transition physics.\n- **`Draw.senses`**: Captures multi-modal interaction gestures (mouse wheel, touch fling, mouse drag, arrow/page keyboard navigation).\n- **`Draw.connectors`**: Synchronizes scroll state variables and thumb positions.\n- **`Draw.room`**: Transforms room-scoped scenes and viewport view bounds.\n\n---\n\n## Table of Contents\n1. [Overview & Core Architecture](#overview--core-architecture)\n2. [Data Structures (`ScrollerConfig`)](#data-structures-scrollerconfig)\n3. [Public API Reference (`Draw.scroller(...)`)](#public-api-reference-drawscroller)\n4. [Programmatic Scrolling Controls](#programmatic-scrolling-controls)\n   - [`scroll_to`, `set_scroll`, `scroll_by`](#scroll_to-set_scroll-scroll_by)\n   - [`scroll_to_ip`, `center_ip`](#scroll_to_ip-center_ip)\n   - [`get_scroll`](#get_scroll)\n5. [Interactivity, Locking & Lifecycle Controls](#interactivity-locking--lifecycle-controls)\n   - [`lock()`, `unlock()`, `enable()`, `disable()`](#lock-unlock-enable-disable)\n   - [`get(ip)`, `list()`, `remove(ip)`](#getip-list-removeip)\n6. [Keyboard & Gesture Sensing](#keyboard--gesture-sensing)\n7. [Comprehensive Code Examples](#comprehensive-code-examples)\n\n---\n\n## Overview & Core Architecture\n\nThe `Draw.scroller` engine decouples user gesture inputs from canvas pixel coordinate updates:\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                     User Interactions                    \u2502\n\u2502   (Mouse Wheel, Touch Fling, Track Drag, Arrow Keys)     \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                            \u2502 Dispatches to\n                            \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                        Draw.senses                       \u2502\n\u2502 - mouse_scroll_up / down                                 \u2502\n\u2502 - touch_move / drag_move                                 \u2502\n\u2502 - key_press (Up, Down, PageUp, PageDown, Home, End)      \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                            \u2502 Evaluates physics via\n                            \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                        Draw.motion                       \u2502\n\u2502 - Kinetic inertia fling deceleration                     \u2502\n\u2502 - 2nd-order spring bounce at boundary bounds             \u2502\n\u2502 - Smooth exponential interpolation                       \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                            \u2502 Synchronizes via\n                            \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                      Draw.connectors                     \u2502\n\u2502 - Updates _DrawCanvas._scroll_x and _scroll_y            \u2502\n\u2502 - Repositions Draw.shape scrollbar thumb & track         \u2502\n\u2502 - Offsets Draw.room coordinate placements                \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n## Data Structures (`ScrollerConfig`)\n\nEvery scroller is tracked internally as a `ScrollerConfig` object:\n\n```python\n@dataclass\nclass ScrollerConfig:\n    id: str\n    display: str                               # Target window tag\n    direction: str = \"vertical\"                # \"vertical\", \"horizontal\", or \"both\"\n    ip: str = \"\"                               # Unique identifier\n    room: Optional[Any] = None                 # Room identifier being scrolled\n    max_x: Optional[float] = None              # Maximum horizontal scroll range (px)\n    max_y: Optional[float] = None              # Maximum vertical scroll range (px)\n    speed: float = 1.0                         # Scroll sensitivity multiplier\n    align: str = \"right\"                       # Scrollbar placement (\"right\", \"left\", \"top\", \"bottom\")\n    thumb: Optional[Any] = None                # Custom thumb shape IP or bool\n    motion: Optional[Any] = None               # Motion IP or preset (\"spring\", \"inertia\", \"smooth\")\n    inertia: bool = False                      # Enable momentum fling physics\n    snap: Optional[float] = None               # Grid interval snap (px)\n    keyboard: bool = True                      # Enable keyboard navigation keys\n    show_thumb: bool = False                   # Explicitly render track + thumb shapes\n    enabled: bool = True                       # Scroller active toggle\n    locked: bool = False                       # User interaction lock toggle\n    thumb_color: str = \"#5b6880\"               # Thumb shape color\n    track_color: str = \"#2a2f3a\"               # Track shape color\n    thumb_width: float = 12.0                  # Scrollbar thickness in pixels\n    track_opacity: int = 100                   # Track background opacity (0-100)\n```\n\n---\n\n## Public API Reference (`Draw.scroller(...)`)\n\nInitializes and registers a scroller controller for a window or room:\n\n```python\nscroller = Draw.scroller(\n    ip            = \"main_scroll\",      # Unique identifier\n    display       = \"main\",             # Target window tag (auto-resolved if single window)\n    room          = \"content_page\",     # Optional room identifier to move during scrolling\n    scroll        = \"vertical\",         # \"vertical\", \"horizontal\", or \"both\" (alias: direction=)\n    max_y         = 2500,               # Max vertical scroll extent in pixels\n    max_x         = None,               # Max horizontal scroll extent in pixels\n    speed         = 1.0,                # Scrolling multiplier (e.g. 1.5 for faster response)\n    align         = \"right\",            # Scrollbar placement: \"right\", \"left\", \"top\", \"bottom\"\n    show_thumb    = True,               # Render visual track & thumb shapes\n    thumb_color   = \"#60a5fa\",          # Thumb pill color\n    track_color   = \"#1e293b\",          # Track gutter color\n    thumb_width   = 10.0,               # Gutter width in pixels\n    inertia       = True,               # Fling momentum physics\n    snap          = None,               # Interval to snap scroll offsets (e.g. 100.0)\n    keyboard      = True,               # Enable Arrow, PageUp, PageDown, Home, End keys\n)\n```\n\n---\n\n## Programmatic Scrolling Controls\n\n### `scroll_to`, `set_scroll`, `scroll_by`\n\n* **`Draw.scroller.scroll_to(value=None, *, x=None, y=None, display=None, ip=None, animate=False, duration=0.25)`**: Scrolls to absolute pixel offsets. When `animate=True`, smoothly interpolates to the target position.\n* **`Draw.scroller.set_scroll(value=None, *, x=None, y=None, display=None, ip=None)`**: Immediately sets scroll offset without animation (`animate=False`).\n* **`Draw.scroller.scroll_by(delta=None, *, dx=0.0, dy=0.0, display=None, ip=None, animate=False, duration=0.25)`**: Shifts current scroll offset by a relative delta value.\n\n---\n\n### `scroll_to_ip`, `center_ip`\n\n* **`Draw.scroller.scroll_to_ip(target_ip: str, *, display=None, ip=None, animate=False, align=\"center\", offset=0.0)`**: Automatically calculates coordinates of `target_ip` (shape or text element) and scrolls until it enters the viewport.\n  - Supported `align` modes: `\"top\"`, `\"bottom\"`, `\"left\"`, `\"right\"`, `\"center\"`, `\"visible\"` (scrolls only if outside viewport).\n* **`Draw.scroller.center_ip(target_ip: str, *, display=None, ip=None, animate=False)`**: Smoothly centers `target_ip` directly in the middle of the viewport.\n\n---\n\n### `get_scroll`\n\n* **`Draw.scroller.get_scroll(display=None, ip=None) -> Dict[str, float]`**: Returns current active scroll offsets:\n  ```python\n  {\"x\": 0.0, \"y\": 420.5}\n  ```\n\n---\n\n## Interactivity, Locking & Lifecycle Controls\n\n### `lock()`, `unlock()`, `enable()`, `disable()`\n\n* **`Draw.scroller.lock(ip=None)` / `unlock(ip=None)`**: Prevents user interactions (wheel, drag, touch, keyboard) from moving the canvas, while still allowing programmatic `scroll_to()` commands.\n* **`Draw.scroller.disable(ip=None)` / `enable(ip=None)`**: Toggles complete scroller execution state.\n\n---\n\n### `get(ip)`, `list()`, `remove(ip)`\n\n* **`Draw.scroller.get(ip: str) -> Optional[ScrollerConfig]`**: Returns active scroller configuration.\n* **`Draw.scroller.list() -> List[Dict[str, Any]]`**: Returns serialized dictionary list of all active scrollers.\n* **`Draw.scroller.remove(ip: Optional[str] = None) -> None`**: Unregisters a scroller, automatically cleaning up attached wheel/touch senses, keyboard handlers, and connector links.\n\n---\n\n## Keyboard & Gesture Sensing\n\nWhen `keyboard=True` is enabled, the scroller automatically hooks the following keyboard commands:\n\n| Key Press | Vertical Action | Horizontal Action |\n| :--- | :--- | :--- |\n| **Up / Down Arrow** | Shifts $\\pm 40\\text{px} \\times \\text{speed}$ | \u2014 |\n| **Left / Right Arrow** | \u2014 | Shifts $\\pm 40\\text{px} \\times \\text{speed}$ |\n| **Page Up / Page Down**| Shifts $\\pm 400\\text{px} \\times \\text{speed}$ | \u2014 |\n| **Home** | Scrolls to top ($y = 0$) | Scrolls to left ($x = 0$) |\n| **End** | Scrolls to bottom ($y = \\text{max\\_y}$) | Scrolls to right ($x = \\text{max\\_x}$) |\n\n---\n\n## Comprehensive Code Examples\n\n### 1. Long Feed Page with Smooth Wheel Scrolling & Thumb\n```python\nimport Draw\n\nwin = Draw.window(tag=\"main\", title=\"Social Feed\", width=600, height=800)\n\n# Build content cards extending beyond window height\nfor i in range(15):\n    Draw.shape(\n        display=\"main\",\n        ip=f\"card_{i}\",\n        vertices=4,\n        size=[500, 100],\n        x=50,\n        y=40 + i * 130,\n        color=\"#1e293b\",\n        border_radius=8,\n    )\n    Draw.text(display=\"main\", text=f\"Feed Item #{i+1}\", x=80, y=75 + i * 130, color=\"white\")\n\n# Initialize vertical scroller\nDraw.scroller(\n    ip=\"feed_scroll\",\n    display=\"main\",\n    scroll=\"vertical\",\n    max_y=15 * 130 + 100,\n    speed=1.2,\n    show_thumb=True,\n    thumb_color=\"#38bdf8\",\n    track_color=\"#0f172a\",\n    thumb_width=8.0,\n    inertia=True,\n)\n\nDraw.window.run(\"main\")\n```\n\n### 2. Programmatic Navigation with `scroll_to_ip`\n```python\n# Jump and center card #10 smoothly in the viewport\nDraw.scroller.center_ip(\"card_9\", display=\"main\", animate=True)\n```\n"

    "content": "# Comprehensive Technical Documentation: Draw Graph Engine (`Draw._graph`)\n\n`Draw._graph` (`Draw.graph`) is the high-level declarative charting, data visualization, real-time streaming, and interactive graphics engine for the **Draw** framework. Built on top of `Draw._shapes`, `Draw._text`, `Draw._point`, `Draw._motion`, `Draw.senses`, `Draw._align`, `Draw._live`, and `Draw.room`, it provides a rich suite of 2D presentation charts with real-time live data binding updates, Hold & Move canvas dragging, 2D entrance animations, interactive hover tooltips, dynamic axis auto-scaling, and stateful layout engine interop.\n\n---\n\n## 1. System Architecture\n\nThe `Draw._graph` module operates via the `_GraphRegistry` singleton exposed as `Draw.graph`. It converts raw or reactive user data series into structured visual elements\u2014drawing grid lines, axes, titles, bars, dots, dynamic legend boxes, sector wedges, radar webs, and native vector line paths onto target window canvases.\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                              Draw.graph()                              \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                                    \u2502 parses series dicts & customise\n                                    \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                            _GraphRegistry                              \u2502\n\u2502 - Computes pixel bounds, Y-axis auto-scaling, margins, and bar slots  \u2502\n\u2502 - Unwraps Draw._live reactive references (LiveRef, dynamic callbacks)   \u2502\n\u2502 - Connects Draw._align positioning and Draw.room layout interop        \u2502\n\u2502 - Registers live GraphDef state (bounds, series, window, offsets)      \u2502\n\u2514\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n     \u2502                 \u2502                   \u2502                  \u2502\n     \u25bc                 \u25bc                   \u25bc                  \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510 \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510 \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510 \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 Draw._shapes \u2502 \u2502 Draw._point \u2502 \u2502   Draw._motion    \u2502 \u2502 Draw.senses \u2502\n\u2502 & Draw._text \u2502 \u2502 - Catmull-  \u2502 \u2502 - 2D Springs, Path\u2502 \u2502 - Automatic \u2502\n\u2502 - Bars, Dots,\u2502 \u2502   Rom Vector\u2502 \u2502   Trimming, Scale \u2502 \u2502   Hover     \u2502\n\u2502   Wedges,    \u2502 \u2502   Splines & \u2502 \u2502   Pop-in Entrance \u2502 \u2502   Tooltips &\u2502\n\u2502   Grids,     \u2502 \u2502   Filled    \u2502 \u2502   Animations      \u2502 \u2502   Hold &    \u2502\n\u2502   Titles     \u2502 \u2502   Areas     \u2502 \u2502                   \u2502 \u2502   Move Drag \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518 \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518 \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518 \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n## 2. Public API Signatures & Methods\n\n### 2.1 Main Function Signature (`Draw.graph(...)`)\n\n```python\nDraw.graph(\n    ip            = \"sales_chart\",       # Unique identifier for chart & room placement\n    type          = \"bar\",               # Chart type ('bar', 'stacked_bar', 'line', 'area', 'dot', 'pie', 'donut', 'radar')\n    graph         = [{...}, {...}],      # List of series specification dicts\n    tag           = \"main\",              # Target window tag (or display=)\n    display       = \"main\",              # Alias for tag\n    align         = \"center\",            # Alignment spec inside canvas or layout cell (via Draw._align)\n    get_ip        = \"grid_layout\",       # Layout set identifier for grid placement (via Draw._layout)\n    columns       = 0,                   # Layout cell column/index\n    x             = 50,                  # Explicit X coordinate override\n    y             = 80,                  # Explicit Y coordinate override\n    width         = 600,                 # Explicit plot width override\n    height        = 400,                 # Explicit plot height override\n    size          = [600, 400],          # Explicit [width, height] tuple/list override\n    animate       = False,               # Enable 2D entry animations (via Draw._motion)\n    hover         = True,                # Enable interactive element highlights (via Draw.senses)\n    tooltip       = True,                # Enable automatic floating tooltip cards (via Draw.senses)\n    draggable     = False,               # Enable Hold & Move canvas dragging\n    hold_and_move = False,               # Alias for draggable\n    customise     = {},                  # Chart-level styling dictionary\n)\n```\n\n### 2.2 Dynamic Live Updating (`Draw.graph.update_live`)\n\n```python\nDraw.graph.update_live(window_tag: Optional[str] = None) -> None\n```\nRe-evaluates all active `Draw._live` reactive references (`LiveRef`, dynamic callbacks, `LiveTextBinding`) across registered graphs in `window_tag` and refreshes their rendering smoothly in real time without screen tearing.\n\n### 2.3 Stateful `_GraphRegistry` Interop Methods\n\n| Method | Signature | Description |\n|---|---|---|\n| `get_by_ip` | `(window_tag: str, ip: str) -> Optional[GraphDef]` | Returns the live `GraphDef` record containing bounds, series data, customise, and offsets. |\n| `get_pixel_bounds` | `(window_tag: str, ip: str) -> Optional[Tuple[float, float, float, float]]` | Returns `(x, y, w, h)` of the chart's pixel bounding box. |\n| `get_intrinsic_size`| `(window_tag: str, ip: str) -> Optional[Tuple[float, float]]` | Returns `(width, height)` for `_room_size.resolve_size_spec` layout interop. |\n| `move_by_ip` | `(window_tag: str, ip: str, x: float, y: float) -> bool` | Shifts chart bounds so its top-left lands at pixel `(x, y)`. |\n| `resize_by_ip` | `(window_tag: str, ip: str, width: float, height: float) -> bool` | Resizes chart recorded bounds for room layout accounting. |\n| `clear` | `(window_tag: str) -> int` | Removes all graph registrations for `window_tag`. |\n\n---\n\n## 3. Supported Chart Types (`_GRAPH_TYPES`)\n\n`Draw.graph` supports 9 presentation chart types:\n\n| Type Token | Alias | Key Features & Visual Geometry |\n| :--- | :--- | :--- |\n| `\"bar\"` | \u2014 | Vertical grouped column chart. Supports multi-series grouping, width ratios (`group_width_ratio`), rounded corners (`border_radius`), zero-baseline alignment, and vector spring entry animations. |\n| `\"stacked_bar\"` | \u2014 | Cumulative vertical stacked column chart where series values accumulate vertically per category slot. |\n| `\"line\"` | \u2014 | Continuous polyline chart using native `Draw._point` vector paths with straight or Catmull-Rom spline curves (`smooth=True` / `curve=True` with `\"40%\"` spline curvature). Animates via SVG `trim_path`. |\n| `\"area\"` | \u2014 | Closed filled area chart filling down to baseline $y = 0$ with custom area fill colors and opacities (`area_opacity`). |\n| `\"stacked_area\"`| \u2014 | Cumulative filled stacked area chart. |\n| `\"dot\"` | `\"scatter\"` | Discrete data point scatter plot. Displays discrete data point symbols with customizable sizes (`point_size`) and polygon vertex counts (`point_vertices`, 24 = circle, 4 = diamond, 3 = triangle). Animates via scale pop-in (`\"ease_out_back\"`). |\n| `\"pie\"` | \u2014 | Circular pie chart rendering sector slices with radius $R$, arc sweep angles, percentage labels, and interactive hover pop-out offsets. |\n| `\"donut\"` | \u2014 | Circular donut chart with an inner cutout hole ($r_{in} = 0.55 R$, `hole_color`) and central summary text metric (`center_text`). |\n| `\"radar\"` | `\"spider\"` | Multi-variable regular polygon radial web chart with spoke axes, concentric grid levels (`spider_levels`), and filled data webs. |\n\n---\n\n## 4. Series Data Schema & `customise` Parameter Reference\n\nA chart is defined by passing a list of series dictionaries to `Draw.graph(graph=[...])`:\n\n```python\ngraph = [\n    {\n        \"x\": [\"Q1\", \"Q2\", \"Q3\", \"Q4\"],      # Required: Category labels or LiveRef\n        \"y\": [120, 240, 180, 310],          # Required: Numerical values or LiveRef\n        \"type\": \"bar\",                      # Optional: Series chart type\n        \"title\": \"Revenue 2026\",           # Optional: Series name for legend & tooltip\n        \"customise\": { ... }                # Optional: Detailed styling & frame settings\n    }\n]\n```\n\n### Complete `KNOWN_GRAPH_CUSTOMISE_KEYS` Dictionary:\n\n| Category | Parameter Key | Type | Default | Description |\n|---|---|:---:|:---:|---|\n| **Layout & Margins** | `\"margin\"` | `int` | `48` | Outer pixel margin surrounding the plot frame. |\n| | `\"group_width_ratio\"` | `float` | `0.82` | Width ratio of grouped bar band within each X slot (0.1 to 1.0). |\n| | `\"align\"` | `str`/`tuple` | `None` | Alignment anchor inside canvas or cell (via `Draw._align`). |\n| **Titles & Typography** | `\"title\"` | `str` | `\"\"` | Chart header title text. |\n| | `\"title_font_size\"` | `int` | `16` | Font size of header title. |\n| | `\"title_color\"` | `str` | `\"#DCEBFF\"` | Color of header title text. |\n| | `\"x_title\"` | `str` | `\"\"` | X-axis title label text. |\n| | `\"y_title\"` | `str` | `\"\"` | Y-axis title label text (rotated $-90^\\circ$ vertically). |\n| | `\"axis_title_size\"` | `int` | `12` | Font size of axis titles. |\n| | `\"axis_title_color\"` | `str` | `\"#AEC9E7\"` | Color of axis titles. |\n| | `\"label_color\"` | `str` | `\"#E0E0E0\"` | Color of X-axis category labels. |\n| | `\"label_font_size\"`| `int` | `11` | Font size of X-axis category labels. |\n| **Grid & Axes** | `\"show_line\"` | `bool` | `False` | Toggle drawing grid lines and axis background frame. |\n| | `\"grid_lines\"` | `int` | `5` | Number of horizontal background grid line divisions. |\n| | `\"grid_color\"` | `str` | `\"#D6DDE6\"` | Color of grid lines. |\n| | `\"grid_width\"` | `int` | `1` | Stroke width of grid lines in pixels. |\n| | `\"axis_color\"` | `str` | `\"#8DA0B8\"` | Color of main X and Y axis baseline lines. |\n| | `\"y_tick_color\"` | `str` | `\"#9CAEC2\"` | Color of Y-axis numerical tick labels. |\n| | `\"min_y\"` | `float` | `None` | Explicit minimum Y-axis bound override. |\n| | `\"max_y\"` | `float` | `None` | Explicit maximum Y-axis bound override. |\n| **Value Callouts** | `\"show_values\"` | `bool` | `False` | Toggle numerical value labels on top of bars/points. |\n| | `\"value_color\"` | `str` | `\"#BBD4FF\"` | Color of value callout text. |\n| | `\"value_font_size\"`| `int` | `10` | Font size of value callout text. |\n| | `\"value_decimals\"` | `int` | `0` | Decimal precision for value formatting. |\n| **Colors & Styling** | `\"color\"` | `str`/`list` | `\"blue\"` | Fill color name, hex code, RGB tuple, or color array. |\n| | `\"border_width\"` | `int` | `0` | Outline border width in pixels. |\n| | `\"border_color\"` | `str` | `\"black\"` | Outline border color. |\n| | `\"line_width\"` | `int` | `3` | Stroke width for line charts in pixels. |\n| | `\"line_color\"` | `str` | `\"blue\"` | Color of line chart stroke. |\n| | `\"smooth\"`/`\"curve\"`| `bool` | `False` | Enables Catmull-Rom spline vector path curve smoothing. |\n| | `\"point_size\"` | `int` | `10` | Size of scatter plot dots in pixels. |\n| | `\"point_vertices\"`| `int` | `24` | Polygon vertices for scatter points (24 = circle). |\n| **Pie / Donut / Radar**| `\"hole_color\"` | `str` | `\"#1E293B\"` | Background fill color of donut chart center hole. |\n| | `\"center_text\"` | `str` | `\"\"` | Primary metric text displayed in center of donut hole. |\n| | `\"spider_levels\"` | `int` | `4` | Concentric grid polygon levels for radar charts. |\n| **Legend** | `\"show_legend\"` | `bool` | `False` | Toggle multi-series legend panel. |\n| | `\"legend_position\"`| `str` | `\"top-right\"`| Position: `\"top-right\"`, `\"top-left\"`, `\"bottom-right\"`, `\"bottom-left\"`, `\"outside-right\"`. |\n| | `\"legend_color\"` | `str` | `\"#D0DCF0\"`| Color of legend text. |\n| | `\"legend_font_size\"`| `int` | `11` | Font size of legend text. |\n| **Motion & Dragging** | `\"animate\"` | `bool` | `False` | Enable 2D Motion Engine entrance animations. |\n| | `\"stiffness\"` | `float` | `300.0` | Vector spring stiffness for bar entrance animations. |\n| | `\"damping\"` | `float` | `22.0` | Vector spring damping for bar entrance animations. |\n| | `\"draggable\"`/`\"hold_and_move\"`| `bool` | `False` | Enable interactive Hold & Move canvas chart dragging. |\n\n---\n\n## 5. Live Data Streaming & Color Pipeline (`name of graph` -> `color` -> `live.py`)\n\n`Draw.graph` seamlessly connects with `Draw._colour` (`Draw.color`) and `Draw._live` (`Draw.live`) to establish a unified reactive visual pipeline:\n\n```\n  name of graph (Draw.graph)\n         \u2502  queries color by shape IP / slice IP\n         \u25bc\n     Draw.color (_colour.py)\n         \u2502  evaluates HSV expressions & unwraps live refs\n         \u25bc\n     Draw.live (_live.py)\n```\n\n1. **Passing Live References (`Draw.live.ref`)**:\n   Instead of static lists, pass `Draw.live.ref(\"key_name\")`, `LiveTextBinding`, or dynamic lambdas `lambda: fetch_data()` into series `x`, `y`, or `color` attributes.\n\n2. **Universal Color System Binding (`Draw.color`)**:\n   - Graph shapes and pie/donut wedges (`{namespace}:wedge:0:{idx}`) can be bound directly to `Draw.color(ip=..., color=[...])`.\n   - `Draw.color` supports HSV time expressions (`\"h\": \"time * 45\"`), opacity, gradients, and live variables from `Draw.live` (`\"h\": \"live_hue\"`).\n   - Pie charts automatically extract colors registered in `Draw.color` or resolved via `Draw.live`.\n\n3. **Triggering Live Refreshes (`Draw.graph.update_live`)**:\n   Calling `Draw.graph.update_live(window_tag)` re-evaluates all live references across registered graphs and updates their rendering smoothly in real time. The original `get_ip`/`columns` grid-cell placement, `align`, `animate`, `hover`, `tooltip`, and `draggable` options are preserved automatically across every refresh.\n\n```python\nimport Draw\n\n# 1. Initialize reactive live variables\nDraw.live.set(\"times\", [\"10:00\", \"10:01\", \"10:02\"])\nDraw.live.set(\"values\", [100, 150, 130])\nDraw.live.set(\"hue_val\", 120.0)  # Live color hue\n\n# 2. Bind slice color dynamically via Draw.color\nDraw.color(\n    ip=\"pie_chart:wedge:0:0\",\n    color=[{\"for\": \"body\", \"h\": \"hue_val\", \"s\": 100, \"v\": 100}]\n)\n\n# 3. Bind chart to live data\nDraw.graph(\n    ip=\"pie_chart\",\n    type=\"pie\",\n    graph=[{\n        \"x\": [\"Dynamic Slice\", \"Other A\", \"Other B\"],\n        \"y\": Draw.live.ref(\"values\"),\n        \"customise\": {\"color\": [\"#3B82F6\", \"#10B981\", \"#EC4899\"]}\n    }]\n)\n\n# Streaming data update callback\ndef on_new_data(t_str, val, new_hue):\n    t_list = Draw.live.get(\"times\") + [t_str]\n    v_list = Draw.live.get(\"values\") + [val]\n    Draw.live.set(\"times\", t_list)\n    Draw.live.set(\"values\", v_list)\n    Draw.live.set(\"hue_val\", new_hue)\n    Draw.graph.update_live(\"main\")\n```\n\n---\n\n## 6. Hold & Move Canvas Dragging (`draggable=True`)\n\nCharts can be held with a mouse click and dragged interactively across the canvas:\n\n- **Enabling Dragging**: Pass `draggable=True` or `hold_and_move=True` in `Draw.graph(...)` or `\"draggable\": True` in `customise`.\n- **Interactive Dragging Mechanics**:\n  - The chart container frame (`{namespace}:graph_container`) is registered with interactive hitboxes and mouse drag senses (`Draw.senses(\"mouse_drag\")`).\n  - Dragging the chart smoothly updates `offset_x` and `offset_y`, moving all bars, lines, axes, ticks, titles, and legend panels in real time!\n  - `GraphDef` bounds and `Draw.room` layout positions are updated automatically.\n  - The chart's original `get_ip`/`columns` grid-cell placement (and `align`, `animate`, `hover`, `tooltip` options) are preserved across the drag redraw, so a dragged chart stays sized to its grid cell \u2014 only its `offset_x`/`offset_y` change.\n\n---\n\n## 7. 2D Motion Engine Integration (`Draw._motion`)\n\nWhen `\"animate\": True` is passed (or set in `customise`), `Draw.graph` automatically triggers 2D entrance animations using `Draw._motion`:\n\n- **Bars & Stacked Bars**: Bars spring up from the baseline using vector spring kinetics (`\"spring\"` or `\"ease_out_cubic\"`).\n- **Lines & Areas**: Line paths draw in progressively using SVG `\"trim_path\"` (`[0, 0]` $\\rightarrow$ `[0, 100]`) over 1.2s.\n- **Dots & Scatter Points**: Data points pop into view using `\"scale\"` with overshoot (`\"ease_out_back\"`).\n- **Pie & Donut Slices**: Slices sweep out from center with fan-out scale transitions.\n- **Radar Webs**: Radar polygon webs expand radially from the central origin.\n\n---\n\n## 8. Automatic Hover & Interactive Tooltips (`Draw.senses`)\n\n`Draw.graph` automatically registers interactive hitboxes for every rendered chart element:\n- Bars: `{namespace}:bar:{series_idx}:{item_idx}`\n- Dots: `{namespace}:point:{series_idx}:{item_idx}`\n- Wedges: `{namespace}:wedge:{series_idx}:{slice_idx}`\n\n### Hover Behavior:\nHovering over any element automatically triggers an interactive floating tooltip card (`{namespace}:tooltip`) displaying:\n- Series Title\n- Category Label / X-Value\n- Formatted Numerical Value & Percentage\n\n---\n\n## 9. Layout Engine & Alignment Integration (`Draw.room` & `Draw._align`)\n\n- **Alignment Anchoring (`Draw._align`)**: Supports `align` parameter mapping directly through `calculate_alignment_pos` (`\"center\"`, `\"top-left\"`, `\"bottom-right\"`, etc.).\n- **Room Engine Interop (`Draw.room`)**: State is registered in `_GraphRegistry` (`GraphDef`). Exposes:\n  - `get_by_ip(window_tag, ip)` $\\rightarrow$ `GraphDef`\n  - `get_pixel_bounds(window_tag, ip)` $\\rightarrow$ `(x, y, w, h)`\n  - `get_intrinsic_size(window_tag, ip)` $\\rightarrow$ `(w, h)` for `_room_size` resolution\n  - `move_by_ip(window_tag, ip, x, y)` $\\rightarrow$ Relocates chart\n  - `resize_by_ip(window_tag, ip, w, h)` $\\rightarrow$ Resizes chart bounds\n  - `clear(window_tag)` $\\rightarrow$ Clears window registrations\n\n---\n\n## 10. Comprehensive Production Code Example\n\n```python\nimport Draw\n\nDraw.window(tag=\"dashboard\", title=\"Executive Live Dashboard\", width=1000, height=700)\n\n# Bind reactive live data\nDraw.live.set(\"quarters\", [\"Q1\", \"Q2\", \"Q3\", \"Q4\"])\nDraw.live.set(\"sales\", [120, 240, 180, 310])\n\n# 1. Draggable, Animated, Live Bar & Line Chart\nDraw.graph(\n    ip=\"sales_chart\",\n    type=\"bar\",\n    tag=\"dashboard\",\n    align=\"top-left\",\n    draggable=True,  # Hold & Move enabled!\n    animate=True,    # 2D Motion Engine entry!\n    hover=True,      # Interactive hover tooltips!\n    graph=[\n        {\n            \"x\": Draw.live.ref(\"quarters\"),\n            \"y\": Draw.live.ref(\"sales\"),\n            \"title\": \"Revenue ($K)\",\n            \"customise\": {\n                \"color\": \"#3B82F6\",\n                \"show_values\": True,\n                \"show_line\": True,\n                \"show_legend\": True,\n            }\n        }\n    ]\n)\n\n# 2. Donut Chart with Central Summary Metric\nDraw.graph(\n    ip=\"market_share\",\n    type=\"donut\",\n    tag=\"dashboard\",\n    align=\"top-right\",\n    draggable=True,\n    animate=True,\n    graph=[\n        {\n            \"x\": [\"Direct\", \"Organic\", \"Referral\"],\n            \"y\": [45, 35, 20],\n            \"title\": \"Traffic Sources\",\n            \"customise\": {\n                \"color\": [\"#10B981\", \"#F59E0B\", \"#6366F1\"],\n                \"center_text\": \"100%\",\n            }\n        }\n    ]\n)\n\n# 3. Radar / Spider Hero Attribute Chart\nDraw.graph(\n    ip=\"hero_radar\",\n    type=\"radar\",\n    tag=\"dashboard\",\n    align=\"bottom-left\",\n    graph=[\n        {\n            \"x\": [\"Speed\", \"Power\", \"Defense\", \"Agility\", \"Stamina\"],\n            \"y\": [85, 92, 78, 88, 95],\n            \"title\": \"Attribute Metrics\",\n        }\n    ]\n)\n\nDraw.window.run(\"dashboard\")\n```\n"

    "content": "# Draw._point Module Documentation\n\n`Draw._point` (`Draw.point`) is the vector path, Catmull-Rom spline, and line animation drawing system for the `Draw` library. Operating as a lightweight PySide6 `_PointCanvas` overlay on top of window canvases, it renders sequences of coordinates as smooth stroked and filled vector paths with per-path animation channels, hit testing, and layout engine interop.\n\n---\n\n## Table of Contents\n1. [Overview & Architecture](#overview--architecture)\n2. [Public API Signatures](#public-api-signatures)\n3. [Authoring Style 1 \u2014 Normal Path](#authoring-style-1--normal-path)\n4. [Authoring Style 2 \u2014 Custom Path (Column-Schema)](#authoring-style-2--custom-path-column-schema)\n5. [Catmull-Rom Splines & Curve Bends](#catmull-rom-splines--curve-bends)\n6. [Animation Engine (`_AnimChannel`)](#animation-engine-_animchannel)\n7. [Precise Path Hit Testing & Draw.senses Integration](#precise-path-hit-testing--drawsenses-integration)\n8. [Stateful `_PointRegistry` & Layout Engine Interop](#stateful-_pointregistry--layout-engine-interop)\n9. [Performance & Canvas Overlay Lifecycle](#performance--canvas-overlay-lifecycle)\n10. [Comprehensive Code Examples](#comprehensive-code-examples)\n\n---\n\n## Overview & Architecture\n\nThe `Draw._point` module centers around `_PointRegistry` (singleton exposed as `Draw.point`) and `_PointCanvas` (a transparent `QWidget` overlay). It translates graph-space coordinate specs into resolution-scaled `QPainterPath` geometry.\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                      Draw.point()                        \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                            \u2502 parses Style 1 / Style 2 dicts into\n                            \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                        PathDef                           \u2502\n\u2502   (Coords, Stroke, Fill, Spline Tension, Anim Channels)  \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                            \u2502 stored in\n                            \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                      _PointCanvas                        \u2502\n\u2502 - Scales graph-space coordinates [graph_w, graph_h]     \u2502\n\u2502 - Evaluates Catmull-Rom splines & line-reveal animation  \u2502\n\u2502 - QPainterPathStroker precise hit testing & event filter \u2502\n\u2502 - Automatic 60 FPS QTimer start/stop lifecycle           \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n## Public API Signatures\n\n### `Draw.point(...)`\n\nRenders path definitions to a display window.\n\n```python\nDraw.point(\n    tag     = \"main\",           # Window identifier (or display=)\n    display = \"main\",           # Alias for tag\n    graph   = [800, 600],       # Canvas coordinate space [width, height]\n    points  = [{...}, {...}],   # List of path definition dicts\n)\n```\n\n---\n\n## Authoring Style 1 \u2014 Normal Path\n\nStyle 1 defines paths using a coordinate string in the `\"path\"` key:\n\n```python\n{\n    \"path\": \"10,10 ; 50,30 ; 90,70\",     # Coordinate string (x,y pairs)\n    \"colour\": \"cyan\",                   # Stroke color (\"colour\" or \"color\")\n    \"width\": 3,                         # Stroke width in pixels\n    \"edge\": \"curve\",                    # \"straight\" | \"curve\"\n    \"smooth\": \"40%\",                    # Catmull-Rom spline tension (0-100%)\n    \"curve_at\": {\"25%\": \"15%\"},          # Perpendicular deflection bend spec\n    \"fill\": True,                       # Close and fill subpath\n    \"fill_colour\": \"navy\",              # Fill color (default same as colour)\n    \"opacity\": 90,                      # Path opacity (0 - 100)\n    \"animation\": {                      # Animation channels\n        \"line_animation\": {\"0%-100%\": \"ease\"},\n        \"opacity\": {\"0%-50%\": \"linear\"},\n    },\n    \"ip\": \"my_path_id\",                 # Unique path registration key\n    \"hit_box\": [{\"width\": \"20px\"}],     # Interactive hitbox marker\n    \"return\": [\"text\", \"val\"],          # Interaction return spec for Draw.input\n}\n```\n\n### Style 1 Attribute Reference\n\n| Attribute | Type | Default | Description |\n| :--- | :--- | :--- | :--- |\n| `path` | `str` | Required | Semicolon or newline-separated `\"x,y ; x,y\"` coordinate string. |\n| `colour` / `color` | `str` \\| `tuple` | `\"white\"` | Path stroke color. |\n| `width` | `float` | `1` | Stroke width in pixels. |\n| `edge` | `str` | `\"straight\"` | Line mode (`\"straight\"` or `\"curve\"`). |\n| `smooth` | `str` \\| `float` | `\"40%\"` | Spline tension for curved edges (`\"0%\"` to `\"100%\"`). |\n| `curve_at` | `dict` \\| `str` | `None` | Bend deflection dictionary (`{\"progress%\": \"deflect%\"}`). |\n| `fill` | `bool` | `False` | Close and fill path interior. |\n| `fill_colour` | `str` \\| `tuple` | Same as stroke | Path interior fill color. |\n| `opacity` | `int` | `100` | Path opacity percentage (0-100). |\n| `animation` | `dict` | `None` | Animation channel definitions. |\n| `ip` | `str` | `None` | Identifier tag for room placement and hit dispatch. |\n\n---\n\n## Authoring Style 2 \u2014 Custom Path (Column-Schema)\n\nStyle 2 uses a tabular column-schema dictionary where the `\"item\"` key specifies column names, and coordinate keys (`\"x,y\"`) specify row values:\n\n```python\n{\n    \"item\":   [\"time\", \"edge\",     \"animation\",      \"colour\" ],\n    \"10,20\":  [\"0s\",   \"straight\", \"line_animation\", \"white\"  ],\n    \"40,60\":  [\"1s\",   \" \",        \"line_animation\", \"cyan\"   ],\n    \"80,30\":  [\"2s\",   \"curve\",    \" \",              \"blue\"   ],\n\n    \"ip\": \"custom_path\",\n    \"hit_box\": [{\"width\": \"20px\", \"height\": \"20px\"}],\n}\n```\n\n### Recognised Column Names\n\n- `time`: Point reveal timestamp string (`\"0.5s\"`, `\"500ms\"`).\n- `edge`: `\"straight\"` or `\"curve\"`.\n- `smooth`: Catmull-Rom tension string (`\"40%\"`).\n- `curve_at`: Shorthand bend string (`\"10%:20%\"`).\n- `animation`: Animation channel name string.\n- `graph`: Easing name string (`\"linear\"`, `\"ease\"`, `\"ease_in\"`, `\"ease_out\"`).\n- `colour` / `color`: Stroke color value.\n- `width`: Stroke width value.\n- `opacity`: Opacity value (0-100).\n- `fill` / `fill_colour`: Path fill properties.\n\n---\n\n## Catmull-Rom Splines & Curve Bends\n\nWhen `edge=\"curve\"` is set:\n- **Catmull-Rom Splines**: `_build_curve_path` evaluates cubic splines through coordinate control points using the configured `smooth` tension factor.\n- **Perpendicular Deflections (`curve_at`)**: `_insert_curve_bends` injects perpendicular offset points at progress positions along segments:\n  ```python\n  \"curve_at\": {\"50%\": \"20%\"}  # Bends 20% of segment length at mid-point\n  ```\n\n---\n\n## Animation Engine (`_AnimChannel`)\n\n`Draw.point` features a built-in animation engine supporting draw-on line reveals and opacity transitions:\n\n```python\n\"animation\": {\n    \"line_animation\": {\"0%-100%\": \"ease\"},   # Progressively draws stroke from start to end\n    \"opacity\":        {\"0%-50%\":  \"linear\"}, # Fades in during first half of animation\n}\n```\n\n### Easing Functions Supported\n- `\"linear\"`\n- `\"ease\"` (smoothstep)\n- `\"ease_in\"` / `\"easein\"`\n- `\"ease_out\"` / `\"easeout\"`\n- `\"ease_in_out\"` / `\"easeinout\"`\n\n### Automatic Timer Lifecycle\nThe underlying `QTimer` runs at ~60 FPS (`16ms`) during animation. Once all channels reach `global_t >= 1.0`, the timer automatically stops to conserve CPU resources.\n\n---\n\n## Precise Path Hit Testing & Draw.senses Integration\n\nUnlike bounding box hit tests, `_PointCanvas._hit_path_at` uses `QPainterPathStroker` to construct exact stroke boundary geometries:\n\n- **Stroke Area Detection**: Constructs a stroke area with width `max(10.0, stroke_width + 4.0)` for easy touch/mouse clicking along line paths.\n- **Filled Path Detection**: For filled shapes (`fill=True`), tests both interior area (`closed.contains(pos)`) and stroke area.\n- **Senses Events Dispatched**:\n  - `mouse_press`, `mouse_release`, `mouse_leftclick`, `mouse_rightclick`, `mouse_click`, `mouse_doubleclick`\n- **Return Spec Integration**: Populates `Draw._text._store_input_return_value` when `return` spec is defined.\n\n---\n\n## Stateful `_PointRegistry` & Layout Engine Interop\n\nRendered point paths with an `ip` tag register inside `_PointRegistry` for dynamic querying and placement by `Draw.room`.\n\n### Public Methods on `Draw.point`:\n\n```python\n# Query live PathDef object by IP\npath_def = Draw.point.get_by_ip(window_tag=\"main\", ip=\"my_path\")\n\n# Get path pixel bounding box (x, y, w, h)\nbounds = Draw.point.get_pixel_bounds(window_tag=\"main\", ip=\"my_path\")\n\n# Get intrinsic size (width, height) in pixels\nsize = Draw.point.get_intrinsic_size(window_tag=\"main\", ip=\"my_path\")\n\n# Move path bounding-box top-left to pixel (x, y)\nsuccess = Draw.point.move_by_ip(window_tag=\"main\", ip=\"my_path\", x=150, y=200)\n\n# Scale path coordinates to target pixel dimensions\nsuccess = Draw.point.resize_by_ip(window_tag=\"main\", ip=\"my_path\", width=300, height=150)\n\n# Remove a registered path and clean up empty overlay\nremoved = Draw.point.remove_by_ip(window_tag=\"main\", ip=\"my_path\")\n\n# Clear all point path registrations for a window\ncount = Draw.point.clear(window_tag=\"main\")\n```\n\n---\n\n## Performance & Canvas Overlay Lifecycle\n\n- **Stale Overlay Disposal**: When `Draw.point()` is called repeatedly, unused `_PointCanvas` instances without active named paths are cleaned up, preventing QTimer memory leaks.\n- **Geometry Caching**: `PathDef` caches computed `QPainterPath` geometry in `_cached_geom` using a cache key (`(coords, reveal_frac, cw, ch, edge, smooth)`), avoiding geometry re-evaluations when static.\n\n---\n\n## Comprehensive Code Examples\n\n### Example 1: Animated Smooth Spline Path with Fill\n\n```python\nimport Draw\n\nDraw.window(tag=\"main\", width=800, height=600, background_color=\"#090D16\")\n\nDraw.point(\n    tag=\"main\",\n    graph=[800, 600],\n    points=[\n        {\n            \"path\": \"50,300 ; 200,100 ; 400,450 ; 600,150 ; 750,300\",\n            \"colour\": \"#38BDF8\",\n            \"width\": 4,\n            \"edge\": \"curve\",\n            \"smooth\": \"50%\",\n            \"fill\": True,\n            \"fill_colour\": \"#0284C7\",\n            \"opacity\": 80,\n            \"animation\": {\n                \"line_animation\": {\"0%-100%\": \"ease\"},\n                \"opacity\": {\"0%-40%\": \"linear\"},\n            },\n            \"ip\": \"wave_path\",\n        }\n    ],\n)\n\nDraw.window.run(\"main\")\n```\n\n### Example 2: Interactive Custom Schema Path with Hitbox & Senses\n\n```python\nimport Draw\n\nDraw.window(tag=\"main\", width=800, height=600, background_color=\"#111827\")\n\nDraw.point(\n    tag=\"main\",\n    graph=[800, 600],\n    points=[\n        {\n            \"item\":   [\"time\", \"edge\",     \"animation\",      \"colour\" ],\n            \"100,500\": [\"0s\",  \"straight\", \"line_animation\", \"#A855F7\"],\n            \"300,200\": [\"1s\",  \"curve\",    \"line_animation\", \"#EC4899\"],\n            \"500,400\": [\"2s\",  \"curve\",    \"line_animation\", \"#F43F5E\"],\n            \"700,100\": [\"3s\",  \"straight\", \" \",              \"#10B981\"],\n            \"ip\": \"interactive_path\",\n            \"hit_box\": [{\"width\": \"24px\", \"height\": \"24px\"}],\n            \"return\": [\"text\", \"path_clicked\"],\n        }\n    ],\n)\n\ndef on_path_click(event):\n    print(\"Point path clicked!\", event)\n\nDraw.senses(ip=\"interactive_path\", press=on_path_click)\n\nDraw.window.run(\"main\")\n```\n"
